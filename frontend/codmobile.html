}

@media(max-width:360px){
  .catalogo,.lista-ofertas,#catalogo,#catalogoOfertas,#listaOfertas{gap:6px!important}

  }

#catalogoOfertas .producto > .producto-precio{

#catalogoOfertas .producto > .producto-estado{

#catalogoOfertas .producto-oferta > .oferta-icono{
  display:none!important;
}
#listaOfertas .boton-oferta,
.lista-ofertas .boton-oferta{
  display:grid!important;
  grid-template-columns:40px minmax(0,1fr)!important;
  grid-template-rows:minmax(0,1fr) auto!important;

  max-width:40px!important;

#listaOfertas .foto-oferta img,

<body>

<header>

    <a class="encabezado-pagina" href="juegos.html" aria-label="Volver atrás"><span class="encabezado-pagina-icono" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/><path d="M9 12h11"/></svg></span><span class="encabezado-pagina-titulo">Call of Duty Mobile</span></a>

</header>


<main class="contenedor">

    <section class="juego">

        <div class="icono">🎯</div>

        <h1>Call of Duty Mobile</h1>

        <p class="descripcion">
            Recarga tus CP de Call of Duty Mobile de forma rápida y sencilla.
        </p>


        <label for="id">
            ID del jugador
        </label>

        <input
            type="text"
            id="id"
            placeholder="Escribe tu ID de Call of Duty"
            autocomplete="off"
        >


        <label for="cantidad">
            Cantidad
        </label>

        <select id="cantidad">

            <option value="">
                Selecciona una cantidad
            </option>

            <option value="80 CP">
                80 CP
            </option>

            <option value="420 CP">
                420 CP
            </option>

            <option value="880 CP">
                880 CP
            </option>

            <option value="2400 CP">
                2400 CP
            </option>

            <option value="5000 CP">
                5000 CP
            </option>

        </select>


        <button
            class="recargar"
            id="botonRecarga"
            type="button"
            onclick="continuarRecarga()"
        >
            Continuar ⚡
        </button>


        <!-- =========================
             OFERTAS ESPECIALES
             ========================= -->

        <div class="separador-ofertas">

            <button
                class="boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas Especiales
            </button>

        </div>
</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


/* =========================
   ABRIR OFERTAS ESPECIALES
   ========================= */

function abrirOfertas() {

    window.location.href =
    "checkout.html?id=" + encodeURIComponent(pedido);
}


/* =========================
   RECARGA COD MOBILE
   ========================= */

async function continuarRecarga() {

    const idJugador =
        document.getElementById("id").value.trim();

    const cantidad =
        document.getElementById("cantidad").value;

    const boton =
        document.getElementById("botonRecarga");


    if (idJugador === "") {

        alert(
            "Escribe tu ID de Call of Duty Mobile."
        );

        return;
    }


    if (cantidad === "") {

        alert(
            "Selecciona una cantidad."
        );

        return;
    }


    boton.disabled = true;

    boton.textContent =
        "Procesando...";


    try {

        /* =========================
           COMPROBAR SESIÓN
        ========================= */

        const {
            data: { session },
            error: sessionError
        } =
            await supabaseClient.auth.getSession();


        if (sessionError || !session) {

            alert(
                "Debes iniciar sesión primero."
            );

            window.location.href =
                "login.html";

            return;
        }


        /* =========================
           BUSCAR PRODUCTO
        ========================= */

        const {
            data: producto,
            error: productoError
        } =
            await supabaseClient
                .from("game_products")
                .select(
                    "id, game, product_name, game_currency_amount, price_gvr, active"
                )
                .eq("game", "COD Mobile")
                .eq("product_name", cantidad)
                .eq("active", true)
                .maybeSingle();


        console.log(
            "PRODUCTO COD MOBILE:",
            producto
        );

        console.log(
            "ERROR PRODUCTO:",
            productoError
        );


        if (productoError) {

            alert(
                "Error buscando el producto:\n\n" +
                productoError.message
            );

            return;
        }


        if (!producto) {

            alert(
                "No se encontró ese producto de COD Mobile en Gamers Gold Top-Up."
            );

            return;
        }


        /* =========================
           REALIZAR COMPRA
        ========================= */

        const {
            data: pedido,
            error: compraError
        } =
            await supabaseClient.rpc(
                "purchase_game_product",
                {
                    p_product_id: producto.id,
                    p_player_id: idJugador
                }
            );


        if (compraError) {

            console.error(
                "ERROR COMPRA:",
                compraError
            );

            alert(
                "No se pudo realizar la compra:\n\n" +
                compraError.message
            );

            return;
        }


        /* =========================
           COMPRA EXITOSA
        ========================= */

        alert(

            "¡Compra realizada! ⚡\n\n" +

            producto.product_name +
            "\n" +

            "Precio: " +
            (await window.ggGetResellerDiscountedPrice(Number(producto.price_gvr))).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) +
            " GVR\n\n" +

            "ID del pedido:\n" +
            pedido

        );


        window.location.href =
            "cuenta.html";


    } catch (error) {

        console.error(error);

        alert(

            "Ocurrió un error inesperado:\n\n" +
            error.message

        );

    } finally {

        boton.disabled = false;

        boton.textContent =
            "Continuar ⚡";

    }

}

</script>

</body>
