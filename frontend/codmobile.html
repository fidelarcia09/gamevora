<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Call of Duty Mobile | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            border-bottom: 1px solid #12385f;
            background: #071225;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
        }

        .logo .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .inicio {
            text-decoration: none;
            color: white;
            border: 1px solid #168cff;
            padding: 9px 13px;
            border-radius: 9px;
            font-size: 13px;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 25px 18px;
        }

        .juego {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.12);
        }

        .icono {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #b8c9dc;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        .recargar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .recargar:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .nota {
            text-align: center;
            color: #627b97;
            font-size: 11px;
            margin-top: 20px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <span class="rayo">⚡</span> Gamers Gold Top-Up
    </div>

    <a href="juegos.html" class="inicio">
        ← Juegos
    </a>
</header>

<main class="contenedor">

    <section class="juego">

        <div class="icono">🎯</div>

        <h1>Call of Duty Mobile</h1>

        <p class="descripcion">
            Recarga tus CP de Call of Duty Mobile de forma rápida y sencilla.
        </p>

        <label for="id">ID del jugador</label>

        <input
            type="text"
            id="id"
            placeholder="Escribe tu ID de Call of Duty"
            autocomplete="off"
        >

        <label for="cantidad">Cantidad</label>

        <select id="cantidad">
            <option value="">Selecciona una cantidad</option>
            <option value="80 CP">80 CP</option>
            <option value="420 CP">420 CP</option>
            <option value="880 CP">880 CP</option>
            <option value="2400 CP">2400 CP</option>
            <option value="5000 CP">5000 CP</option>
        </select>

        <button
            class="recargar"
            id="botonRecarga"
            type="button"
            onclick="continuarRecarga()"
        >
            Continuar ⚡
        </button>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


async function continuarRecarga() {

    const idJugador =
        document.getElementById("id").value.trim();

    const cantidad =
        document.getElementById("cantidad").value;

    const boton =
        document.getElementById("botonRecarga");


    if (idJugador === "") {

        alert(
            "Escribe tu ID de Call of Duty Mobile."
        );

        return;
    }


    if (cantidad === "") {

        alert(
            "Selecciona una cantidad."
        );

        return;
    }


    boton.disabled = true;

    boton.textContent = "Procesando...";


    try {

        /* =========================
           COMPROBAR SESIÓN
        ========================= */

        const {
            data: { session },
            error: sessionError
        } =
            await supabaseClient.auth.getSession();


        if (sessionError || !session) {

            alert(
                "Debes iniciar sesión primero."
            );

            window.location.href = "login.html";

            return;
        }


        /* =========================
           BUSCAR PRODUCTO
        ========================= */

        const {
            data: producto,
            error: productoError
        } =
            await supabaseClient
                .from("game_products")
                .select(
                    "id, game, product_name, game_currency_amount, price_gvr, active"
                )
                .eq("game", "COD Mobile")
                .eq("product_name", cantidad)
                .eq("active", true)
                .maybeSingle();


        console.log(
            "PRODUCTO COD MOBILE:",
            producto
        );

        console.log(
            "ERROR PRODUCTO:",
            productoError
        );


        if (productoError) {

            alert(
                "Error buscando el producto:\n\n" +
                productoError.message
            );

            return;
        }


        if (!producto) {

            alert(
                "No se encontró ese producto de COD Mobile en Gamevora."
            );

            return;
        }


        /* =========================
           REALIZAR COMPRA
        ========================= */

        const {
            data: pedido,
            error: compraError
        } =
            await supabaseClient.rpc(
                "purchase_game_product",
                {
                    p_product_id: producto.id,
                    p_player_id: idJugador
                }
            );


        if (compraError) {

            console.error(
                "ERROR COMPRA:",
                compraError
            );

            alert(
                "No se pudo realizar la compra:\n\n" +
                compraError.message
            );

            return;
        }


        /* =========================
           COMPRA EXITOSA
        ========================= */

        alert(
            "¡Compra realizada! ⚡\n\n" +

            producto.product_name +
            "\n" +

            "Precio: " +
            producto.price_gvr +
            " GVR\n\n" +

            "ID del pedido:\n" +
            pedido
        );


        window.location.href =
            "cuenta.html";


    } catch (error) {

        console.error(error);

        alert(
            "Ocurrió un error inesperado:\n\n" +
            error.message
        );

    } finally {

        boton.disabled = false;

        boton.textContent =
            "Continuar ⚡";
    }
}

</script>

</body>
    </html>
