    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        :root {
            --fondo: #050b18;
            --tarjeta: #09152b;
            --azul: #078cff;
            --cian: #00d9ff;
            --borde: #123b70;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% 20%,
                    rgba(0, 105, 255, 0.08),
                    transparent 45%
                ),
                var(--fondo);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ENCABEZADO */

        header {
            background: rgba(8, 21, 45, 0.96);
            border-bottom: 1px solid #123b70;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 5;
        }

        .logo {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 0.7px;
        }

        .rayo {
            color: var(--cian);
            text-shadow: 0 0 12px var(--azul);
        }

        .logo span {
            color: white;
        }

        .volver {
            color: white;
            text-decoration: none;
            border: 1px solid var(--azul);
            padding: 9px 13px;
            border-radius: 9px;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }

        .volver:hover {
            background: rgba(0, 140, 255, 0.15);
            box-shadow: 0 0 12px rgba(0, 140, 255, 0.3);
        }

        /* BANNER */

        .banner {
            margin: 18px;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid #145ca3;
            box-shadow: 0 0 25px rgba(0, 128, 255, 0.15);
        }

        .banner-imagen {
            display: block;
            width: 100%;
            height: auto;
        }

        /* SPLASH GAMING */
        .splash-juegos {
            position: relative;
            min-height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 18px;
            isolation: isolate;
            background:
                radial-gradient(ellipse at 50% 115%, rgba(0, 217, 255, .25), transparent 52%),
                linear-gradient(125deg, #07152b 0%, #0a2850 48%, #071326 100%);
        }
        .splash-juegos::before,
        .splash-juegos::after {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(0, 190, 255, .18);
            border-radius: 13px;
            pointer-events: none;
        }
        .splash-juegos::after {
            inset: 0;
            border: 0;
            border-radius: 0;
            background: linear-gradient(110deg, transparent 15%, rgba(0, 190, 255, .07) 50%, transparent 85%);
            z-index: -1;
        }
        .splash-luz {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            filter: blur(45px);
            opacity: .45;
            pointer-events: none;
            z-index: -1;
        }
        .splash-luz-1 { left: -35px; top: -55px; background: #087cff; }
        .splash-luz-2 { right: -35px; bottom: -65px; background: #00d9ff; }
        .splash-contenido {
            position: relative;
            z-index: 1;
            width: 100%;
            text-align: center;
        }
        .splash-marca {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #fff;
            font-size: clamp(16px, 4vw, 23px);
            font-weight: 900;
            font-style: italic;
            letter-spacing: 1.2px;
            text-shadow: 0 0 14px rgba(0, 174, 255, .45);
        }
        .splash-marca small {
            display: block;
            margin-top: 1px;
            font-size: 9px;
            letter-spacing: 4px;
            text-align: center;
        }
        .splash-simbolo {
            color: var(--cian);
            font-size: 40px;
            line-height: .9;
            font-weight: 900;
            text-shadow: 0 0 8px #00bfff, 0 0 22px #087cff;
            transform: skew(-12deg);
        }
        .splash-etiqueta {
            margin-top: 14px;
            color: #7adfff;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 4px;
        }
        .splash-contenido h1 {
            margin-top: 8px;
            font-size: clamp(22px, 5vw, 34px);
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: -.7px;
            text-shadow: 0 3px 18px rgba(0, 0, 0, .5);
        }
        .splash-contenido h1 span {
            color: var(--cian);
            text-shadow: 0 0 16px rgba(0, 190, 255, .45);
        }
        .splash-descripcion {
            margin-top: 8px;
            color: #b7d6ef;
            font-size: 12px;
            letter-spacing: .7px;
        }
        .splash-linea {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 15px auto 0;
        }
        .splash-linea span {
            width: 42px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--cian));
            box-shadow: 0 0 7px var(--cian);
        }
        .splash-linea span:last-child { transform: rotate(180deg); }
        .splash-linea i {
            width: 5px;
            height: 5px;
            border: 1px solid var(--cian);
            transform: rotate(45deg);
            box-shadow: 0 0 8px var(--cian);
        }

        /* CATÁLOGO */

        .juegos {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 22px 35px;
        }

        .titulo {
            text-align: center;
            margin: 18px 0 34px;
            font-size: 25px;
            font-weight: 900;
        }

        .titulo span {
            color: var(--cian);
            text-shadow: 0 0 14px rgba(0, 180, 255, 0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
            align-items: stretch;
        }

        /* TARJETA COMPLETA */

        .juego {
            min-width: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            text-decoration: none;
            color: white;
            background: linear-gradient(155deg, #0b192d, #07101e);
            border: 1px solid rgba(105, 158, 215, .15);
            border-radius: 13px;
            padding: 0;
            text-align: left;
            isolation: isolate;
            transition: border-color .22s ease, transform .22s ease;
        }

        .juego:hover {
            transform: translateY(-4px);
            border-color: rgba(32, 197, 255, .55);
        }

        .juego-proximamente {
            cursor: not-allowed;
            opacity: .78;
        }

        .juego-proximamente:hover {
            transform: none;
        }

        .juego-proximamente .juego-imagen::before {
            display: none;
        }

        .juego-proximamente .juego-info {
            justify-content: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .juego-proximamente .juego-info h3 {
            text-align: center;
            overflow-wrap: normal;
            word-break: normal;
        }

        .juego-proximamente .juego-info p {
            display: block;
            flex-basis: 100%;
            text-align: center;
            color: #ffd166;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .4px;
        }

        .juego-proximamente:hover .juego-imagen,
        .juego-proximamente:hover .juego-info {
            border-color: rgba(0, 153, 255, 0.9);
            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.28), 0 0 13px rgba(0, 140, 255, 0.16);
        }

        /* MARCO DE LA FOTO */

        .juego-imagen {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;
            flex-shrink: 0;

            border: none;
            border-radius: 0;

            background:
                radial-gradient(
                    ellipse at 50% 80%,
                    rgba(0, 123, 255, 0.25),
                    transparent 72%
                ),
                linear-gradient(180deg, #0c2040, #071020 90%);

            box-shadow:
                0 0 13px rgba(0, 140, 255, 0.22),
                inset 0 0 20px rgba(0, 153, 255, 0.10);

            overflow: hidden;
            z-index: 1;
        }

        /* FOTO: MISMO TAMAÑO QUE EL MARCO */

        .juego-imagen img {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center center;

            display: block;
            max-width: 100%;

            transition:
                transform 0.25s ease,
                filter 0.25s ease;
        }

        .juego:hover .juego-imagen img {
            transform: scale(1.02);
            filter: brightness(1.05);
        }

        /* LUZ SUPERIOR */

        .juego-imagen::before {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            top: 0;
            height: 1px;

            background: var(--cian);

            box-shadow:
                0 0 8px var(--cian),
                0 0 16px var(--azul);

            z-index: 3;
            pointer-events: none;
        }

        /* BORDE INTERIOR */

        .juego-imagen::after {
            content: "";
            position: absolute;
            inset: 5px;

            border: 1px solid rgba(0, 190, 255, 0.16);
            border-radius: 9px 9px 0 0;

            pointer-events: none;
            z-index: 3;
        }

        /* NOMBRE DEBAJO DE LA FOTO */

        .juego-info {
            position: relative;
            width: 100%;
            min-height: 57px;
            flex: 0 0 auto;

            padding: 12px;

            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 7px;

            background: linear-gradient(
                180deg,
                #0c1c35,
                #081326
            );

            border: none;
            border-radius: 0;

            box-shadow:
                0 5px 16px rgba(0, 0, 0, 0.28),
                0 0 13px rgba(0, 140, 255, 0.16);

            z-index: 4;
        }

        .juego-info h3 {
            min-width: 0;
            font-size: 13px;
            line-height: 1.35;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .juego-info p {
            display: none;
            color: #6fcaff;
            font-size: 10px;
            line-height: 1.2;
            font-weight: 600;
        }

        /* RESPLANDOR AL INTERACTUAR */

        .juego:hover .juego-imagen,
        .juego:hover .juego-info {
            box-shadow: none;
        }

        .juego-flecha {
            width: 23px;
            height: 23px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 7px;
            background: rgba(0, 153, 255, .1);
            color: var(--cian);
        }

        .juego-flecha svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* PIE DE PÁGINA */

        footer {
            text-align: center;
            padding: 30px 18px;
            color: #647890;
            font-size: 12px;
            border-top: 1px solid #102a49;
            margin-top: 10px;
        }

        footer strong {
            color: #279fff;
        }

        /* TELÉFONOS PEQUEÑOS */

        @media (max-width: 760px) {
            .juegos {
                padding-left: 14px;
                padding-right: 14px;
            }

            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .juego-info {
                min-height: 49px;
                padding: 9px;
            }

            .juego-info h3 {
                font-size: 11px;
            }

            .juego-flecha {
                width: 21px;
                height: 21px;
            }

            .logo {
                font-size: 18px;
            }

            .splash-juegos {
                min-height: 170px;
                padding: 24px 14px;
            }

            .splash-etiqueta {
                letter-spacing: 2.5px;
            }

            .catalogo-herramientas {
                align-items: stretch;
                flex-direction: column;
            }

            .buscador-juegos {
                width: 100%;
            }
        }

        /* ACCESIBILIDAD */

        @media (prefers-reduced-motion: reduce) {
            .juego,
            .juego-imagen img,
            .volver {
                transition: none;
            }
        }

<script>
(() => {
    const buscador = document.getElementById("buscar-juego");
    const lista = document.getElementById("lista-juegos");
    const contador = document.getElementById("cantidad-juegos");
    const sinResultados = document.getElementById("sin-resultados");
    if (!buscador || !lista || !contador || !sinResultados) return;

    const tarjetas = Array.from(lista.querySelectorAll(".juego"));
    const normalizar = texto => texto
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLocaleLowerCase("es");

    const actualizar = () => {
        const termino = normalizar(buscador.value.trim());
        let visibles = 0;

        tarjetas.forEach(tarjeta => {
            const nombre = normalizar(tarjeta.querySelector("h3")?.textContent || "");
            const coincide = nombre.includes(termino);
            tarjeta.hidden = !coincide;
            if (coincide) visibles++;
        });

        contador.textContent = visibles;
        sinResultados.hidden = visibles !== 0;
        lista.hidden = visibles === 0;
    };

    buscador.addEventListener("input", actualizar);
    actualizar();
})();
</script>
