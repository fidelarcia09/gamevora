    .boton-atras{display:inline-flex;align-items:center;gap:9px;width:fit-content;max-width:100%;margin:0 auto 0 0;color:#eaf7ff;text-decoration:none;font-size:13px;font-weight:800;line-height:1}.icono-atras{width:38px;height:38px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #17649a;border-radius:11px;background:linear-gradient(145deg,#103b65,#08203b);color:#4bcaff;box-shadow:0 5px 15px rgba(0,21,45,.45)}.icono-atras svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.boton-atras:hover .icono-atras{border-color:#28a9ff;background:linear-gradient(145deg,#145184,#09294b)}.boton-atras:focus-visible{outline:2px solid #75d7ff;outline-offset:3px;border-radius:8px}

<body>

<header>

    <div class="logo">
        <span class="rayo">⚡</span> Gamers Gold Top-Up
    </div>

    <a href="pubgmobile.html" class="boton-atras"><span class="icono-atras" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/><path d="M9 12h11"/></svg></span><span>Atrás</span></a>

</header>

<main>

    <div class="contenedor">

        <div class="icono">🎯</div>

        <h1>Resumen del pedido</h1>

        <p class="descripcion">
            Revisa los datos antes de continuar.
        </p>

        <div class="dato">

            <span>Juego</span>

            <strong>PUBG Mobile</strong>

        </div>

        <div class="dato">

            <span>ID del jugador</span>

            <strong id="mostrarId">
                Cargando...
            </strong>

        </div>

        <div class="dato">

            <span>Cantidad</span>

            <strong id="mostrarCantidad">
                Cargando...
            </strong>

        </div>

        <div class="total">

            <span>Total</span>

            <strong>
                Precio en GVR próximamente
            </strong>

        </div>

        <button
            class="continuar"
            type="button"
            onclick="continuarPedido()"
        >
            Continuar ⚡
        </button>

        <p class="nota">
            Revisa cuidadosamente tu ID antes de continuar.
        </p>

    </div>

</main>

<script>

const parametros =
    new URLSearchParams(
        window.location.search
    );

const id =
    parametros.get("id");

const cantidad =
    parametros.get("cantidad");


document.getElementById(
    "mostrarId"
).textContent =
    id || "No especificado";


document.getElementById(
    "mostrarCantidad"
).textContent =
    cantidad || "No especificada";


function continuarPedido() {

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    const id =
        parametros.get("id");

    const cantidad =
        parametros.get("cantidad");


    const url =
        "confirmar-pubgmobile.html?id=" +
        encodeURIComponent(id) +
        "&cantidad=" +
        encodeURIComponent(cantidad);


    window.location.href =
        url;
}

</script>

    <script src="./goldi-widget.js?v=20261023-2" defer></script>
