/* Destello azul neón visible recorriendo el contorno, como en index.html */
@property --borde-azul-giro {
    syntax: "<angle>";
    inherits: false;
    initial-value: 0deg;
}
body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    padding: 3px;
    pointer-events: none;
    background: conic-gradient(
        from var(--borde-azul-giro),
        transparent 0deg,
        transparent 230deg,
        rgba(0, 132, 255, .35) 265deg,
        #087cff 288deg,
        #7bdcff 302deg,
        #ffffff 308deg,
        #38c5ff 316deg,
        #087cff 330deg,
        rgba(0, 132, 255, .35) 350deg,
        transparent 360deg
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    animation: bordeAzulRecorrido 4.8s linear infinite;
    opacity: 1;
    filter: drop-shadow(0 0 3px rgba(0, 153, 255, .9));
}
@keyframes bordeAzulRecorrido {
    to { --borde-azul-giro: 360deg; }
}
@media (prefers-reduced-motion: reduce) {
    body::after {
        animation-duration: 12s;
        opacity: .95;
    }
}

<script>

);

window.ggTurnstileToken = "";
window.onTurnstileSuccess = function(token) { window.ggTurnstileToken = token; };
window.onTurnstileExpired = function() { window.ggTurnstileToken = ""; };

document.getElementById("botonGoogleLogin").addEventListener("click", async function() {
    const boton = this;
    boton.disabled = true;
    boton.textContent = "Conectando con Google...";
    try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: "google",
            options: {
                redirectTo: "https://fidelarcia09.github.io/gamevora/index.html",
                queryParams: { prompt: "select_account" }
            }
        });
        if (error) throw error;
    } catch (error) {
        console.error("Error al iniciar sesión con Google:", error);
        alert("No se pudo iniciar sesión con Google. Comprueba la configuración del proveedor Google en Supabase Auth.\n\n" + (error.message || "Error inesperado."));
        boton.disabled = false;
        boton.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.9c-.58 2.96-2.26 5.48-4.74 7.18l7.66 5.94c4.48-4.14 7.16-10.24 7.16-17.59z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.81l-7.66-5.94c-2.13 1.44-4.86 2.3-8.24 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continuar con Google';
    }
});

document.getElementById("formLogin").addEventListener("submit", async function(event) {

    event.preventDefault();

    const correo =
        document.getElementById("correo").value.trim();

    const contrasena =
        document.getElementById("contrasena").value;

    const boton =
        document.getElementById("botonEntrar");

    if (!window.ggTurnstileToken) {
        alert("Completa la verificación de seguridad antes de iniciar sesión.");
        return;
    }

    boton.disabled = true;
    boton.textContent = "Iniciando sesión...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: correo,
            password: contrasena,
            options: {
                captchaToken: window.ggTurnstileToken
            }
        });

    if (error) {

        window.ggTurnstileToken = "";
        if (window.turnstile) window.turnstile.reset();

        boton.disabled = false;
        boton.textContent = "Iniciar sesión ⚡";

        const mensaje =
            (error.message || "").toLowerCase();

        if (
            mensaje.includes("email not confirmed") ||
            mensaje.includes("email_not_confirmed") ||
            mensaje.includes("correo no confirmado")
        ) {

            alert(
                "📧 Correo no confirmado\n\n" +
                "Debes confirmar tu correo electrónico antes de iniciar sesión.\n\n" +
                "Revisa la bandeja de entrada de " +
                correo +
                " y también la carpeta de spam."
            );

            return;
        }

        alert(
            "No se pudo iniciar sesión:\n\n" +
            error.message
        );

        return;
    }

    alert("¡Inicio de sesión correcto! ⚡");

    window.location.href = "../index.html";
});
</script>
