<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#edf5ff">
<title>Iniciar sesión | Gamers Gold Top-Up</title>
<style>
:root{--navy:#07162d;--navy2:#0b2547;--blue:#087cff;--cyan:#24c8f5;--muted:#66758a}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
html{min-height:100%;background:#edf5ff}
body{min-height:100svh;overflow-x:hidden;padding:18px 18px 30px;color:var(--navy);background:radial-gradient(ellipse at 50% 12%,rgba(65,165,255,.2),transparent 37%),radial-gradient(ellipse at 90% 76%,rgba(44,203,245,.13),transparent 32%),linear-gradient(180deg,#eaf2ff 0%,#f8fbff 54%,#eaf6ff 100%)}
body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(18,104,185,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,104,185,.045) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}
.page{position:relative;z-index:1;width:min(100%,470px);margin:0 auto}
.top{height:56px;display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:8px}
.back{position:absolute;left:0;top:2px;width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(35,111,184,.12);border-radius:15px;background:rgba(255,255,255,.94);color:var(--navy);text-decoration:none;box-shadow:0 6px 18px rgba(22,73,120,.08)}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.brand{font-size:18px;font-weight:950;letter-spacing:-.6px;color:var(--navy);text-align:center}
.brand .gold{color:#087cff}
.brand small{display:block;margin-top:2px;font-size:9px;letter-spacing:3px;color:#3b6a99}
.hero{height:235px;position:relative;display:grid;place-items:center;margin:0 auto 5px;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;width:218px;height:218px;border:1px solid rgba(24,151,235,.22);border-radius:50%;box-shadow:0 0 35px rgba(0,151,255,.09),inset 0 0 35px rgba(0,151,255,.07)}
.hero:after{width:270px;height:120px;transform:rotate(-24deg);border-color:rgba(0,186,255,.24)}
.hero img{position:relative;z-index:1;display:block;width:min(86%,230px);height:205px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(0,183,255,.45));animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-7px)}}
.spark{position:absolute;border-radius:50%;background:#39cafa;box-shadow:0 0 15px #39cafa}
.spark.one{width:13px;height:13px;left:13%;top:35%}.spark.two{width:9px;height:9px;right:13%;top:24%}.spark.three{width:7px;height:7px;right:20%;bottom:22%}
.eyebrow{display:flex;align-items:center;gap:9px;margin:0 0 10px;color:#1265b5;font-size:13px;font-weight:900;letter-spacing:2.5px}
.eyebrow:before{content:"";width:28px;height:4px;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--cyan));box-shadow:0 0 10px rgba(0,140,255,.35)}
h1{margin:0 0 10px;font-size:clamp(35px,8vw,48px);line-height:1.05;font-weight:950;letter-spacing:-1.7px;color:#071426}
h1 span{background:linear-gradient(90deg,#075be8,#18aeea);-webkit-background-clip:text;background-clip:text;color:transparent}
.description{margin:0 0 23px;color:var(--muted);font-size:16px;line-height:1.55}
.google{width:100%;min-height:66px;display:flex;align-items:center;justify-content:center;gap:13px;margin:0 0 18px;padding:14px 18px;border:1px solid rgba(24,69,115,.08);border-radius:22px;background:#fff;color:#101827;font-size:17px;font-weight:850;box-shadow:0 8px 22px rgba(28,72,112,.10);cursor:pointer;transition:transform .2s,box-shadow .2s}
.google:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(28,72,112,.14)}
.google:disabled{opacity:.65;cursor:wait;transform:none}
.google svg{width:23px;height:23px;flex:0 0 23px}
.separator{display:flex;align-items:center;gap:12px;margin:1px 0 18px;color:#7d8da2;font-size:13px}
.separator:before,.separator:after{content:"";height:1px;flex:1;background:rgba(60,105,150,.18)}
label{display:block;margin:0 0 7px;color:#354c67;font-size:13px;font-weight:750}
input{display:block;width:100%;min-height:54px;margin:0 0 16px;padding:15px;border:1px solid rgba(62,111,158,.2);border-radius:15px;background:rgba(255,255,255,.96);color:#10223b;font-size:15px;outline:none;box-shadow:0 4px 14px rgba(27,75,120,.045);transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#8996a7}
input:focus{border-color:#168ee8;box-shadow:0 0 0 3px rgba(25,145,230,.12)}
.forgot{display:block;text-align:right;margin:-7px 0 14px;color:#0878d9;text-decoration:none;font-size:13px;font-weight:750}
.forgot:hover{text-decoration:underline}
.captcha-wrap{display:flex;justify-content:center;min-height:65px;margin:13px 0 16px;overflow:visible}
.submit,.create{width:100%;min-height:66px;display:flex;align-items:center;justify-content:center;gap:11px;margin-top:2px;padding:13px 16px;border:1px solid rgba(0,183,255,.42);border-radius:15px;background:linear-gradient(145deg,#0b315a,#071329);color:#fff;font-size:15px;font-weight:800;text-decoration:none;text-align:center;box-shadow:0 0 18px rgba(0,183,255,.14),inset 0 0 14px rgba(0,140,255,.05);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .22s ease,background .22s ease,transform .22s ease,box-shadow .22s ease}
.submit:hover,.create:hover{border-color:#00b7ff;background:linear-gradient(145deg,#104675,#083b70);box-shadow:0 0 20px rgba(0,183,255,.22),inset 0 0 14px rgba(0,140,255,.08);transform:translateY(-2px)}
.submit:disabled{opacity:.65;cursor:not-allowed;transform:none}
.new-account{text-align:center;margin:22px 0 12px;color:#9bb0c8;font-size:14px}
.create svg{width:23px;height:23px;flex:0 0 23px;fill:none;stroke:#00c8ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px rgba(0,200,255,.28))}
.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:27px 0 0}
.benefit{text-align:center;color:#63758b;font-size:11px;font-weight:700;line-height:1.35}
.benefit-icon{width:48px;height:48px;margin:0 auto 8px;display:grid;place-items:center;border:1px solid rgba(60,128,190,.12);border-radius:16px;background:rgba(255,255,255,.86);color:#1686df;box-shadow:0 6px 16px rgba(29,85,137,.08)}
.benefit-icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:480px){body{padding:12px 18px 28px}.hero{height:215px}.hero img{height:190px}.google{min-height:62px;font-size:16px}.description{font-size:15px}.submit,.create{min-height:62px;font-size:14px}}
@media(prefers-reduced-motion:reduce){.hero img{animation:none}.google,.submit,.create{transition:none}}

/* Paleta oficial GGT: se conserva exactamente el diseño y la distribución. */
:root{--navy:#f4f9ff;--navy2:#081a35;--blue:#087cff;--cyan:#20c8f5;--muted:#a8bad0}
html{background:#050b18}
body{color:#f4f9ff;background:radial-gradient(ellipse at 50% 12%,rgba(0,124,255,.22),transparent 37%),radial-gradient(ellipse at 90% 76%,rgba(0,200,245,.12),transparent 32%),linear-gradient(180deg,#050b18 0%,#081a35 54%,#050f20 100%)}
body:before{background-image:linear-gradient(rgba(64,174,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(64,174,255,.055) 1px,transparent 1px)}
.back{border-color:rgba(49,178,240,.25);background:#0b2547;color:#eaf8ff;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.brand{color:#f4f9ff}
.brand .gold{color:#20c8f5}
.brand small{color:#83b9dc}
.hero:before,.hero:after{border-color:rgba(32,200,245,.25);box-shadow:0 0 35px rgba(0,151,255,.13),inset 0 0 35px rgba(0,151,255,.08)}
.eyebrow{color:#55cfff}
h1{color:#f4f9ff}
h1 span{background:linear-gradient(90deg,#087cff,#20c8f5);-webkit-background-clip:text;background-clip:text;color:transparent}
.description{color:#a8bad0}
.google{border:1px solid rgba(104,190,238,.22);background:#f8fbff;color:#101827;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.google:hover{box-shadow:0 12px 26px rgba(0,0,0,.3)}
.separator{color:#91a9c3}
.separator:before,.separator:after{background:rgba(105,169,216,.25)}
label{color:#c8d9ed}
input{border-color:rgba(65,153,213,.34);background:#091a31;color:#f4f9ff;box-shadow:0 4px 14px rgba(0,0,0,.16)}
input::placeholder{color:#8298b2}
input:focus{border-color:#20c8f5;box-shadow:0 0 0 3px rgba(32,200,245,.13)}
.forgot{color:#43c9f5}
.submit,.create{background:linear-gradient(110deg,#087cff,#08b9e8);box-shadow:0 12px 24px rgba(0,124,255,.25)}
.new-account{color:#9bb0c8}
.benefit{color:#9bb0c8}
.benefit-icon{border-color:rgba(69,174,228,.22);background:linear-gradient(145deg,#102b4c,#091a31);color:#39c8f5;box-shadow:0 6px 16px rgba(0,0,0,.2)}


/* Encabezado de Inicio, centrado para la pantalla de acceso. */
.login-header{width:100%;height:70px;display:flex;align-items:center;justify-content:center;position:relative;margin:0 0 8px;padding:0;background:transparent;border:0}
.login-header .back{left:0;top:12px}
.login-header .logo{display:flex;align-items:center;gap:3px;height:58px;min-width:0;text-decoration:none;flex-shrink:0}
.login-header .logo-g{position:relative;width:60px;height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:center}
.login-header .logo-escudo{display:block;width:100%;height:100%;object-fit:contain}
.login-header .logo-copy{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;min-width:0}
.login-header .logo-resto{display:block;white-space:nowrap;font-family:"Arial Black","Trebuchet MS",sans-serif;font-size:clamp(13px,3.8vw,17px);font-weight:900;font-style:italic;letter-spacing:-.45px;line-height:1;color:#f5f8ff;text-shadow:0 2px 0 #102d50,0 4px 12px rgba(0,10,28,.72)}
.login-header .logo-gamers{color:#f7fbff}
.login-header .logo-gold{color:#32dfff}
.login-header .logo-base{display:block;width:100%;height:2px;border-radius:4px;background:linear-gradient(90deg,#16bcef 0%,#42eaff 62%,rgba(66,234,255,0) 100%);box-shadow:0 0 8px rgba(28,204,255,.58)}
@media(max-width:380px){.login-header .logo-g{width:49px;height:52px;flex-basis:49px}.login-header .logo-resto{font-size:12px;letter-spacing:-.5px}}

</style>
</head>
<body>
<main class="page">
  <header class="top login-header">
    <a class="back" href="../index.html" aria-label="Volver al inicio"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6M9 12h12"/></svg></a>
    <a class="logo" href="../index.html" aria-label="Gamers Gold Top-Up, inicio">
      <span class="logo-g" aria-hidden="true"><img class="logo-escudo" src="./gvr-escudo.svg" alt="" width="76" height="76"></span>
      <span class="logo-copy"><span class="logo-resto"><span class="logo-gamers">GAMERS</span> <span class="logo-gold">GOLD TOP UP</span></span><span class="logo-base" aria-hidden="true"></span></span>
    </a>
  </header>

  <div class="hero" aria-hidden="true">
    <i class="spark one"></i><i class="spark two"></i><i class="spark three"></i>
    <img src="./gvr-escudo.svg" alt="Escudo GVR" width="230" height="205">
  </div>

  <div class="eyebrow">ACCESO</div>
  <h1>Entra a <span>tu cuenta</span></h1>
  <p class="description">Tus pedidos, tu saldo y tus logros, en un toque.</p>

  <button class="google" id="botonGoogleLogin" type="button">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.9c-.58 2.96-2.26 5.48-4.74 7.18l7.66 5.94c4.48-4.14 7.16-10.24 7.16-17.59z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.81l-7.66-5.94c-2.13 1.44-4.86 2.3-8.24 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Continuar con Google
  </button>

  <div class="separator">o entra con tu correo</div>

  <form id="formLogin">
    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" placeholder="tucorreo@email.com" autocomplete="email" required>
    <label for="contrasena">Contraseña</label>
    <input type="password" id="contrasena" placeholder="Tu contraseña" autocomplete="current-password" required>
    <a href="recuperar-contrasena.html" class="forgot">¿Olvidaste tu contraseña?</a>
    <div class="captcha-wrap">
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAFkQPUoJGVxIGYNB" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired" data-error-callback="onTurnstileExpired"></div>
    </div>
    <button class="submit" id="botonEntrar" type="submit">Iniciar sesión</button>
  </form>

  <div class="new-account">¿Primera vez en Gamers Gold Top-Up?</div>
  <a class="create" href="registro.html">Crear cuenta gratis <svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>

  <section class="benefits" aria-label="Ventajas de Gamers Gold">
    <div class="benefit"><span class="benefit-icon"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></span>Tus pedidos</div>
    <div class="benefit"><span class="benefit-icon"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span>Actividad</div>
    <div class="benefit"><span class="benefit-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18m-4 5h1"/></svg></span>Saldo GVR</div>
    <div class="benefit"><span class="benefit-icon"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2-5.3L4 9m0-5v5h5"/></svg></span>Historial</div>
  </section>
</main>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = window.supabase.createClient(
  "https://gsuhzcavghsiolmipnzi.supabase.co",
  "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx"
);

window.ggTurnstileToken = "";
window.onTurnstileSuccess = function(token) { window.ggTurnstileToken = token; };
window.onTurnstileExpired = function() { window.ggTurnstileToken = ""; };

document.getElementById("botonGoogleLogin").addEventListener("click", async function() {
  const boton = this;
  boton.disabled = true;
  boton.textContent = "Conectando con Google...";
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: {
        redirectTo: "https://fidelarcia09.github.io/gamevora/index.html",
        queryParams: { prompt: "select_account" }
      }
    });
    if (error) throw error;
  } catch (error) {
    console.error("Error al iniciar sesión con Google:", error);
    alert("No se pudo iniciar sesión con Google. Comprueba la configuración del proveedor Google en Supabase Auth.\n\n" + (error.message || "Error inesperado."));
    boton.disabled = false;
    boton.innerHTML = '<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.9c-.58 2.96-2.26 5.48-4.74 7.18l7.66 5.94c4.48-4.14 7.16-10.24 7.16-17.59z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.81l-7.66-5.94c-2.13 1.44-4.86 2.3-8.24 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg> Continuar con Google';
  }
});

document.getElementById("formLogin").addEventListener("submit", async function(event) {
  event.preventDefault();
  const correo = document.getElementById("correo").value.trim();
  const contrasena = document.getElementById("contrasena").value;
  const boton = document.getElementById("botonEntrar");

  if (!window.ggTurnstileToken) {
    alert("Completa la verificación de seguridad antes de iniciar sesión.");
    return;
  }

  boton.disabled = true;
  boton.textContent = "Iniciando sesión...";

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: correo,
    password: contrasena,
    options: { captchaToken: window.ggTurnstileToken }
  });

  if (error) {
    window.ggTurnstileToken = "";
    if (window.turnstile) window.turnstile.reset();
    boton.disabled = false;
    boton.textContent = "Iniciar sesión";
    const mensaje = (error.message || "").toLowerCase();

    if (mensaje.includes("email not confirmed") || mensaje.includes("email_not_confirmed") || mensaje.includes("correo no confirmado")) {
      alert("📧 Correo no confirmado\n\nDebes confirmar tu correo electrónico antes de iniciar sesión.\n\nRevisa la bandeja de entrada de " + correo + " y también la carpeta de spam.");
      return;
    }
    alert("No se pudo iniciar sesión:\n\n" + error.message);
    return;
  }

  alert("¡Inicio de sesión correcto! ⚡");
  window.location.href = "../index.html";
});
</script>
</body>
</html>
