<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .logo span {
            color: white;
        }

        .titulo {
            text-align: center;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #b8c9dc;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        .olvidaste {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 17px;
            color: #28a9ff;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .olvidaste:hover {
            text-decoration: underline;
        }

        .entrar {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .entrar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .crear {
            text-align: center;
            margin-top: 20px;
            color: #8195ad;
            font-size: 13px;
        }

        .crear a {
            color: #28a9ff;
            text-decoration: none;
            font-weight: bold;
        }

        .nota {
            margin-top: 18px;
            text-align: center;
            color: #627b97;
            font-size: 11px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <span class="rayo">⚡</span> GAMERS GOLD <span>TOP-UP</span>
    </div>

    <h1 class="titulo">Iniciar sesión</h1>

    <p class="descripcion">
        Entra a tu cuenta de Gamers Gold Top-Up.
    </p>

    <form id="formLogin">

        <label for="correo">Correo electrónico</label>

        <input
            type="email"
            id="correo"
            placeholder="tucorreo@email.com"
            required
        >

        <label for="contrasena">Contraseña</label>

        <input
            type="password"
            id="contrasena"
            placeholder="Tu contraseña"
            required
        >

        <a href="recuperar-contrasena.html" class="olvidaste">
            ¿Olvidaste tu contraseña?
        </a>

        <button class="entrar" id="botonEntrar" type="submit">
            Iniciar sesión ⚡
        </button>

    </form>

    <div class="crear">
        ¿No tienes una cuenta?
        <a href="registro.html">Crear cuenta</a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
    "https://gsuhzcavghsiolmipnzi.supabase.co",
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx"
);

document.getElementById("formLogin").addEventListener("submit", async function(event) {

    event.preventDefault();

    const correo =
        document.getElementById("correo").value.trim();

    const contrasena =
        document.getElementById("contrasena").value;

    const boton =
        document.getElementById("botonEntrar");

    boton.disabled = true;
    boton.textContent = "Iniciando sesión...";

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: correo,
            password: contrasena
        });

    if (error) {

        boton.disabled = false;
        boton.textContent = "Iniciar sesión ⚡";

        const mensaje =
            (error.message || "").toLowerCase();

        if (
            mensaje.includes("email not confirmed") ||
            mensaje.includes("email_not_confirmed") ||
            mensaje.includes("correo no confirmado")
        ) {

            alert(
                "📧 Correo no confirmado\n\n" +
                "Debes confirmar tu correo electrónico antes de iniciar sesión.\n\n" +
                "Revisa la bandeja de entrada de " +
                correo +
                " y también la carpeta de spam."
            );

            return;
        }

        alert(
            "No se pudo iniciar sesión:\n\n" +
            error.message
        );

        return;
    }

    alert("¡Inicio de sesión correcto! ⚡");

    window.location.href = "../index.html";
});
</script>

</body>
</html>
