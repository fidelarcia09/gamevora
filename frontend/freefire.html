<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b18">
    <meta name="description" content="Recarga diamantes de Free Fire en Gamers Gold Top-Up.">

    <title>Free Fire | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 650px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 21px;
            font-weight: 900;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .volver {
            color: #28a9ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .card {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
        }

        .icono {
            text-align: center;
            font-size: 52px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .etiqueta {
            display: block;
            margin: 18px 0 10px;
            color: #b8c9dc;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        .estado {
            padding: 13px;
            margin: 18px 0;
            border: 1px solid #204c78;
            border-radius: 10px;
            background: #061226;
            color: #a9c4df;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .estado.error {
            color: #ffaaaa;
            border-color: #843d4b;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .producto {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
            min-height: 110px;
            padding: 15px 12px;
            background: #061226;
            color: white;
            border: 1px solid #164b75;
            border-radius: 13px;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .producto:hover {
            border-color: #168cff;
        }

        .producto.seleccionado {
            border-color: #00baff;
            box-shadow: 0 0 12px rgba(0, 186, 255, 0.15);
        }

        .producto-nombre {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .producto-estado {
            color: #45c8ff;
            font-size: 12px;
            font-weight: bold;
        }

        .separador-ofertas {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #164b8f;
        }

        .boton {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
        }

        .continuar {
            margin-top: 18px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            cursor: not-allowed;
            opacity: 0.55;
        }

        .boton-ofertas {
            background: #07152b;
            color: #28a9ff;
            border: 1px solid #168cff;
            cursor: pointer;
        }

        .nota {
            margin-top: 20px;
            text-align: center;
            color: #8299b4;
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 22px 14px;
            }

            .catalogo {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>
<div class="contenedor">

    <header class="header">
        <div class="logo">
            <span class="rayo">⚡</span> Gamers Gold Top-Up
        </div>

        <a href="juegos.html" class="volver">← Juegos</a>
    </header>

    <main class="card">
        <div class="icono">🔥</div>

        <h1>Free Fire</h1>

        <p class="descripcion">
            Selecciona tu paquete de diamantes de Free Fire.
        </p>

        <label class="etiqueta" for="idjugador">
            ID del jugador
        </label>

        <input
            type="text"
            id="idjugador"
            placeholder="Introduce tu ID de Free Fire"
            autocomplete="off"
        >

        <label class="etiqueta">
            Selecciona una cantidad de diamantes
        </label>

        <div id="estadoCatalogo" class="estado" aria-live="polite">
            Conectando con el catálogo...
        </div>

        <div id="catalogo" class="catalogo"></div>

        <button
            id="botonContinuar"
            class="boton continuar"
            type="button"
            disabled
        >
            Compras temporalmente desactivadas
        </button>

        <div class="separador-ofertas">
            <button
                class="boton boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas especiales
            </button>
        </div>

        <p class="nota">
            Consulta los paquetes de diamantes disponibles.
            Las compras se habilitarán cuando se configuren
            los precios de venta y el sistema de pedidos.
        </p>
    </main>
</div>

<script>
"use strict";

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const URL_CATALOGO =
    SUPABASE_URL + "/functions/v1/nextlevel-catalogo";

const catalogo = document.getElementById("catalogo");
const estadoCatalogo = document.getElementById("estadoCatalogo");

let productoSeleccionado = null;
let productosDisponibles = [];

/* =====================================================
   OFERTAS ESPECIALES
===================================================== */

function abrirOfertas() {
    window.location.href = "ofertas-free-fire.html";
}

/* =====================================================
   ESTADO
===================================================== */

function mostrarEstado(mensaje, esError = false) {
    estadoCatalogo.textContent = mensaje;
    estadoCatalogo.classList.toggle("error", esError);
}

/* =====================================================
   EXTRAER PRODUCTOS
===================================================== */

function extraerProductos(respuesta) {
    if (Array.isArray(respuesta)) {
        return respuesta;
    }

    if (!respuesta || typeof respuesta !== "object") {
        return [];
    }

    if (Array.isArray(respuesta.productos)) {
        return respuesta.productos;
    }

    if (Array.isArray(respuesta.products)) {
        return respuesta.products;
    }

    if (Array.isArray(respuesta.data)) {
        return respuesta.data;
    }

    if (
        respuesta.data &&
        Array.isArray(respuesta.data.products)
    ) {
        return respuesta.data.products;
    }

    return [];
}

/* =====================================================
   IDENTIFICAR PRODUCTOS
===================================================== */

function obtenerProductId(producto) {
    return String(
        producto.productId ||
        producto.product_id ||
        producto.id ||
        ""
    ).trim();
}

function obtenerNombre(producto) {
    return String(
        producto.name ||
        producto.productName ||
        producto.product_name ||
        producto.title ||
        obtenerProductId(producto) ||
        "Paquete de Free Fire"
    ).trim();
}

/* =====================================================
   FILTRAR REGIÓN LATAM & USA
===================================================== */

function esOfertaLATAM(producto) {
    return String(producto.region || "")
        .trim()
        .toUpperCase() === "LATAM & USA";
}

/* =====================================================
   IDENTIFICAR PAQUETES DE DIAMANTES
===================================================== */

function esPaqueteDiamantes(producto) {
    const id = obtenerProductId(producto).toLowerCase();
    const nombre = obtenerNombre(producto).toLowerCase();

    const esDiamantes =
        id.includes("_diamonds") ||
        /\bdiamonds?\b|\bdiamantes\b/.test(nombre);

    const esMembresiaOPase =
        id.includes("membership") ||
        id.includes("booyah_pass") ||
        nombre.includes("membership") ||
        nombre.includes("membresía") ||
        nombre.includes("membresia") ||
        nombre.includes("booyah pass");

    return esDiamantes && !esMembresiaOPase;
}

/* =====================================================
   CARGAR CATÁLOGO DE NEXT LEVEL
===================================================== */

async function cargarCatalogo() {
    productoSeleccionado = null;
    productosDisponibles = [];

    catalogo.replaceChildren();

    mostrarEstado("Conectando con el catálogo...");

    try {
        const respuesta = await fetch(
            URL_CATALOGO + "?game=free-fire",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        let resultado;

        try {
            resultado = await respuesta.json();
        } catch {
            throw new Error(
                "El catálogo devolvió una respuesta no válida."
            );
        }

        console.log("CATÁLOGO FREE FIRE:", resultado);

        if (!respuesta.ok) {
            throw new Error(
                resultado.error ||
                resultado.message ||
                "Error HTTP " + respuesta.status
            );
        }

        const productos = extraerProductos(resultado);

        if (productos.length === 0) {
            throw new Error(
                "Next Level no devolvió productos para Free Fire."
            );
        }

        /*
         * Mostrar únicamente paquetes disponibles
         * de diamantes de LATAM & USA.
         */

        productosDisponibles = productos.filter(producto =>
            producto &&
            producto.available === true &&
            esOfertaLATAM(producto) &&
            obtenerProductId(producto) !== "" &&
            esPaqueteDiamantes(producto)
        );

        if (productosDisponibles.length === 0) {
            mostrarEstado(
                "No se encontraron paquetes de diamantes disponibles para LATAM & USA.",
                true
            );
            return;
        }

        productosDisponibles.forEach(producto => {
            const tarjeta = document.createElement("button");

            tarjeta.type = "button";
            tarjeta.className = "producto";

            const nombre = document.createElement("div");
            nombre.className = "producto-nombre";
            nombre.textContent = obtenerNombre(producto);

            const estado = document.createElement("div");
            estado.className = "producto-estado";
            estado.textContent = "Seleccionar paquete";

            tarjeta.append(nombre, estado);

            tarjeta.addEventListener("click", () => {
                document.querySelectorAll(".producto").forEach(elemento => {
                    elemento.classList.remove("seleccionado");
                });

                tarjeta.classList.add("seleccionado");
                productoSeleccionado = producto;

                console.log(
                    "PRODUCTO SELECCIONADO:",
                    obtenerProductId(productoSeleccionado)
                );
            });

            catalogo.appendChild(tarjeta);
        });

        mostrarEstado(
            productosDisponibles.length +
            " paquetes de diamantes disponibles."
        );

        console.log(
            "PAQUETES MOSTRADOS:",
            productosDisponibles.map(producto => ({
                id: obtenerProductId(producto),
                nombre: obtenerNombre(producto)
            }))
        );

    } catch (error) {
        console.error("ERROR CARGANDO FREE FIRE:", error);

        catalogo.replaceChildren();

        mostrarEstado(
            "No se pudo cargar el catálogo. " + error.message,
            true
        );
    }
}

/* =====================================================
   INICIALIZAR
===================================================== */

cargarCatalogo();
</script>

</body>
</html>
