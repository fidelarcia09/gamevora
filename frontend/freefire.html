<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Fire | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 18px;
            border-bottom: 1px solid #12385f;
            background: #071225;
        }

        .logo {
            font-size: 19px;
            font-weight: 900;
        }

        .logo .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .inicio {
            text-decoration: none;
            color: white;
            border: 1px solid #168cff;
            padding: 9px 13px;
            border-radius: 9px;
            font-size: 13px;
            white-space: nowrap;
        }

        .contenedor {
            width: 100%;
            max-width: 550px;
            margin: auto;
            padding: 25px 18px;
        }

        .juego {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.12);
        }

        .icono {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #b8c9dc;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        .recargar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .recargar:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .estado-catalogo {
            padding: 13px;
            border: 1px solid #204c78;
            border-radius: 10px;
            background: #061226;
            color: #9eb7d2;
            font-size: 13px;
            line-height: 1.5;
            margin: 15px 0;
        }

        .estado-catalogo.error {
            border-color: #8a3544;
            color: #ffb5c0;
        }

        .separador-ofertas {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #12385f;
        }

        .boton-ofertas {
            width: 100%;
            padding: 14px;
            border: 1px solid #168cff;
            border-radius: 10px;
            background: linear-gradient(90deg, #061b3a, #0a2d5c);
            color: #00baff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 140, 255, 0.15);
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <span class="rayo">⚡</span> Gamers Gold Top-Up
    </div>

    <a href="juegos.html" class="inicio">← Juegos</a>
</header>

<main class="contenedor">

    <section class="juego">

        <div class="icono">🔥</div>

        <h1>Free Fire</h1>

        <p class="descripcion">
            Consulta los paquetes de diamantes disponibles
            y recarga tu cuenta.
        </p>

        <label for="id">ID del jugador</label>

        <input
            type="text"
            id="id"
            placeholder="Escribe tu ID de Free Fire"
            autocomplete="off"
        >

        <label for="cantidad">Selecciona una cantidad</label>

        <select id="cantidad" disabled>
            <option value="">Cargando paquetes...</option>
        </select>

        <button
            class="recargar"
            id="botonRecargar"
            type="button"
            onclick="continuarRecarga()"
            disabled
        >
            Continuar ⚡
        </button>

        <div class="separador-ofertas">
            <button
                class="boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas Especiales
            </button>
        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const URL_CATALOGO =
    SUPABASE_URL + "/functions/v1/nextlevel-catalogo";

const selectCantidad = document.getElementById("cantidad");
const botonRecargar = document.getElementById("botonRecargar");
const estadoCatalogo = document.createElement("div");

let catalogoCargado = false;

/* OFERTAS ESPECIALES */

function abrirOfertas() {
    window.location.href = "ofertas-free-fire.html";
}

/* LEER PRODUCTOS DE DISTINTOS FORMATOS */

function extraerProductos(respuesta) {
    if (Array.isArray(respuesta)) {
        return respuesta;
    }

    if (!respuesta || typeof respuesta !== "object") {
        return [];
    }

    if (Array.isArray(respuesta.productos)) {
        return respuesta.productos;
    }

    if (Array.isArray(respuesta.products)) {
        return respuesta.products;
    }

    if (Array.isArray(respuesta.data)) {
        return respuesta.data;
    }

    if (respuesta.data && Array.isArray(respuesta.data.products)) {
        return respuesta.data.products;
    }

    if (
        respuesta.data &&
        respuesta.data.data &&
        Array.isArray(respuesta.data.data.products)
    ) {
        return respuesta.data.data.products;
    }

    return [];
}

/* IDENTIFICAR LOS DIAMANTES POR SU ID O NOMBRE */

function identificarDiamantes(producto) {
    const identificador = String(
        producto.productId ||
        producto.product_id ||
        producto.id ||
        ""
    ).toLowerCase();

    const nombre = String(
        producto.productName ||
        producto.product_name ||
        producto.name ||
        producto.title ||
        ""
    ).toLowerCase();

    const texto = identificador + " " + nombre;

    if (
        texto.includes("weekly_membership") ||
        texto.includes("monthly_membership") ||
        texto.includes("booyah_pass") ||
        texto.includes("booyah pass") ||
        texto.includes("membership") ||
        texto.includes("membresía") ||
        texto.includes("membresia")
    ) {
        return null;
    }

    const paquetes = [
        {
            buscar: ["110_diamonds", "110 diamonds", "110 diamantes"],
            nombre: "110 diamantes",
            cantidad: 110
        },
        {
            buscar: ["341_diamonds", "341 diamonds", "310 diamantes"],
            nombre: "310 diamantes",
            cantidad: 310
        },
        {
            buscar: ["572_diamonds", "572 diamonds", "520 diamantes"],
            nombre: "520 diamantes",
            cantidad: 520
        },
        {
            buscar: ["1166_diamonds", "1166 diamonds", "1060 diamantes"],
            nombre: "1060 diamantes",
            cantidad: 1060
        },
        {
            buscar: ["2398_diamonds", "2398 diamonds", "2180 diamantes"],
            nombre: "2180 diamantes",
            cantidad: 2180
        }
    ];

    for (const paquete of paquetes) {
        if (paquete.buscar.some(valor => texto.includes(valor))) {
            return paquete;
        }
    }

    return null;
}

/* CONSULTAR CATÁLOGO NEXT LEVEL */

async function cargarCatalogoDiamantes() {
    botonRecargar.disabled = true;
    selectCantidad.disabled = true;

    selectCantidad.innerHTML =
        '<option value="">Cargando paquetes...</option>';

    try {
        const respuesta = await fetch(
            URL_CATALOGO + "?game=free-fire",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Accept": "application/json"
                }
            }
        );

        const resultado = await respuesta.json();

        console.log("RESPUESTA CATÁLOGO NEXT LEVEL:", resultado);

        if (!respuesta.ok) {
            throw new Error(
                resultado.error ||
                resultado.message ||
                "Error HTTP " + respuesta.status
            );
        }

        const productos = extraerProductos(resultado);

        console.log(
            "PRODUCTOS RECIBIDOS:",
            JSON.stringify(productos, null, 2)
        );

        if (productos.length === 0) {
            throw new Error(
                "El catálogo no devolvió una lista de productos."
            );
        }

        const encontrados = new Map();

        productos.forEach(producto => {
            if (!producto || producto.available === false) {
                return;
            }

            const paquete = identificarDiamantes(producto);

            if (paquete && !encontrados.has(paquete.cantidad)) {
                encontrados.set(paquete.cantidad, paquete);
            }
        });

        const ordenados = Array.from(encontrados.values())
            .sort((a, b) => a.cantidad - b.cantidad);

        selectCantidad.innerHTML =
            '<option value="">Selecciona una cantidad</option>';

        ordenados.forEach(paquete => {
            const opcion = document.createElement("option");

            opcion.value = paquete.nombre;
            opcion.textContent = paquete.nombre;

            selectCantidad.appendChild(opcion);
        });

        catalogoCargado = encontrados.has(110);

        if (ordenados.length === 0) {
            selectCantidad.innerHTML =
                '<option value="">No hay paquetes disponibles</option>';

            throw new Error(
                "No se reconocieron paquetes de diamantes en la respuesta."
            );
        }

        selectCantidad.disabled = false;
        botonRecargar.disabled = false;

        console.log("PAQUETES MOSTRADOS:", ordenados);

    } catch (error) {
        console.error("ERROR CARGANDO CATÁLOGO:", error);

        catalogoCargado = false;

        selectCantidad.innerHTML =
            '<option value="">No se pudieron cargar los paquetes</option>';

        selectCantidad.disabled = true;
        botonRecargar.disabled = true;
    }
}

/* COMPRA ACTUAL: SOLO 110 DIAMANTES */

async function continuarRecarga() {
    const idJugador =
        document.getElementById("id").value.trim();

    const cantidad = selectCantidad.value;

    if (!idJugador) {
        alert("Escribe tu ID de Free Fire.");
        return;
    }

    if (!cantidad) {
        alert("Selecciona una cantidad.");
        return;
    }

    if (!catalogoCargado) {
        alert("El paquete de 110 diamantes no está disponible.");
        return;
    }

    if (cantidad !== "110 diamantes") {
        alert(
            "Este paquete todavía no tiene la compra habilitada. " +
            "Podrás comprarlo cuando configuremos su producto y precio en GVR."
        );
        return;
    }

    const {
        data: { session },
        error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError || !session) {
        alert("Debes iniciar sesión primero.");
        window.location.href = "login.html";
        return;
    }

    const {
        data: producto,
        error: productoError
    } = await supabaseClient
        .from("game_products")
        .select("id, game, product_name, price_gvr, active")
        .eq("game", "Free Fire")
        .eq("product_name", "110 Diamantes")
        .maybeSingle();

    console.log("PRODUCTO SUPABASE:", producto);
    console.log("ERROR PRODUCTO:", productoError);

    if (productoError) {
        alert(
            "Error buscando el producto:\n\n" +
            productoError.message
        );
        return;
    }

    if (!producto) {
        alert("Supabase no encontró el producto de 110 diamantes.");
        return;
    }

    if (!producto.active) {
        alert("El producto de 110 diamantes no está activo.");
        return;
    }

    const {
        data,
        error
    } = await supabaseClient.rpc(
        "purchase_game_product",
        {
            p_product_id: producto.id,
            p_player_id: idJugador
        }
    );

    if (error) {
        console.error("ERROR DE COMPRA:", error);

        alert(
            "No se pudo realizar la compra:\n\n" +
            error.message
        );
        return;
    }

    alert(
        "¡Compra realizada! ⚡\n\n" +
        "110 diamantes\n" +
        "Precio: " + producto.price_gvr + " GVR\n\n" +
        "ID del pedido: " + data
    );

    window.location.href = "cuenta.html";
}

document.addEventListener(
    "DOMContentLoaded",
    cargarCatalogoDiamantes
);
</script>

</body>
</html>
