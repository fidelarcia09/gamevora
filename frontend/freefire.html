<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Fire | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            border-bottom: 1px solid #12385f;
            background: #071225;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
        }

        .logo .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .inicio {
            text-decoration: none;
            color: white;
            border: 1px solid #168cff;
            padding: 9px 13px;
            border-radius: 9px;
            font-size: 13px;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 25px 18px;
        }

        .juego {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.12);
        }

        .icono {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #b8c9dc;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        select:disabled {
            opacity: 0.75;
        }

        .recargar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .recargar:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .separador-ofertas {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #12385f;
        }

        .boton-ofertas {
            width: 100%;
            padding: 14px;
            border: 1px solid #168cff;
            border-radius: 10px;
            background: linear-gradient(90deg, #061b3a, #0a2d5c);
            color: #00baff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 140, 255, 0.15);
            transition: 0.2s;
        }

        .boton-ofertas:hover {
            transform: scale(1.02);
            box-shadow: 0 0 18px rgba(0, 140, 255, 0.3);
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <span class="rayo">⚡</span> Gamers Gold Top-Up
    </div>

    <a href="juegos.html" class="inicio">
        ← Juegos
    </a>

</header>

<main class="contenedor">

    <section class="juego">

        <div class="icono">🔥</div>

        <h1>Free Fire</h1>

        <p class="descripcion">
            Recarga tu cuenta de Free Fire de forma rápida y sencilla.
        </p>

        <label for="id">
            ID del jugador
        </label>

        <input
            type="text"
            id="id"
            placeholder="Escribe tu ID de Free Fire"
            autocomplete="off"
        >

        <label for="cantidad">
            Selecciona una cantidad
        </label>

        <select id="cantidad" disabled>
            <option value="">Cargando paquetes...</option>
        </select>

        <button
            class="recargar"
            id="botonRecargar"
            type="button"
            onclick="continuarRecarga()"
            disabled
        >
            Continuar ⚡
        </button>

        <div class="separador-ofertas">

            <button
                class="boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas Especiales
            </button>

        </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const URL_CATALOGO =
    SUPABASE_URL + "/functions/v1/nextlevel-catalogo";

const selectCantidad = document.getElementById("cantidad");
const botonRecargar = document.getElementById("botonRecargar");

let catalogoCargado = false;

/* ABRIR OFERTAS ESPECIALES */

function abrirOfertas() {
    window.location.href = "ofertas-free-fire.html";
}

/* EXTRAER PRODUCTOS DE LA RESPUESTA */

function extraerProductos(respuesta) {
    if (Array.isArray(respuesta)) {
        return respuesta;
    }

    if (!respuesta || typeof respuesta !== "object") {
        return [];
    }

    if (Array.isArray(respuesta.productos)) {
        return respuesta.productos;
    }

    if (Array.isArray(respuesta.products)) {
        return respuesta.products;
    }

    if (Array.isArray(respuesta.data)) {
        return respuesta.data;
    }

    if (
        respuesta.data &&
        Array.isArray(respuesta.data.products)
    ) {
        return respuesta.data.products;
    }

    if (
        respuesta.data &&
        respuesta.data.data &&
        Array.isArray(respuesta.data.data.products)
    ) {
        return respuesta.data.data.products;
    }

    return [];
}

/* IDENTIFICAR PAQUETES DE DIAMANTES */

function identificarDiamantes(producto) {
    const identificador = String(
        producto.productId ||
        producto.product_id ||
        producto.id ||
        ""
    ).toLowerCase();

    const nombre = String(
        producto.productName ||
        producto.product_name ||
        producto.name ||
        producto.title ||
        ""
    ).toLowerCase();

    const texto = identificador + " " + nombre;

    // Excluir membresías y Booyah Pass.
    if (
        texto.includes("weekly_membership") ||
        texto.includes("monthly_membership") ||
        texto.includes("booyah_pass") ||
        texto.includes("booyah pass") ||
        texto.includes("membership") ||
        texto.includes("membresía") ||
        texto.includes("membresia")
    ) {
        return null;
    }

    /*
     * Los IDs conocidos de Next Level incluyen:
     * 110, 341, 572, 1166 y 2398.
     *
     * Esos IDs corresponden a paquetes que se muestran
     * comercialmente como 110, 310, 520, 1060 y 2180.
     */
    const paquetesConocidos = [
        {
            id: "fz-free_fire_latam-110_diamonds",
            nombre: "110 diamantes",
            cantidad: 110
        },
        {
            id: "fz-free_fire_latam-341_diamonds",
            nombre: "310 diamantes",
            cantidad: 310
        },
        {
            id: "fz-free_fire_latam-572_diamonds",
            nombre: "520 diamantes",
            cantidad: 520
        },
        {
            id: "fz-free_fire_latam-1166_diamonds",
            nombre: "1060 diamantes",
            cantidad: 1060
        },
        {
            id: "fz-free_fire_latam-2398_diamonds",
            nombre: "2180 diamantes",
            cantidad: 2180
        }
    ];

    const coincidenciaId = paquetesConocidos.find(
        paquete => identificador === paquete.id.toLowerCase()
    );

    if (coincidenciaId) {
        return coincidenciaId;
    }

    /*
     * Como alternativa, reconocer el nombre comercial
     * si el proveedor no entrega uno de los IDs conocidos.
     */
    const coincidenciasNombre = [
        { patron: /\b110\s*diamonds?\b|\b110\s*diamantes\b/, nombre: "110 diamantes", cantidad: 110 },
        { patron: /\b310\s*diamonds?\b|\b310\s*diamantes\b/, nombre: "310 diamantes", cantidad: 310 },
        { patron: /\b520\s*diamonds?\b|\b520\s*diamantes\b/, nombre: "520 diamantes", cantidad: 520 },
        { patron: /\b1060\s*diamonds?\b|\b1060\s*diamantes\b/, nombre: "1060 diamantes", cantidad: 1060 },
        { patron: /\b2180\s*diamonds?\b|\b2180\s*diamantes\b/, nombre: "2180 diamantes", cantidad: 2180 }
    ];

    for (const paquete of coincidenciasNombre) {
        if (paquete.patron.test(nombre)) {
            return paquete;
        }
    }

    return null;
}

/* CARGAR EL CATÁLOGO REAL DE NEXT LEVEL */

async function cargarCatalogoDiamantes() {
    catalogoCargado = false;
    selectCantidad.disabled = true;
    botonRecargar.disabled = true;

    selectCantidad.innerHTML =
        '<option value="">Cargando paquetes...</option>';

    try {
        const respuesta = await fetch(
            URL_CATALOGO + "?game=free-fire",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const resultado = await respuesta.json();

        console.log("RESPUESTA CATÁLOGO NEXT LEVEL:", resultado);

        if (!respuesta.ok) {
            throw new Error(
                resultado.error ||
                resultado.message ||
                "Error HTTP " + respuesta.status
            );
        }

        const productos = extraerProductos(resultado);

        console.log("PRODUCTOS RECIBIDOS:", productos);

        if (productos.length === 0) {
            throw new Error(
                "La respuesta no contiene productos reconocibles."
            );
        }

        const encontrados = new Map();

        for (const producto of productos) {
            if (!producto || producto.available === false) {
                continue;
            }

            const paquete = identificarDiamantes(producto);

            if (paquete && !encontrados.has(paquete.cantidad)) {
                encontrados.set(paquete.cantidad, paquete);
            }
        }

        const paquetes = Array.from(encontrados.values())
            .sort((a, b) => a.cantidad - b.cantidad);

        // Vaciar el selector para eliminar las opciones antiguas.
        selectCantidad.innerHTML = "";

        const opcionInicial = document.createElement("option");
        opcionInicial.value = "";
        opcionInicial.textContent = "Selecciona una cantidad";
        selectCantidad.appendChild(opcionInicial);

        // Añadir exclusivamente los paquetes reconocidos del catálogo.
        for (const paquete of paquetes) {
            const opcion = document.createElement("option");
            opcion.value = paquete.nombre;
            opcion.textContent = paquete.nombre;
            selectCantidad.appendChild(opcion);
        }

        if (paquetes.length === 0) {
            selectCantidad.innerHTML =
                '<option value="">No se encontraron paquetes</option>';

            throw new Error(
                "Next Level respondió, pero los IDs o nombres de sus productos " +
                "no coinciden con los paquetes reconocidos. Revisa la consola."
            );
        }

        catalogoCargado = paquetes.some(
            paquete => paquete.cantidad === 110
        );

        selectCantidad.disabled = false;
        botonRecargar.disabled = false;

        console.log("PAQUETES MOSTRADOS:", paquetes);

    } catch (error) {
        console.error("ERROR CARGANDO CATÁLOGO:", error);

        catalogoCargado = false;

        selectCantidad.innerHTML =
            '<option value="">Error cargando paquetes</option>';

        selectCantidad.disabled = true;
        botonRecargar.disabled = true;
    }
}

/* COMPRA ACTUAL: SOLO 110 DIAMANTES */

async function continuarRecarga() {
    const idJugador =
        document.getElementById("id").value.trim();

    const cantidad = selectCantidad.value;

    if (idJugador === "") {
        alert("Escribe tu ID de Free Fire.");
        return;
    }

    if (cantidad === "") {
        alert("Selecciona una cantidad.");
        return;
    }

    if (!catalogoCargado) {
        alert("El paquete de 110 diamantes no está disponible.");
        return;
    }

    // No habilitar la compra de los otros paquetes todavía.
    if (cantidad !== "110 diamantes") {
        alert(
            "Este paquete todavía no tiene la compra habilitada. " +
            "La activaremos cuando configuremos su producto y precio en GVR."
        );
        return;
    }

    const {
        data: { session },
        error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError || !session) {
        alert("Debes iniciar sesión primero.");
        window.location.href = "login.html";
        return;
    }

    const {
        data: producto,
        error: productoError
    } = await supabaseClient
        .from("game_products")
        .select("id, game, product_name, price_gvr, active")
        .eq("game", "Free Fire")
        .eq("product_name", "110 Diamantes")
        .maybeSingle();

    console.log("PRODUCTO SUPABASE:", producto);
    console.log("ERROR PRODUCTO:", productoError);

    if (productoError) {
        alert(
            "Error buscando producto:\n\n" +
            productoError.message
        );
        return;
    }

    if (!producto) {
        alert("Supabase no encontró el producto de 110 diamantes.");
        return;
    }

    if (!producto.active) {
        alert("El producto de 110 diamantes no está activo.");
        return;
    }

    const {
        data,
        error
    } = await supabaseClient.rpc(
        "purchase_game_product",
        {
            p_product_id: producto.id,
            p_player_id: idJugador
        }
    );

    if (error) {
        console.error("ERROR DE COMPRA:", error);

        alert(
            "No se pudo realizar la compra:\n\n" +
            error.message
        );
        return;
    }

    alert(
        "¡Compra realizada! ⚡\n\n" +
        "110 diamantes\n" +
        "Precio: " + producto.price_gvr + " GVR\n\n" +
        "ID del pedido: " + data
    );

    window.location.href = "cuenta.html";
}

/* INICIAR CARGA DEL CATÁLOGO */

document.addEventListener(
    "DOMContentLoaded",
    cargarCatalogoDiamantes
);
</script>

</body>
</html>
