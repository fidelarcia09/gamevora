<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b18">
    <meta name="description" content="Recarga diamantes de Free Fire en Gamers Gold Top-Up.">

    <title>Free Fire | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 650px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 21px;
            font-weight: 900;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .volver {
            color: #28a9ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .card {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
        }

        .icono {
            text-align: center;
            font-size: 52px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .etiqueta {
            display: block;
            margin: 18px 0 10px;
            color: #b8c9dc;
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        .estado {
            padding: 13px;
            margin: 18px 0;
            border: 1px solid #204c78;
            border-radius: 10px;
            background: #061226;
            color: #a9c4df;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .estado.error {
            color: #ffaaaa;
            border-color: #843d4b;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .producto {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
            min-height: 110px;
            padding: 15px 12px;
            background: #061226;
            color: white;
            border: 1px solid #164b75;
            border-radius: 13px;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .producto:hover {
            border-color: #168cff;
        }

        .producto.seleccionado {
            border-color: #00baff;
            box-shadow: 0 0 12px rgba(0, 186, 255, 0.15);
        }

        .producto-nombre {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .producto-estado {
            color: #45c8ff;
            font-size: 12px;
            font-weight: bold;
        }

        .separador-ofertas {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #164b8f;
        }

        .boton {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
        }

        .continuar {
            margin-top: 18px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            cursor: not-allowed;
            opacity: 0.55;
        }

        .boton-ofertas {
            background: #07152b;
            color: #28a9ff;
            border: 1px solid #168cff;
            cursor: pointer;
        }

        .nota {
            margin-top: 20px;
            text-align: center;
            color: #8299b4;
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 22px 14px;
            }

            .catalogo {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>
<div class="contenedor">

    <header class="header">
        <div class="logo">
            <span class="rayo">⚡</span> Gamers Gold Top-Up
        </div>

        <a href="juegos.html" class="volver">← Juegos</a>
    </header>

    <main class="card">
        <div class="icono">🔥</div>

        <h1>Free Fire</h1>

        <p class="descripcion">
            Selecciona tu paquete de diamantes de Free Fire.
        </p>

        <label class="etiqueta" for="idjugador">
            ID del jugador
        </label>

        <input
            type="text"
            id="idjugador"
            placeholder="Introduce tu ID de Free Fire"
            autocomplete="off"
        >

        <label class="etiqueta">
            Selecciona una cantidad de diamantes
        </label>

        <div id="estadoCatalogo" class="estado" aria-live="polite">
            Conectando con el catálogo...
        </div>

        <div id="catalogo" class="catalogo"></div>

        <button
            id="botonContinuar"
            class="boton continuar"
            type="button"
            disabled
        >
            Compras temporalmente desactivadas
        </button>

        <div class="separador-ofertas">
            <button
                class="boton boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas especiales
            </button>
        </div>

        <p class="nota">
            Consulta los paquetes de diamantes disponibles.
            Las compras se habilitarán cuando se configuren
            los precios de venta y el sistema de pedidos.
        </p>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const catalogo = document.getElementById("catalogo");
const estadoCatalogo = document.getElementById("estadoCatalogo");
const botonContinuar = document.getElementById("botonContinuar");
const campoJugador = document.getElementById("idjugador");

let productosDisponibles = [];
let productoSeleccionado = null;
let procesandoCompra = false;

function abrirOfertas() {
    window.location.href = "ofertas-free-fire.html";
}

function mostrarEstado(mensaje, esError = false) {
    estadoCatalogo.textContent = mensaje;
    estadoCatalogo.classList.toggle("error", esError);
}

function obtenerProductId(producto) {
    return String(
        producto.productId ||
        producto.product_id ||
        producto.id ||
        ""
    ).trim();
}

function obtenerNombre(producto) {
    return String(
        producto.name ||
        producto.productName ||
        producto.product_name ||
        producto.title ||
        obtenerProductId(producto) ||
        "Paquete de Free Fire"
    ).trim();
}

function esOfertaLATAM(producto) {
    return String(producto.region || "")
        .trim()
        .toUpperCase() === "LATAM & USA";
}

function esPaqueteDiamantes(producto) {
    const id = obtenerProductId(producto).toLowerCase();
    const nombre = obtenerNombre(producto).toLowerCase();

    const esDiamantes =
        id.includes("_diamonds") ||
        /\bdiamonds?\b|\bdiamantes\b/.test(nombre);

    const esMembresiaOPase =
        id.includes("membership") ||
        id.includes("booyah_pass") ||
        nombre.includes("membership") ||
        nombre.includes("membresía") ||
        nombre.includes("membresia") ||
        nombre.includes("booyah pass");

    return esDiamantes && !esMembresiaOPase;
}

function actualizarBoton() {
    const jugadorValido = campoJugador.value.trim().length > 0;
    const producto = productoSeleccionado?.local;

    botonContinuar.disabled =
        procesandoCompra ||
        !producto ||
        producto.active !== true ||
        !Number.isInteger(Number(producto.price_gvr)) ||
        Number(producto.price_gvr) <= 0 ||
        !jugadorValido;

    botonContinuar.style.cursor =
        botonContinuar.disabled ? "not-allowed" : "pointer";

    botonContinuar.style.opacity =
        botonContinuar.disabled ? "0.55" : "1";

    if (procesandoCompra) {
        botonContinuar.textContent = "Procesando pedido...";
    } else if (producto) {
        botonContinuar.textContent =
            "Comprar por " + producto.price_gvr + " GVR";
    } else {
        botonContinuar.textContent =
            "Compras temporalmente desactivadas";
    }
}

async function cargarCatalogo() {
    productoSeleccionado = null;
    productosDisponibles = [];
    catalogo.replaceChildren();
    actualizarBoton();

    mostrarEstado("Conectando con el catálogo...");

    try {
        const respuesta = await fetch(
            SUPABASE_URL +
            "/functions/v1/nextlevel-catalogo?game=free-fire",
            {
                method: "GET",
                headers: {
                    apikey: SUPABASE_KEY,
                    Authorization: "Bearer " + SUPABASE_KEY,
                    Accept: "application/json"
                },
                cache: "no-store"
            }
        );

        const resultado = await respuesta.json();

        if (!respuesta.ok) {
            throw new Error(
                resultado.error ||
                resultado.message ||
                "Error HTTP " + respuesta.status
            );
        }

        let productos = [];

        if (Array.isArray(resultado)) {
            productos = resultado;
        } else if (Array.isArray(resultado.products)) {
            productos = resultado.products;
        } else if (Array.isArray(resultado.productos)) {
            productos = resultado.productos;
        } else if (Array.isArray(resultado.data)) {
            productos = resultado.data;
        } else if (Array.isArray(resultado.data?.products)) {
            productos = resultado.data.products;
        }

        productosDisponibles = productos.filter(producto =>
            producto &&
            producto.available === true &&
            esOfertaLATAM(producto) &&
            obtenerProductId(producto) &&
            esPaqueteDiamantes(producto)
        );

        if (!productosDisponibles.length) {
            mostrarEstado(
                "No hay paquetes disponibles para LATAM & USA.",
                true
            );
            return;
        }

        const idsProveedor = productosDisponibles.map(
            obtenerProductId
        );

        const { data: registros, error } = await supabase
            .from("game_products")
            .select(
                "id, product_name, price_gvr, active, provider_product_id"
            )
            .eq("game", "Free Fire")
            .eq("provider", "nextlevel")
            .in("provider_product_id", idsProveedor);

        if (error) {
            throw new Error(
                "No se pudieron consultar los productos de venta."
            );
        }

        const mapa = new Map(
            (registros || []).map(producto => [
                producto.provider_product_id,
                producto
            ])
        );

        productosDisponibles.forEach(producto => {
            const idProveedor = obtenerProductId(producto);
            const local = mapa.get(idProveedor) || null;

            const tarjeta = document.createElement("button");
            tarjeta.type = "button";
            tarjeta.className = "producto";

            const nombre = document.createElement("div");
            nombre.className = "producto-nombre";
            nombre.textContent = local
                ? local.product_name
                : obtenerNombre(producto);

            const estado = document.createElement("div");
            estado.className = "producto-estado";

            const precioValido =
                local &&
                local.active === true &&
                Number.isInteger(Number(local.price_gvr)) &&
                Number(local.price_gvr) > 0;

            estado.textContent = precioValido
                ? Number(local.price_gvr) + " GVR"
                : "Próximamente";

            tarjeta.append(nombre, estado);

            tarjeta.addEventListener("click", () => {
                document.querySelectorAll(".producto")
                    .forEach(elemento =>
                        elemento.classList.remove("seleccionado")
                    );

                tarjeta.classList.add("seleccionado");

                productoSeleccionado = {
                    provider: producto,
                    local: precioValido ? local : null
                };

                mostrarEstado(
                    precioValido
                        ? "Paquete seleccionado: " +
                          local.product_name + "."
                        : "Este paquete todavía no está habilitado para la venta."
                );

                actualizarBoton();
            });

            catalogo.appendChild(tarjeta);
        });

        mostrarEstado(
            productosDisponibles.length +
            " paquetes de diamantes disponibles."
        );

    } catch (error) {
        console.error("Error cargando catálogo:", error);

        catalogo.replaceChildren();

        mostrarEstado(
            error.message || "No se pudo cargar el catálogo.",
            true
        );
    }
}

async function comprar() {
    if (procesandoCompra) return;

    const jugador = campoJugador.value.trim();
    const seleccionado = productoSeleccionado;

    if (
        !jugador ||
        !seleccionado?.local ||
        seleccionado.local.active !== true ||
        !Number.isInteger(Number(seleccionado.local.price_gvr)) ||
        Number(seleccionado.local.price_gvr) <= 0
    ) {
        mostrarEstado(
            "El producto no está habilitado para la venta.",
            true
        );
        return;
    }

    procesandoCompra = true;
    actualizarBoton();

    let gameOrderId = null;

    try {
        const { data: sessionData, error: sessionError } =
            await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
            mostrarEstado(
                "Inicia sesión antes de comprar.",
                true
            );
            return;
        }

        /*
         * Crear el pedido local.
         * No repetir automáticamente esta llamada ante un error
         * de red, porque el pedido podría haberse creado.
         */

        const { data: pedido, error: compraError } =
            await supabase.rpc("purchase_game_product", {
                p_product_id: seleccionado.local.id,
                p_player_id: jugador
            });

        if (compraError) {
            throw new Error(
                compraError.message || "No se pudo crear el pedido."
            );
        }

        gameOrderId =
            typeof pedido === "string"
                ? pedido
                : pedido?.id || pedido?.game_order_id;

        if (!gameOrderId) {
            mostrarEstado(
                "No se recibió el ID del pedido. Comprueba tu historial antes de intentarlo otra vez.",
                true
            );
            return;
        }

        mostrarEstado("Pedido creado. Enviando a Next Level...");

        const { data: envio, error: envioError } =
            await supabase.functions.invoke(
                "nextlevel-crear-pedido",
                {
                    body: {
                        game_order_id: gameOrderId
                    }
                }
            );

        if (envioError || !envio) {
            mostrarEstado(
                "No se pudo confirmar el envío del pedido " +
                gameOrderId +
                ". No vuelvas a comprar: consulta primero su estado.",
                true
            );
            return;
        }

        if (envio.error) {
            mostrarEstado(
                "Pedido " + gameOrderId + ": " +
                envio.error +
                " Comprueba el estado antes de repetir la compra.",
                true
            );
            return;
        }

        mostrarEstado(
            "Pedido enviado. Consultando su estado..."
        );

        await consultarEstado(gameOrderId);

    } catch (error) {
        console.error("Error en compra:", error);

        mostrarEstado(
            gameOrderId
                ? "El pedido " + gameOrderId +
                  " podría haberse creado. No repitas la compra hasta comprobar su estado."
                : error.message || "No se pudo completar la solicitud.",
            true
        );
    } finally {
        procesandoCompra = false;
        actualizarBoton();
    }
}

async function consultarEstado(gameOrderId) {
    try {
        const { data, error } = await supabase.functions.invoke(
            "nextlevel-consultar-pedido",
            {
                body: {
                    game_order_id: gameOrderId
                }
            }
        );

        if (error || !data) {
            mostrarEstado(
                "Pedido enviado. No se pudo actualizar el estado todavía."
            );
            return;
        }

        if (data.error) {
            mostrarEstado(
                "Pedido enviado. Estado pendiente de verificación: " +
                data.error
            );
            return;
        }

        const estado = String(
            data.provider_status ||
            data.status ||
            "PROCESSING"
        ).toUpperCase();

        const mensajes = {
            COMPLETED: "¡Recarga completada!",
            PROCESSING: "Tu recarga está procesándose.",
            PENDING: "Tu pedido está pendiente.",
            REFUNDED: "El pedido fue reembolsado.",
            FAILED: "El proveedor informa un fallo. Comprueba el pedido antes de volver a comprar."
        };

        mostrarEstado(
            "Pedido " + gameOrderId + ": " +
            (mensajes[estado] || "Estado: " + estado)
        );

    } catch (error) {
        console.error("Error consultando estado:", error);

        mostrarEstado(
            "El pedido fue enviado. No se pudo consultar el estado en este momento."
        );
    }
}

campoJugador.addEventListener("input", actualizarBoton);
botonContinuar.addEventListener("click", comprar);

cargarCatalogo();
</script>

</body>
</html>
