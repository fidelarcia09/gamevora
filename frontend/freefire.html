<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free Fire | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px;
            border-bottom: 1px solid #12385f;
            background: #071225;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
        }

        .logo .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .inicio {
            text-decoration: none;
            color: white;
            border: 1px solid #168cff;
            padding: 9px 13px;
            border-radius: 9px;
            font-size: 13px;
            white-space: nowrap;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 25px 18px;
        }

        .juego {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.12);
        }

        .icono {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #b8c9dc;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        select:disabled {
            opacity: 0.75;
        }

        .recargar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .recargar:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .separador-ofertas {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #12385f;
        }

        .boton-ofertas {
            width: 100%;
            padding: 14px;
            border: 1px solid #168cff;
            border-radius: 10px;
            background: linear-gradient(90deg, #061b3a, #0a2d5c);
            color: #00baff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 140, 255, 0.15);
            transition: 0.2s;
        }

        .boton-ofertas:hover {
            transform: scale(1.02);
            box-shadow: 0 0 18px rgba(0, 140, 255, 0.3);
        }

        .estado-catalogo {
            color: #8fa5bd;
            font-size: 12px;
            line-height: 1.5;
            margin-top: -8px;
            margin-bottom: 16px;
        }

        @media (max-width: 380px) {
            header {
                padding: 14px 10px;
            }

            .logo {
                font-size: 17px;
            }

            .inicio {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <span class="rayo">⚡</span> Gamers Gold Top-Up
    </div>

    <a href="juegos.html" class="inicio">
        ← Juegos
    </a>
</header>

<main class="contenedor">
    <section class="juego">

        <div class="icono">🔥</div>

        <h1>Free Fire</h1>

        <p class="descripcion">
            Recarga tu cuenta de Free Fire de forma rápida y sencilla.
        </p>

        <label for="id">ID del jugador</label>

        <input
            type="text"
            id="id"
            placeholder="Escribe tu ID de Free Fire"
            autocomplete="off"
        >

        <label for="cantidad">Selecciona una oferta</label>

        <select id="cantidad" disabled>
            <option value="">Cargando ofertas de Next Level...</option>
        </select>

        <p class="estado-catalogo" id="estadoCatalogo" aria-live="polite">
            Conectando con el catálogo...
        </p>

        <button
            class="recargar"
            id="botonRecargar"
            type="button"
            onclick="continuarRecarga()"
            disabled
        >
            Continuar ⚡
        </button>

        <div class="separador-ofertas">
            <button
                class="boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas Especiales
            </button>
        </div>

    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* =========================================
   CATÁLOGO NEXT LEVEL
========================================= */

const URL_CATALOGO =
    SUPABASE_URL + "/functions/v1/nextlevel-catalogo";

const selectCantidad = document.getElementById("cantidad");
const botonRecargar = document.getElementById("botonRecargar");
const estadoCatalogo = document.getElementById("estadoCatalogo");

let catalogoCargado = false;
let ofertasDisponibles = [];

/*
 * Este archivo muestra el catálogo real.
 * La compra continúa usando game_products en Supabase.
 * No se simulan compras a través de Next Level.
 */

/* =========================================
   NAVEGACIÓN
========================================= */

function abrirOfertas() {
    window.location.href = "ofertas-free-fire.html";
}

/* =========================================
   LEER LOS PRODUCTOS RECIBIDOS
========================================= */

function extraerProductos(respuesta) {
    if (Array.isArray(respuesta)) {
        return respuesta;
    }

    if (!respuesta || typeof respuesta !== "object") {
        return [];
    }

    if (Array.isArray(respuesta.productos)) {
        return respuesta.productos;
    }

    if (Array.isArray(respuesta.products)) {
        return respuesta.products;
    }

    if (Array.isArray(respuesta.data)) {
        return respuesta.data;
    }

    if (respuesta.data && Array.isArray(respuesta.data.products)) {
        return respuesta.data.products;
    }

    return [];
}

/* =========================================
   VALIDAR REGIÓN Y NOMBRE DEL PRODUCTO
========================================= */

function esOfertaLATAM(producto) {
    const region = String(producto.region || "")
        .trim()
        .toUpperCase();

    return region === "LATAM & USA";
}

function obtenerNombre(producto) {
    return String(
        producto.name ||
        producto.productName ||
        producto.product_name ||
        producto.title ||
        producto.productId ||
        "Producto de Free Fire"
    ).trim();
}

function obtenerProductId(producto) {
    return String(
        producto.productId ||
        producto.product_id ||
        producto.id ||
        ""
    ).trim();
}

/* =========================================
   CARGAR OFERTAS REALES
========================================= */

async function cargarCatalogoDiamantes() {
    catalogoCargado = false;
    ofertasDisponibles = [];

    selectCantidad.disabled = true;
    botonRecargar.disabled = true;

    selectCantidad.innerHTML =
        '<option value="">Cargando ofertas de Next Level...</option>';

    estadoCatalogo.textContent =
        "Conectando con el catálogo...";

    try {
        const respuesta = await fetch(
            URL_CATALOGO + "?game=free-fire",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const resultado = await respuesta.json();

        console.log("RESPUESTA NEXT LEVEL:", resultado);

        if (!respuesta.ok) {
            throw new Error(
                resultado.error ||
                resultado.message ||
                "Error HTTP " + respuesta.status
            );
        }

        const productos = extraerProductos(resultado);

        console.log("TOTAL DE PRODUCTOS RECIBIDOS:", productos.length);

        if (productos.length === 0) {
            throw new Error(
                "La respuesta no contiene productos reconocibles."
            );
        }

        /*
         * Solo mostrar productos disponibles de LATAM & USA.
         * Así se excluyen los 120 Diamonds de Indonesia.
         *
         * No convertimos 341 en 310 ni 572 en 520.
         * Se muestra exactamente el nombre enviado por Next Level.
         *
         * Se incluyen diamantes, membresías y Booyah Pass.
         */

        ofertasDisponibles = productos.filter(producto => {
            return producto &&
                producto.available === true &&
                esOfertaLATAM(producto) &&
                obtenerProductId(producto) !== "";
        });

        console.log(
            "OFERTAS LATAM DISPONIBLES:",
            ofertasDisponibles
        );

        selectCantidad.innerHTML = "";

        const opcionInicial = document.createElement("option");
        opcionInicial.value = "";
        opcionInicial.textContent = "Selecciona una oferta";
        selectCantidad.appendChild(opcionInicial);

        ofertasDisponibles.forEach(producto => {
            const opcion = document.createElement("option");

            /*
             * El valor es el identificador real de Next Level.
             * No es una cantidad comercial inventada.
             */
            opcion.value = obtenerProductId(producto);
            opcion.textContent = obtenerNombre(producto);

            selectCantidad.appendChild(opcion);
        });

        if (ofertasDisponibles.length === 0) {
            selectCantidad.innerHTML =
                '<option value="">No hay ofertas LATAM disponibles</option>';

            estadoCatalogo.textContent =
                "No se encontraron ofertas disponibles para LATAM & USA.";

            return;
        }

        catalogoCargado = true;
        selectCantidad.disabled = false;
        botonRecargar.disabled = false;

        estadoCatalogo.textContent =
            ofertasDisponibles.length +
            " ofertas reales disponibles en el catálogo.";

        console.log(
            "TOTAL DE OFERTAS MOSTRADAS:",
            ofertasDisponibles.length
        );

    } catch (error) {
        console.error("ERROR CARGANDO NEXT LEVEL:", error);

        catalogoCargado = false;
        ofertasDisponibles = [];

        selectCantidad.innerHTML =
            '<option value="">Error cargando ofertas</option>';

        selectCantidad.disabled = true;
        botonRecargar.disabled = true;

        estadoCatalogo.textContent =
            "No se pudo cargar el catálogo. Intenta recargar la página.";
    }
}

/* =========================================
   COMPRA ACTUAL DE 110 DIAMANTES
========================================= */

async function continuarRecarga() {
    const idJugador =
        document.getElementById("id").value.trim();

    const productIdSeleccionado = selectCantidad.value;

    if (!idJugador) {
        alert("Escribe tu ID de Free Fire.");
        return;
    }

    if (!productIdSeleccionado) {
        alert("Selecciona una oferta.");
        return;
    }

    if (!catalogoCargado) {
        alert("El catálogo todavía no está disponible.");
        return;
    }

    const ofertaSeleccionada = ofertasDisponibles.find(
        producto =>
            obtenerProductId(producto) === productIdSeleccionado
    );

    if (!ofertaSeleccionada) {
        alert("No se encontró la oferta seleccionada. Recarga la página.");
        return;
    }

    /*
     * Solo 110 Diamonds tiene habilitada la compra existente.
     * Los demás productos se muestran, pero no se cobran todavía.
     */
    if (
        obtenerProductId(ofertaSeleccionada) !==
        "fz-free_fire_latam-110_diamonds"
    ) {
        alert(
            "Esta oferta ya aparece en el catálogo, pero su compra " +
            "todavía no está habilitada. Estamos preparando sus productos y precios."
        );
        return;
    }

    botonRecargar.disabled = true;
    botonRecargar.textContent = "Procesando...";

    try {
        const {
            data: { session },
            error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError || !session) {
            alert("Debes iniciar sesión primero.");
            window.location.href = "login.html";
            return;
        }

        const {
            data: producto,
            error: productoError
        } = await supabaseClient
            .from("game_products")
            .select("id, game, product_name, price_gvr, active")
            .eq("game", "Free Fire")
            .eq("product_name", "110 Diamantes")
            .maybeSingle();

        if (productoError) {
            throw new Error(
                "Error buscando el producto en Supabase: " +
                productoError.message
            );
        }

        if (!producto) {
            throw new Error(
                "Supabase no encontró el producto de 110 diamantes."
            );
        }

        if (!producto.active) {
            throw new Error(
                "El producto de 110 diamantes no está activo."
            );
        }

        const {
            data,
            error
        } = await supabaseClient.rpc(
            "purchase_game_product",
            {
                p_product_id: producto.id,
                p_player_id: idJugador
            }
        );

        if (error) {
            throw new Error(error.message);
        }

        alert(
            "¡Compra realizada! ⚡\n\n" +
            "110 diamantes\n" +
            "Precio: " + producto.price_gvr + " GVR\n\n" +
            "ID del pedido: " + data
        );

        window.location.href = "cuenta.html";

    } catch (error) {
        console.error("ERROR DE COMPRA:", error);

        alert(
            "No se pudo completar la compra:\n\n" +
            error.message
        );

    } finally {
        botonRecargar.disabled = !catalogoCargado;
        botonRecargar.textContent = "Continuar ⚡";
    }
}

/* =========================================
   INICIO
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    cargarCatalogoDiamantes
);
</script>

</body>
    </html>
