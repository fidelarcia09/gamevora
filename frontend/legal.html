<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b18">
  <meta name="description" content="Información legal de Gamers Gold Top-Up.">
  <title>Legal | Gamers Gold Top-Up</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{background:#050b18;color:#f4f8ff;min-height:100vh;padding:20px}
    main{max-width:500px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
    .encabezado-pagina{display:inline-flex;align-items:center;gap:10px;min-width:0;color:#eaf7ff;text-decoration:none;font-size:15px;font-weight:800;line-height:1.2;-webkit-tap-highlight-color:transparent}
    .encabezado-pagina-icono{width:38px;height:38px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #17649a;border-radius:11px;background:linear-gradient(145deg,#103b65,#08203b);color:#4bcaff;box-shadow:0 5px 15px rgba(0,21,45,.35)}
    .encabezado-pagina-icono svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .encabezado-pagina-titulo{overflow-wrap:anywhere}
    .encabezado-pagina:hover{color:#75d7ff}
    .encabezado-pagina:focus-visible{outline:none}
    h1{font-size:25px;margin:8px 0}
    .intro{color:#91a8c3;font-size:13px;line-height:1.65;margin-bottom:22px}
    .lista{display:flex;flex-direction:column;gap:9px}
    .legal-enlace{display:flex;align-items:center;gap:13px;min-height:65px;padding:12px 14px;border:1px solid #173d63;border-radius:13px;background:#061226;color:#f4f8ff;text-decoration:none;transition:border-color .2s,background .2s}
    .legal-enlace:hover{border-color:#28a9ff;background:#081a35}
    .legal-enlace:focus-visible{outline:2px solid #75d7ff;outline-offset:3px}
    .icono{width:44px;height:44px;min-width:44px;padding:10px;border-radius:13px;background:linear-gradient(145deg,#103b65,#08203b);border:1px solid #17649a;color:#4bcaff;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;box-shadow:0 5px 15px #00152d}
    .texto{flex:1;font-size:15px;font-weight:700}
    .flecha{width:18px;height:18px;color:#00baff;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    footer{margin-top:25px;text-align:center;color:#7189a4;font-size:11px}
    @media(max-width:440px){body{padding:15px}header{align-items:flex-start}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <header>
      <a class="encabezado-pagina" href="cuenta.html" aria-label="Volver a Mi cuenta">
        <span class="encabezado-pagina-icono" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/><path d="M9 12h11"/></svg>
        </span>
        <span class="encabezado-pagina-titulo">Legal</span>
      </a>
    </header>
    <h1>Legal</h1>
    <p class="intro">Consulta los documentos y la información legal de Gamers Gold Top-Up.</p>
    <nav class="lista" aria-label="Documentos legales">
      <a class="legal-enlace" href="politicas-privacidad.html">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M8 13h8M8 17h8"/></svg>
        <span class="texto">Política de privacidad</span>
        <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a class="legal-enlace" href="sobre-gamers-gold.html">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/></svg>
        <span class="texto">¿Qué es Gamers Gold Top-Up?</span>
        <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a class="legal-enlace" href="politica-cookies.html">
        <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/><circle cx="8.5" cy="10" r=".8"/><circle cx="13" cy="15" r=".8"/><circle cx="15.5" cy="8.5" r=".8"/></svg>
        <span class="texto">Política de cookies</span>
        <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </nav>
    <footer>Gamers Gold Top-Up · Información legal</footer>
  </main>
</body>
</html>
