<!DOCTYPE html>
<html lang="es">
<head>

  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{background:#050b18;color:#f4f8ff;min-height:100vh;padding:20px}
    main{max-width:500px;margin:0 auto}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
    .logo{font-size:20px;font-weight:900;white-space:nowrap}.logo span{color:#00baff;text-shadow:0 0 12px #008cff}

    .volver svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    h1{font-size:25px;margin:8px 0}
    .intro{color:#91a8c3;font-size:13px;line-height:1.65;margin-bottom:22px}
    .lista{display:flex;flex-direction:column;gap:9px}
    .legal-enlace{display:flex;align-items:center;gap:13px;min-height:65px;padding:12px 14px;border:1px solid #173d63;border-radius:13px;background:#061226;color:#f4f8ff;text-decoration:none;transition:border-color .2s,background .2s}
    .legal-enlace:hover{border-color:#28a9ff;background:#081a35}
    .legal-enlace:focus-visible{outline:2px solid #75d7ff;outline-offset:3px}
    .icono{width:44px;height:44px;min-width:44px;padding:10px;border-radius:13px;background:linear-gradient(145deg,#103b65,#08203b);border:1px solid #17649a;color:#4bcaff;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;box-shadow:0 5px 15px #00152d}
    .texto{flex:1;font-size:15px;font-weight:700}
    .flecha{width:18px;height:18px;color:#00baff;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    footer{margin-top:25px;text-align:center;color:#7189a4;font-size:11px}
    @media(max-width:440px){body{padding:15px}header{align-items:flex-start}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>

</html>
