<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;min-height:100vh;padding:18px;background:#050b18;color:#fff}.contenedor{max-width:900px;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:26px}.logo{font-size:20px;font-weight:900}.rayo{color:#00b7ff}.volver{color:#35baff;text-decoration:none;font-size:13px;font-weight:bold}.encabezado{margin-bottom:20px}.encabezado h1{font-size:26px;margin:0 0 8px}.encabezado p{color:#8da4c0;font-size:13px;line-height:1.6}.estadisticas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.estadisticas>div{padding:14px;border:1px solid #173d67;border-radius:12px;background:#09172d}.estadisticas span{display:block;color:#8da4c0;font-size:12px;margin-bottom:8px}.estadisticas strong{color:#39c5ff;font-size:23px}.vacio{padding:25px;text-align:center;color:#9ab0c9;border:1px solid #173d67;border-radius:12px;background:#09172d}.boton-push{padding:10px 13px;border:1px solid #168bd1;border-radius:9px;background:#0b3155;color:white;font-weight:bold;cursor:pointer}.boton-push:disabled{opacity:.5}@media(max-width:480px){body{padding:13px}.estadisticas{gap:6px}.estadisticas>div{padding:10px 7px}.estadisticas strong{font-size:19px}}

/* Botón Atrás: icono en cuadrado con identidad visual de cuenta.html */

.icono-atras{width:38px;height:38px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #17649a;border-radius:11px;background:linear-gradient(145deg,#103b65,#08203b);color:#4bcaff;box-shadow:0 5px 15px rgba(0,21,45,.45)}

.boton-atras:hover .icono-atras{border-color:#28a9ff;background:linear-gradient(145deg,#145184,#09294b)}

.encabezado-pagina{display:inline-flex;align-items:center;gap:10px;min-width:0;margin:0;color:#eaf7ff;text-decoration:none;font-size:15px;font-weight:800;line-height:1.2}.encabezado-pagina-icono{width:38px;height:38px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #17649a;border-radius:11px;background:linear-gradient(145deg,#103b65,#08203b);color:#4bcaff;box-shadow:0 5px 15px rgba(0,21,45,.35)}.encabezado-pagina-icono svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.encabezado-pagina-titulo{overflow-wrap:anywhere}.encabezado-pagina~.boton-atras{display:none!important}

<body>
<main class="contenedor">
<header class="header">
<a class="encabezado-pagina" href="admin-soporte.html" aria-label="Volver atrás"><span class="encabezado-pagina-icono" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/><path d="M9 12h11"/></svg></span><span class="encabezado-pagina-titulo">Pagos manuales de juegos</span></a>

</header>
<section class="encabezado">
<h1>Pagos manuales de juegos</h1>
<p>Revisa el comprobante, el pedido, el juego y el importe antes de aprobar o rechazar el pago. Esta sección es independiente de las confirmaciones GVR.</p>
</section>
<div class="estadisticas">
<div><span>Pendientes de revisión</span><strong id="manualPendientes">—</strong></div>
<div><span>Aprobados</span><strong id="manualAprobados">—</strong></div>
<div><span>Rechazados</span><strong id="manualRechazados">—</strong></div>
</div>
<div id="manualAdminGate" class="vacio">Comprobando permisos de administrador…</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL="https://gsuhzcavghsiolmipnzi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
(async()=>{
 const gate=document.getElementById("manualAdminGate");
 try{
  const {data:{user},error:authError}=await supabaseClient.auth.getUser();
  if(authError||!user){location.replace("login.html");return;}
  const {data:isAdmin,error}=await supabaseClient.rpc("is_support_admin");
  if(error||isAdmin!==true){gate.textContent="No tienes permiso para administrar los pagos manuales.";return;}
  gate.remove();
  const stats=document.querySelector(".estadisticas");
  const originalStats=stats;
  const observer=new MutationObserver(()=>{});
  observer.observe(document.querySelector(".contenedor"),{childList:true,subtree:true});
  const script=document.createElement("script");
  script.src="./admin-pagos-manuales.js?v=20261027-1";
  document.body.appendChild(script);
  async function refreshStats(){
   const {data,error}=await supabaseClient.from("manual_game_payments").select("status");
   if(error)return;
   document.getElementById("manualPendientes").textContent=data.filter(x=>x.status==="pending").length;
   document.getElementById("manualAprobados").textContent=data.filter(x=>x.status==="approved").length;
   document.getElementById("manualRechazados").textContent=data.filter(x=>x.status==="rejected").length;
  }
  await refreshStats();
  setInterval(refreshStats,30000);
 }catch(e){console.error(e);gate.textContent="No se pudo comprobar el acceso. Inténtalo nuevamente.";}
})();
</script>
<script src="./goldi-widget.js?v=20261023-2" defer></script>
</body>
