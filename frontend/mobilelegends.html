<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Legends | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .volver {
            color: #28a9ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .card {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
        }

        .icono {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #b8c9dc;
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        select option {
            background: #061226;
            color: white;
        }

        .estado {
            margin-top: -8px;
            margin-bottom: 18px;
            color: #8fa5bd;
            font-size: 12px;
            line-height: 1.5;
        }

        .continuar, .recargar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .continuar:disabled, .recargar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .recargar {
            margin-top: 10px;
            background: #10294a;
            border: 1px solid #168cff;
        }

        .separador {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #12385f;
        }

        .nota {
            margin-top: 20px;
            text-align: center;
            color: #627b97;
            font-size: 11px;
            line-height: 1.5;
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .logo {
                font-size: 18px;
            }

            .card {
                padding: 24px 16px;
            }
        }
    </style>
</head>

<body>
<div class="contenedor">

    <div class="header">
        <div class="logo">
            <span class="rayo">⚡</span> Gamers Gold Top-Up
        </div>

        <a href="juegos.html" class="volver">← Juegos</a>
    </div>

    <div class="card">
        <div class="icono">🎮</div>

        <h1>Mobile Legends</h1>

        <p class="descripcion">
            Selecciona tu paquete directamente del catálogo
            del proveedor.
        </p>

        <label for="idjugador">ID del jugador</label>
        <input
            id="idjugador"
            type="text"
            placeholder="Introduce tu ID"
            autocomplete="off"
        >

        <label for="zoneId">Zone ID</label>
        <input
            id="zoneId"
            type="text"
            placeholder="Introduce tu Zone ID"
            autocomplete="off"
        >

        <label for="cantidad">Paquete disponible</label>
        <select id="cantidad" disabled>
            <option value="">Cargando catálogo...</option>
        </select>

        <p id="estadoCatalogo" class="estado" aria-live="polite">
            Conectando con Next Level...
        </p>

        <button
            class="continuar"
            id="botonRecarga"
            type="button"
            disabled
        >
            Cargando catálogo...
        </button>

        <div class="separador">
            <button
                class="recargar"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas Especiales
            </button>
        </div>

        <p class="nota">
            Gamers Gold Top-Up · Recargas gaming
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const CATALOGO_URL =
    SUPABASE_URL + "/functions/v1/nextlevel-catalogo";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const selector = document.getElementById("cantidad");
const estado = document.getElementById("estadoCatalogo");
const boton = document.getElementById("botonRecarga");

let productosCatalogo = [];
let catalogoCargado = false;

function abrirOfertas() {
    window.location.href = "ofertas-mobilelegends.html";
}

function normalizar(valor) {
    return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();
}

function obtenerIdentificador(producto) {
    return producto.productId ||
           producto.product_id ||
           producto.id ||
           "";
}

function obtenerNombre(producto) {
    return producto.name ||
           producto.product_name ||
           producto.title ||
           "";
}

function obtenerRegion(producto) {
    const region = producto.region ||
                   producto.provider_region ||
                   producto.game?.region ||
                   "";

    if (typeof region === "string") {
        return region;
    }

    return region.name || region.code || "";
}

function obtenerDisponibilidad(producto) {
    return producto.available !== false &&
           producto.available !== 0 &&
           producto.available !== "false";
}

function extraerProductos(datos) {
    if (Array.isArray(datos)) return datos;
    if (Array.isArray(datos.productos)) return datos.productos;
    if (Array.isArray(datos.products)) return datos.products;
    if (Array.isArray(datos.data)) return datos.data;
    if (Array.isArray(datos.data?.products)) {
        return datos.data.products;
    }

    return [];
}

async function cargarCatalogo() {
    catalogoCargado = false;
    selector.disabled = true;
    boton.disabled = true;

    estado.textContent = "Consultando el catálogo de Next Level...";
    selector.innerHTML = "<option value=''>Cargando...</option>";

    try {
        const respuesta = await fetch(
            CATALOGO_URL + "?game=mobile-legends",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const texto = await respuesta.text();

        let datos;

        try {
            datos = JSON.parse(texto);
        } catch {
            throw new Error(
                "La respuesta del catálogo no es JSON válido."
            );
        }

        if (!respuesta.ok) {
            throw new Error(
                datos.error ||
                datos.message ||
                "Error HTTP " + respuesta.status
            );
        }

        console.log("Respuesta completa de Next Level:", datos);

        const recibidos = extraerProductos(datos);

        if (recibidos.length === 0) {
            throw new Error(
                "Next Level no devolvió productos. " +
                "Revisa la respuesta de la función."
            );
        }

        /*
         * No limitamos el catálogo a LATAM:
         * el proveedor devuelve productos Global y United States.
         * Conservamos el identificador real de cada producto.
         */
        productosCatalogo = recibidos
            .filter(producto => {
                return obtenerIdentificador(producto) &&
                       obtenerNombre(producto) &&
                       obtenerDisponibilidad(producto);
            })
            .map(producto => ({
                original: producto,
                productId: obtenerIdentificador(producto),
                name: obtenerNombre(producto),
                region: obtenerRegion(producto)
            }));

        selector.innerHTML = "";

        const inicial = document.createElement("option");
        inicial.value = "";
        inicial.textContent = "Selecciona un paquete";
        selector.appendChild(inicial);

        productosCatalogo.forEach(producto => {
            const opcion = document.createElement("option");

            opcion.value = producto.productId;

            opcion.textContent = producto.region
                ? producto.name + " — " + producto.region
                : producto.name;

            selector.appendChild(opcion);
        });

        if (productosCatalogo.length === 0) {
            selector.disabled = true;
            estado.textContent =
                "El proveedor respondió, pero no encontramos " +
                "productos con identificadores y nombres válidos.";

            boton.textContent = "Sin productos disponibles";
            return;
        }

        selector.disabled = false;
        catalogoCargado = true;

        estado.textContent =
            productosCatalogo.length +
            " productos recibidos directamente de Next Level.";

        boton.textContent = "Continuar ⚡";
        actualizarBoton();

    } catch (error) {
        console.error("Error cargando catálogo:", error);

        selector.innerHTML =
            "<option value=''>Catálogo no disponible</option>";

        selector.disabled = true;
        boton.disabled = true;
        boton.textContent = "Catálogo no disponible";

        estado.textContent =
            "No se pudo cargar el catálogo: " + error.message;
    }
}

function actualizarBoton() {
    boton.disabled = !(
        catalogoCargado &&
        productosCatalogo.some(
            producto => producto.productId === selector.value
        )
    );
}

selector.addEventListener("change", actualizarBoton);

/*
 * Por seguridad, esta página solo consulta y selecciona
 * productos. No realiza cobros ni crea pedidos al proveedor.
 *
 * La compra debe conectarse a una función de backend que:
 * 1. Valide la sesión del usuario.
 * 2. Verifique el precio y saldo GVR en el servidor.
 * 3. Reciba player ID y Zone ID.
 * 4. Envíe el pedido al endpoint de órdenes de Next Level.
 * 5. Registre la respuesta del proveedor y gestione errores.
 */
boton.addEventListener("click", async () => {
    const playerId =
        document.getElementById("idjugador").value.trim();

    const zoneId =
        document.getElementById("zoneId").value.trim();

    const producto = productosCatalogo.find(
        item => item.productId === selector.value
    );

    if (!playerId || !zoneId) {
        alert("Introduce tu ID de jugador y tu Zone ID.");
        return;
    }

    if (!producto) {
        alert("Selecciona un producto válido.");
        return;
    }

    try {
        const { data: { session }, error } =
            await supabaseClient.auth.getSession();

        if (error || !session) {
            alert("Debes iniciar sesión antes de continuar.");
            window.location.href = "login.html";
            return;
        }

        /*
         * Todavía no se cobra ni se crea un pedido:
         * falta implementar y verificar el endpoint de órdenes
         * de Next Level y la compra con ambos identificadores.
         */
        alert(
            "Producto seleccionado: " + producto.name +
            "\nRegión: " + (producto.region || "No especificada") +
            "\n\nEl catálogo funciona correctamente, pero la compra " +
            "automática todavía no está conectada. No se ha cobrado GVR."
        );

    } catch (error) {
        console.error(error);
        alert("No se pudo comprobar la sesión del usuario.");
    }
});

cargarCatalogo();
</script>

</body>
</html>
