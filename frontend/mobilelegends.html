<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Legends | Gamers Gold Top-Up</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #050b18;
    color: white;
    min-height: 100vh;
    padding: 18px;
}

.contenedor {
    max-width: 520px;
    margin: auto;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 25px;
}

.logo {
    font-size: 20px;
    font-weight: 900;
}

.logo span {
    color: #00b7ff;
    text-shadow: 0 0 12px #008cff;
}

.volver {
    color: #21adff;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
}

.tarjeta {
    background: #091a35;
    border: 1px solid #15518c;
    border-radius: 18px;
    padding: 23px 18px;
    box-shadow: 0 0 25px #007bff12;
}

.icono {
    font-size: 48px;
    text-align: center;
    margin-bottom: 10px;
}

h1 {
    text-align: center;
    font-size: 26px;
    margin-bottom: 8px;
}

.descripcion {
    color: #a5bad1;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 22px;
}

h2 {
    font-size: 18px;
    margin-bottom: 15px;
}

label {
    display: block;
    color: #b9cce0;
    font-size: 13px;
    margin-bottom: 7px;
}

input, select {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 17px;
    background: #061226;
    color: white;
    border: 1px solid #204c78;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
}

input:focus, select:focus {
    border-color: #00aaff;
}

select option {
    background: #061226;
}

.estado {
    font-size: 12px;
    color: #9ab1c9;
    line-height: 1.5;
    margin-bottom: 16px;
}

.boton {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(90deg, #087cff, #00baff);
    color: white;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    text-align: center;
}

.boton:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.ofertas {
    display: block;
    margin-top: 18px;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #168dff;
    background: #0b2345;
    color: #55c8ff;
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
}

.ofertas:active {
    background: #123663;
}

.nota {
    text-align: center;
    color: #7188a2;
    font-size: 11px;
    line-height: 1.5;
    margin-top: 20px;
}

@media(max-width:380px) {
    .logo {
        font-size: 16px;
    }

    .tarjeta {
        padding: 20px 14px;
    }
}
</style>
</head>

<body>
<div class="contenedor">

<header>
    <div class="logo"><span>⚡</span> Gamers Gold Top-Up</div>
    <a href="juegos.html" class="volver">← Juegos</a>
</header>

<main class="tarjeta">

    <div class="icono">💎</div>

    <h1>Mobile Legends</h1>

    <p class="descripcion">
        Selecciona tus diamantes y prepara tu recarga.
    </p>

    <h2>💎 Recargas de diamantes</h2>

    <label for="idjugador">ID del jugador</label>
    <input
        id="idjugador"
        type="text"
        placeholder="Introduce tu ID"
        autocomplete="off"
    >

    <label for="zoneId">Zone ID</label>
    <input
        id="zoneId"
        type="text"
        placeholder="Introduce tu Zone ID"
        autocomplete="off"
    >

    <label for="cantidad">Selecciona tus diamantes</label>

    <select id="cantidad" disabled>
        <option value="">Cargando diamantes...</option>
    </select>

    <p id="estadoCatalogo" class="estado" aria-live="polite">
        Conectando con el catálogo de Next Level...
    </p>

    <button id="continuar" class="boton" type="button" disabled>
        Cargando catálogo...
    </button>

    <a href="ofertas-mobilelegends.html" class="ofertas">
        🎁 Ofertas Especiales
    </a>

    <p class="nota">
        Gamers Gold Top-Up · Tu mundo gaming, un solo lugar.
    </p>

</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const CATALOGO_URL =
    SUPABASE_URL + "/functions/v1/nextlevel-catalogo";

const cliente = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const selector = document.getElementById("cantidad");
const estado = document.getElementById("estadoCatalogo");
const boton = document.getElementById("continuar");

let productosDiamantes = [];

function obtenerProductos(datos) {
    if (Array.isArray(datos)) return datos;
    if (Array.isArray(datos.productos)) return datos.productos;
    if (Array.isArray(datos.products)) return datos.products;
    if (Array.isArray(datos.data)) return datos.data;
    if (Array.isArray(datos.data?.products)) {
        return datos.data.products;
    }

    return [];
}

function nombreProducto(producto) {
    return String(
        producto.name ||
        producto.product_name ||
        producto.title ||
        ""
    );
}

function idProducto(producto) {
    return producto.productId ||
           producto.product_id ||
           producto.id ||
           "";
}

function regionProducto(producto) {
    const region =
        producto.region ||
        producto.provider_region ||
        producto.game?.region ||
        "";

    if (typeof region === "string") return region;

    return region.name || region.code || "";
}

function esDiamantes(producto) {
    const nombre = nombreProducto(producto)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();

    /*
     * Solo mostramos recargas de diamantes.
     * Los pases, membresías y paquetes especiales
     * quedan fuera de esta página.
     */
    const contieneDiamantes =
        /\bdiamonds?\b/.test(nombre);

    const esOfertaEspecial =
        /\b(pass|pack|elite|twilight|weekly|monthly|membership)\b/
        .test(nombre);

    return contieneDiamantes && !esOfertaEspecial;
}

function disponible(producto) {
    return producto.available !== false &&
           producto.available !== 0 &&
           producto.available !== "false";
}

async function cargarCatalogo() {
    selector.disabled = true;
    boton.disabled = true;

    try {
        const respuesta = await fetch(
            CATALOGO_URL + "?game=mobile-legends",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const texto = await respuesta.text();
        let datos;

        try {
            datos = JSON.parse(texto);
        } catch {
            throw new Error("Respuesta no válida del catálogo.");
        }

        if (!respuesta.ok) {
            throw new Error(
                datos.error ||
                datos.message ||
                "Error HTTP " + respuesta.status
            );
        }

        const productos = obtenerProductos(datos);

        productosDiamantes = productos.filter(producto =>
            disponible(producto) &&
            esDiamantes(producto) &&
            idProducto(producto)
        );

        selector.innerHTML = "";

        if (productosDiamantes.length === 0) {
            selector.innerHTML =
                '<option value="">No hay diamantes disponibles</option>';

            estado.textContent =
                "No encontramos recargas de diamantes disponibles. Intenta más tarde.";

            return;
        }

        const inicial = document.createElement("option");
        inicial.value = "";
        inicial.textContent = "Selecciona un paquete";
        selector.appendChild(inicial);

        productosDiamantes.forEach((producto, indice) => {
            const opcion = document.createElement("option");

            opcion.value = String(indice);

            const region = regionProducto(producto);
            opcion.textContent =
                nombreProducto(producto) +
                (region ? " · " + region : "");

            selector.appendChild(opcion);
        });

        selector.disabled = false;
        boton.disabled = false;
        boton.textContent = "Continuar";

        estado.textContent =
            productosDiamantes.length +
            " recargas de diamantes disponibles.";

    } catch (error) {
        console.error("Error al cargar Mobile Legends:", error);

        selector.innerHTML =
            '<option value="">Error al cargar los diamantes</option>';

        estado.textContent =
            "No pudimos conectar con el catálogo. Recarga la página e inténtalo nuevamente.";

        boton.textContent = "Intentar de nuevo";
        boton.disabled = false;
    }
}

boton.addEventListener("click", async function() {
    if (!productosDiamantes.length) {
        await cargarCatalogo();
        return;
    }

    const idJugador =
        document.getElementById("idjugador").value.trim();

    const zoneId =
        document.getElementById("zoneId").value.trim();

    const indice = selector.value;

    if (!idJugador || !zoneId) {
        alert("Introduce tu ID de jugador y tu Zone ID.");
        return;
    }

    if (indice === "" ||
        !productosDiamantes[Number(indice)]) {
        alert("Selecciona primero tus diamantes.");
        return;
    }

    const producto = productosDiamantes[Number(indice)];

    /*
     * No cobramos ni creamos pedidos aquí:
     * la compra con Next Level aún debe conectarse
     * al proceso real de pedidos del proveedor.
     */
    alert(
        "Paquete seleccionado: " + nombreProducto(producto) +
        "\nRegión: " + (regionProducto(producto) || "No especificada") +
        "\nID de jugador: " + idJugador +
        "\nZone ID: " + zoneId +
        "\n\nLa compra automática todavía no está conectada."
    );
});

cargarCatalogo();
</script>

</body>
</html>
