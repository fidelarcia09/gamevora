<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#050b18">
<title>Recargar GVR | Gamers Gold Top-Up</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--fondo:#050b18;--borde:#17365c;--azul:#00aaff;--cian:#28d9ff;--muted:#91a4c0}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;padding-bottom:105px;background:radial-gradient(ellipse at top,#102750 0%,transparent 48%),var(--fondo);color:#fff}
header{max-width:700px;margin:auto;padding:20px 16px}
.volver{display:inline-flex;align-items:center;gap:10px;color:#eaf7ff;text-decoration:none;font-size:15px;font-weight:800}
.flecha{width:38px;height:38px;display:grid;place-items:center;border:1px solid #17649a;border-radius:11px;background:#103b65;color:#4bcaff;font-size:22px}
main{max-width:620px;margin:10px auto 30px;padding:0 15px}
.bloque{padding:19px;margin-bottom:14px;border:1px solid var(--borde);border-radius:19px;background:linear-gradient(155deg,#0b1b36,#071226);box-shadow:0 12px 35px #0003}
.cabecera{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
h1{font-size:clamp(19px,5vw,24px)}
.saldo{text-align:right;color:var(--muted);font-size:11px;white-space:nowrap}
.saldo strong{display:block;margin-top:5px;color:var(--cian);font-size:15px}
.contador{display:grid;grid-template-columns:48px 1fr 48px;gap:10px;align-items:center}
.contador button{height:47px;border:1px solid #1c5684;border-radius:13px;background:#071a32;color:var(--cian);font-size:26px;cursor:pointer}
.contador input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:white;text-align:center;font-size:28px;font-weight:800}
.hint{text-align:center;margin-top:12px;color:var(--muted);font-size:12px}
.cantidades{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:15px}
.rapida{padding:11px 2px;border:1px solid #1b3c63;border-radius:11px;background:#061329;color:white;font-weight:800;font-size:13px;cursor:pointer}
.rapida.activa,.metodo.activo{border-color:var(--azul);background:#0b2a49;color:var(--cian)}
h2{font-size:17px;margin-bottom:14px}
.metodos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.metodo{min-width:0;min-height:88px;padding:13px 11px;text-align:left;border:1px solid #1b3c63;border-radius:14px;background:#061329;color:white;cursor:pointer}
.metodo:disabled{opacity:.48;cursor:not-allowed}
.metodo-icono{display:block;margin-bottom:8px;color:var(--cian);font-size:16px;font-weight:900}
.metodo strong{display:block;font-size:13px;line-height:1.35}
.metodo small{display:block;margin-top:5px;color:var(--muted);font-size:10px;line-height:1.4}
.instantaneo{color:#55e6ae!important}
.barra{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:12px 15px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #17436b;background:rgba(4,13,29,.97);box-shadow:0 -10px 30px #0005}
.barra-interior{max-width:590px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.recibes span{display:block;margin-bottom:4px;color:var(--muted);font-size:11px}
.recibes strong{color:var(--cian);font-size:19px;white-space:nowrap}
.pagar{min-width:145px;min-height:48px;padding:10px 15px;border:0;border-radius:13px;background:linear-gradient(100deg,#00aaff,#28d9ff);color:#00101c;font-size:14px;font-weight:900;cursor:pointer}
.pagar:disabled{opacity:.45;cursor:not-allowed}
.mensaje{display:none;max-width:590px;margin:9px auto 0;padding:10px;border:1px solid #854848;border-radius:10px;background:#30151b;color:#ffb5b5;font-size:12px}
.mensaje.visible{display:block}
@media(max-width:390px){header{padding:17px 13px}main{padding:0 12px}.bloque{padding:16px 13px}.contador{grid-template-columns:43px 1fr 43px;gap:7px}.cantidades{gap:5px}.rapida{font-size:12px;padding:10px 1px}.metodo{padding:12px 9px}.pagar{min-width:130px;padding:9px 11px}}
</style></head>
<body>
<header><a class="volver" href="wallet.html"><span class="flecha">‹</span><span>Recargar GVR</span></a></header>
<main>
<section class="bloque">
<div class="cabecera"><h1>¿Cuánto quieres recargar?</h1><div class="saldo">Tienes<strong id="saldoActual">0.00 Gvr</strong></div></div>
<div class="contador"><button id="restar" type="button" aria-label="Restar">−</button><input id="cantidad" type="number" min="1" max="1000000" step="1" value="5" inputmode="numeric" aria-label="Cantidad de GVR"><button id="sumar" type="button" aria-label="Sumar">+</button></div>
<p class="hint">Pagas según el precio</p>
<div class="cantidades"><button class="rapida activa" type="button" data-cantidad="5">5</button><button class="rapida" type="button" data-cantidad="10">10</button><button class="rapida" type="button" data-cantidad="25">25</button><button class="rapida" type="button" data-cantidad="50">50</button><button class="rapida" type="button" data-cantidad="100">100</button></div>
</section>
<section class="bloque"><h2>¿Cómo vas a pagar?</h2>
<div class="metodos">
<button class="metodo" type="button" data-metodo="CUP" disabled aria-disabled="true"><span class="metodo-icono">CUP</span><strong>Transfermovil CUP</strong><small>Próximamente disponible</small></button>
<button class="metodo" type="button" data-metodo="Saldo móvil"><span class="metodo-icono">MÓVIL</span><strong>Saldo móvil</strong><small>Desde tu línea Cubacel</small></button>
<button class="metodo" type="button" data-metodo="USDT"><span class="metodo-icono">₮ USDT</span><strong>USDT</strong><small>Red BEP20 · <span class="instantaneo">Se confirma al instante</span></small></button>
</div></section>
</main>
<div class="barra"><div class="barra-interior"><div class="recibes"><span>Recibes</span><strong id="recibes">5.00 Gvr</strong></div><button class="pagar" id="pagar" type="button">Pagar 5 USDT</button></div><div class="mensaje" id="mensaje" role="alert"></div></div>
<script>
(() => {
"use strict";
const SUPABASE_URL="https://gsuhzcavghsiolmipnzi.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const tarifas={CUP:1150,USDT:1,"Saldo móvil":340};
const input=document.getElementById("cantidad"),rapidas=[...document.querySelectorAll(".rapida")],metodos=[...document.querySelectorAll(".metodo")];
const recibe=document.getElementById("recibes"),botonPagar=document.getElementById("pagar"),mensaje=document.getElementById("mensaje");
let metodo="USDT";
function fmt(n,d=2){return new Intl.NumberFormat("es-ES",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}
function cantidad(){const s=input.value.trim(),n=Number(s);return s&&Number.isFinite(n)&&n>=1&&n<=1000000&&Number.isInteger(n)?n:null}
function actualizar(){
 const n=cantidad();rapidas.forEach(b=>b.classList.toggle("activa",n!==null&&Number(b.dataset.cantidad)===n));
 if(n===null){recibe.textContent="0.00 Gvr";botonPagar.textContent="Pagar precio";botonPagar.disabled=true;return}
 recibe.textContent=fmt(n)+" Gvr";const total=n*tarifas[metodo];
 botonPagar.textContent=metodo==="USDT"?"Pagar "+fmt(total)+" USDT":metodo==="CUP"?"Pagar "+fmt(total,0)+" CUP":"Pagar "+fmt(total,0)+" de saldo";
 botonPagar.disabled=false;
}
function error(t){mensaje.textContent=t;mensaje.classList.add("visible")}
function limpiar(){mensaje.textContent="";mensaje.classList.remove("visible")}
document.getElementById("restar").addEventListener("click",()=>{input.value=Math.max(1,(cantidad()??1)-1);limpiar();actualizar()});
document.getElementById("sumar").addEventListener("click",()=>{input.value=Math.min(1000000,(cantidad()??1)+1);limpiar();actualizar()});
input.addEventListener("input",()=>{limpiar();actualizar()});
rapidas.forEach(b=>b.addEventListener("click",()=>{input.value=b.dataset.cantidad;limpiar();actualizar()}));
metodos.forEach(b=>b.addEventListener("click",()=>{if(b.disabled)return;metodo=b.dataset.metodo;metodos.forEach(x=>x.classList.toggle("activo",x===b));limpiar();actualizar()}));
botonPagar.addEventListener("click",()=>{const n=cantidad();if(n===null){error("Selecciona una cantidad válida de GVR.");return}const params=new URLSearchParams({cantidad:String(n),metodo});window.location.href="confirmar-gvr.html?"+params.toString()});
async function cargarSaldo(){try{const {data:{user},error:authError}=await supabaseClient.auth.getUser();if(authError||!user)return;const {data,error}=await supabaseClient.from("wallets").select("balance").eq("user_id",user.id).maybeSingle();if(error){console.warn("No se pudo cargar el saldo GVR",error);return}const saldo=Number(data?.balance??0);if(Number.isFinite(saldo))document.getElementById("saldoActual").textContent=fmt(saldo)+" Gvr"}catch(e){console.warn("No se pudo consultar el saldo GVR",e)}}
actualizar();cargarSaldo();
})();
</script>
<script src="./goldi-widget.js?v=20261023-16" defer></script>
</body></html>
