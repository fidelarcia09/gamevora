<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Movimientos | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .volver {
            color: #28a9ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .card {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: #8195ad;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .movimiento {
            background: #061226;
            border: 1px solid #173d63;
            border-radius: 13px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .tipo {
            font-weight: bold;
            font-size: 14px;
        }

        .fecha {
            color: #7188a0;
            font-size: 11px;
            margin-top: 5px;
        }

        .cantidad {
            font-weight: bold;
            font-size: 15px;
            white-space: nowrap;
        }

        .positivo {
            color: #38d996;
        }

        .negativo {
            color: #ff6b6b;
        }

        .vacio {
            text-align: center;
            color: #7188a0;
            font-size: 13px;
            padding: 25px 10px;
        }

        .nota {
            margin-top: 20px;
            text-align: center;
            color: #627b97;
            font-size: 11px;
            line-height: 1.5;
        }
    .boton-atras{display:inline-flex;align-items:center;gap:9px;width:fit-content;max-width:100%;margin:0 auto 0 0;color:#eaf7ff;text-decoration:none;font-size:13px;font-weight:800;line-height:1}.icono-atras{width:38px;height:38px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #17649a;border-radius:11px;background:linear-gradient(145deg,#103b65,#08203b);color:#4bcaff;box-shadow:0 5px 15px rgba(0,21,45,.45)}.icono-atras svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.boton-atras:hover .icono-atras{border-color:#28a9ff;background:linear-gradient(145deg,#145184,#09294b)}.boton-atras:focus-visible{outline:2px solid #75d7ff;outline-offset:3px;border-radius:8px}

<div class="contenedor">

    <div class="header">

        <div class="logo">
            <span class="rayo">⚡</span> Gamers Gold Top-Up
        </div>

        <a href="cuenta.html" class="boton-atras"><span class="icono-atras" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/><path d="M9 12h11"/></svg></span><span>Atrás</span></a>

    </div>

    <div class="card">

        <h1>Movimientos GVR</h1>

        <p class="descripcion">
            Historial de movimientos de tu saldo.
        </p>

        <div class="movimiento">

            <div class="fila">

                <div>
                    <div class="tipo">
                        Saldo inicial
                    </div>

                    <div class="fecha">
                        23 Sep 2026
                    </div>
                </div>

                <div class="cantidad positivo">
                    +0 GVR
                </div>

            </div>

        </div>

        <div class="vacio">
            No hay más movimientos registrados.
        </div>

    </div>

</div>
