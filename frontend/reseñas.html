<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = window.supabase.createClient(
    "https://gsuhzcavghsiolmipnzi.supabase.co",
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx"
);

let ratingSeleccionado = 0;
const GAMEVORA_OWNER_ID =
    "c8a0fe0c-6ba0-4459-8b82-fb392b648a5f";

let usuarioActual = null;

const opcionesRayos =
    document.querySelectorAll(".rayo-opcion");

opcionesRayos.forEach((boton) => {

    boton.addEventListener("click", () => {

        ratingSeleccionado =
            Number(boton.dataset.rating);

        opcionesRayos.forEach((rayo, index) => {

            rayo.classList.toggle(
                "seleccionado",
                index < ratingSeleccionado
            );

        });

    });

});


function mostrarEscudos(cantidad) {
    let resultado = "";
    const valor = Number(cantidad) || 0;

    for (let i = 1; i <= 5; i++) {
        const estado = i <= valor ? "activo" : "inactivo";
        resultado += `<img class="escudo-valoracion ${estado}" src="./gvr-escudo.svg" alt="" aria-hidden="true">`;
    }

    return resultado;
}

async function cargarReseñas() {

    const { data: { user } } =
        await supabaseClient.auth.getUser();

    usuarioActual = user;

    const { data: reseñas, error } =
        await supabaseClient
            .from("reviews")
            .select(`
                id,
                user_id,
                rating,
                comment,
                username,
                created_at
            `)
            .order("created_at", {
                ascending: false
            });

    if (error) {

        console.error("Error cargando reseñas:", error);

        document.getElementById(
            "listaReseñas"
        ).innerHTML = `
            <div class="mensaje">
                No se pudieron cargar las reseñas.
            </div>
        `;

        return;
    }

    const lista =
        document.getElementById("listaReseñas");

    lista.innerHTML = "";

    if (!reseñas || reseñas.length === 0) {

        lista.innerHTML = `
            <div class="mensaje">
                Todavía no hay reseñas.
                ¡Sé el primero en dejar la tuya!
            </div>
        `;

        document.getElementById("promedio").textContent =
            "0.0";

        document.getElementById("rayosPromedio").innerHTML =
            mostrarEscudos(0);

        document.getElementById("contador").textContent =
            "0 reseñas";

        return;
    }

    const suma =
        reseñas.reduce(
            (total, reseña) =>
                total + reseña.rating,
            0
        );

    const promedio =
        suma / reseñas.length;

    document.getElementById("promedio").textContent =
        promedio.toFixed(1);

    document.getElementById("rayosPromedio").innerHTML =
        mostrarEscudos(promedio);

    document.getElementById("contador").textContent =
        reseñas.length === 1
            ? "1 reseña"
            : `${reseñas.length} reseñas`;

    reseñas.forEach((reseña) => {

        const tarjeta =
            document.createElement("div");

        tarjeta.className = "reseña";

        const fecha =
            new Date(
                reseña.created_at
            ).toLocaleDateString("es-ES");

        tarjeta.innerHTML = `

            <div class="reseña-header">

                <div class="usuario"></div>

                <div class="fecha">
                    ${fecha}
                </div>

            </div>

            <div class="rayos-reseña">
                ${mostrarEscudos(reseña.rating)}
            </div>

            <div class="comentario"></div>

        `;

        tarjeta.querySelector(".usuario").textContent =
            reseña.username || "Usuario";

        tarjeta.querySelector(".comentario").textContent =
            reseña.comment || "";

        // Mostrar botón de eliminar solamente al administrador
        if (
            usuarioActual &&
            usuarioActual.id === GAMEVORA_OWNER_ID
        ) {

            const botonEliminar =
                document.createElement("button");

            botonEliminar.className =
                "boton-eliminar";

            botonEliminar.textContent =
                "🗑️ Eliminar reseña";

            botonEliminar.addEventListener(
                "click",
                () => eliminarReseña(reseña.id)
            );

            tarjeta.appendChild(botonEliminar);
        }

        lista.appendChild(tarjeta);

    });

    }    

async function eliminarReseña(id) {

    const confirmar =
        confirm(
            "¿Seguro que quieres eliminar esta reseña?"
        );

    if (!confirmar) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("reviews")
            .delete()
            .eq("id", id);

    if (error) {

        console.error(error);

        alert(
            "No se pudo eliminar la reseña:\n\n" +
            error.message
        );

        return;
    }

    alert(
        "Reseña eliminada correctamente."
    );

    cargarReseñas();
}
        
async function publicarReseña() {

    const comentario =
        document
            .getElementById("comentario")
            .value
            .trim();


    if (ratingSeleccionado === 0) {

        alert(
            "Selecciona entre 1 y 5 escudos GVR."
        );

        return;
    }


    if (comentario === "") {

        alert(
            "Escribe tu reseña."
        );

        return;
    }


    const {
        data: { session },
        error: sessionError
    } =
        await supabaseClient.auth.getSession();


    if (sessionError || !session) {

        alert(
            "Debes iniciar sesión para dejar una reseña."
        );

        window.location.href =
            "login.html";

        return;
    }


    const boton =
        document.getElementById(
            "botonPublicar"
        );

    boton.disabled = true;

    boton.textContent =
        "Publicando...";


    const { error } =
        await supabaseClient
            .from("reviews")
            .insert({
                user_id: session.user.id,
                rating: ratingSeleccionado,
                comment: comentario
            });


    if (error) {

        console.error(error);

        alert(
            "No se pudo publicar la reseña:\n\n" +
            error.message
        );

        boton.disabled = false;

        boton.textContent =
            "Publicar reseña";

        return;
    }


    alert(
        "¡Reseña publicada correctamente!"
    );


    document
        .getElementById("comentario")
        .value = "";


    ratingSeleccionado = 0;


    opcionesRayos.forEach(
        (rayo) =>
            rayo.classList.remove(
                "seleccionado"
            )
    );


    boton.disabled = false;

    boton.textContent =
        "Publicar reseña";


    cargarReseñas();

}


document
    .getElementById("botonPublicar")
    .addEventListener(
        "click",
        publicarReseña
    );

document
    .getElementById("btnDejarReseña")
    .addEventListener("click", () => {
        const formulario = document.getElementById("formularioReseña");
        formulario.hidden = false;

        document
            .getElementById("btnDejarReseña")
            .setAttribute("aria-expanded", "true");

        formulario.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

        window.setTimeout(() => {
            document.querySelector("#selectorRayos .rayo-opcion")?.focus();
        }, 350);
    });

cargarReseñas();

</script>
