<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b18">
    <meta name="description" content="Recarga Genesis Crystals de Genshin Impact en Gamers Gold Top-Up.">

    <title>Genshin Impact | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 650px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 21px;
            font-weight: 900;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .volver {
            color: #28a9ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .tarjeta {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
        }

        .icono {
            text-align: center;
            font-size: 52px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .etiqueta {
            display: block;
            margin: 18px 0 10px;
            color: #b8c9dc;
            font-size: 13px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        input:disabled,
        select:disabled {
            opacity: 0.7;
        }

        .ayuda {
            margin-top: 7px;
            color: #8299b4;
            font-size: 11px;
            line-height: 1.5;
        }

        .estado {
            padding: 13px;
            margin: 18px 0;
            border: 1px solid #204c78;
            border-radius: 10px;
            background: #061226;
            color: #a9c4df;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .estado.error {
            color: #ffaaaa;
            border-color: #843d4b;
        }

        .estado.exito {
            color: #8fffc1;
            border-color: #23865a;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .producto {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
            min-height: 125px;
            padding: 15px 12px;
            background: #061226;
            color: white;
            border: 1px solid #164b75;
            border-radius: 13px;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .producto:hover:not(:disabled) {
            border-color: #168cff;
        }

        .producto.seleccionado {
            border-color: #00baff;
            box-shadow: 0 0 12px rgba(0, 186, 255, 0.15);
        }

        .producto:disabled {
            cursor: default;
        }

        .producto-nombre {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .producto-precio {
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
        }

        .producto-estado {
            color: #45c8ff;
            font-size: 12px;
            font-weight: bold;
        }

        .resumen {
            display: none;
            margin-top: 18px;
            padding: 15px;
            border: 1px solid #168cff;
            border-radius: 12px;
            background: #071b36;
        }

        .resumen.visible {
            display: block;
        }

        .resumen-titulo {
            color: #70c4ff;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .resumen-producto {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .resumen-precio {
            margin-top: 8px;
            font-size: 23px;
            font-weight: bold;
        }

        .separador-ofertas {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #164b8f;
        }

        .boton {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
        }

        .continuar {
            margin-top: 18px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .continuar:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .boton-ofertas {
            background: #07152b;
            color: #28a9ff;
            border: 1px solid #168cff;
            cursor: pointer;
        }

        .boton-ofertas:hover {
            background: #0a2345;
            border-color: #38a8ff;
        }

        .nota {
            margin-top: 20px;
            text-align: center;
            color: #8299b4;
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .tarjeta {
                padding: 22px 14px;
            }

            .catalogo {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <header class="header">
        <div class="logo">
            <span class="rayo">⚡</span> Gamers Gold Top-Up
        </div>

        <a href="juegos.html" class="volver">← Juegos</a>
    </header>

    <main class="tarjeta">

        <div class="icono">⚔️</div>

        <h1>Genshin Impact</h1>

        <p class="descripcion">
            Selecciona tu paquete de Genesis Crystals.
        </p>

        <label class="etiqueta" for="idJugador">
            ID del jugador
        </label>

        <input
            type="text"
            id="idJugador"
            placeholder="Introduce tu ID de jugador"
            autocomplete="off"
            maxlength="100"
        >

        <p class="ayuda">
            Comprueba que tu UID sea correcto antes de realizar el pedido.
        </p>

        <label class="etiqueta" for="zonaJugador">
            Servidor o zona
        </label>

        <select id="zonaJugador">
            <option value="">Selecciona tu servidor</option>
            <option value="America">América</option>
            <option value="Europe">Europa</option>
            <option value="Asia">Asia</option>
            <option value="TW_HK_MO">TW / HK / MO</option>
        </select>

        <label class="etiqueta">
            Selecciona tu paquete
        </label>

        <div id="estadoCatalogo" class="estado" aria-live="polite">
            Cargando paquetes...
        </div>

        <div id="catalogo" class="catalogo"></div>

        <div id="resumen" class="resumen" aria-live="polite">
            <div class="resumen-titulo">Tu selección</div>
            <div id="resumenProducto" class="resumen-producto"></div>
            <div id="resumenPrecio" class="resumen-precio"></div>
        </div>

        <button
            id="botonContinuar"
            class="boton continuar"
            type="button"
            disabled
        >
            Selecciona un paquete
        </button>

        <div class="separador-ofertas">
            <button
                id="botonOfertas"
                class="boton boton-ofertas"
                type="button"
            >
                Ofertas especiales
            </button>
        </div>

        <p class="nota">
            Revisa tu UID, servidor y paquete antes de confirmar.
            El pedido se procesará utilizando tu saldo GVR.
        </p>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const URL_CREAR_PEDIDO =
    SUPABASE_URL + "/functions/v1/nextlevel-crear-pedido";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);

const catalogo = document.getElementById("catalogo");
const estadoCatalogo = document.getElementById("estadoCatalogo");
const idJugador = document.getElementById("idJugador");
const zonaJugador = document.getElementById("zonaJugador");
const botonContinuar = document.getElementById("botonContinuar");
const botonOfertas = document.getElementById("botonOfertas");
const resumen = document.getElementById("resumen");
const resumenProducto = document.getElementById("resumenProducto");
const resumenPrecio = document.getElementById("resumenPrecio");

/*
 * Solo se admiten los siete productos actuales.
 * Los productos antiguos no se mostrarán aunque existan
 * otros registros de Genshin Impact en la base de datos.
 */

const PRODUCTOS_PERMITIDOS = [
    "fz-genshin_impact_global-60_genesis_crystals",
    "fz-genshin_impact_global-300_30_genesis_crystals",
    "fz-genshin_impact_global-blessing_of_the_welkin_moon",
    "fz-genshin_impact_global-980_110_genesis_crystals",
    "fz-genshin_impact_global-1980_260_genesis_crystals",
    "fz-genshin_impact_global-3280_600_genesis_crystals",
    "fz-genshin_impact_global-6480_1600_genesis_crystals"
];

let productosDisponibles = [];
let productoSeleccionado = null;
let procesandoPedido = false;

/*
 * Si una llamada devuelve un resultado incierto, bloqueamos
 * nuevas compras desde esta página durante esta sesión.
 */

let resultadoIncierto = false;

/* =====================================================
   UTILIDADES
===================================================== */

function mostrarEstado(mensaje, tipo = "") {
    estadoCatalogo.textContent = mensaje;

    estadoCatalogo.classList.toggle(
        "error",
        tipo === "error"
    );

    estadoCatalogo.classList.toggle(
        "exito",
        tipo === "exito"
    );
}

function obtenerNombre(producto) {
    return String(producto.product_name || "").trim();
}

function obtenerPrecio(producto) {
    const precio = Number(producto.price_gvr);

    return Number.isFinite(precio) && precio > 0
        ? precio
        : null;
}

function formatearGVR(valor) {
    return Number(valor).toLocaleString("es-ES", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }) + " GVR";
}

function actualizarBoton() {
    if (procesandoPedido) {
        botonContinuar.disabled = true;
        botonContinuar.textContent = "Procesando pedido...";
        return;
    }

    if (resultadoIncierto) {
        botonContinuar.disabled = true;
        botonContinuar.textContent = "Pedido pendiente de revisión";
        return;
    }

    if (!productosDisponibles.length) {
        botonContinuar.disabled = true;
        botonContinuar.textContent = "Paquetes no disponibles";
        return;
    }

    if (!productoSeleccionado) {
        botonContinuar.disabled = true;
        botonContinuar.textContent = "Selecciona un paquete";
        return;
    }

    if (
        !idJugador.value.trim() ||
        !zonaJugador.value
    ) {
        botonContinuar.disabled = true;
        botonContinuar.textContent = "Completa los datos del jugador";
        return;
    }

    botonContinuar.disabled = false;
    botonContinuar.textContent = "Confirmar y comprar";
}

function bloquearFormulario() {
    idJugador.disabled = true;
    zonaJugador.disabled = true;

    catalogo.querySelectorAll("button").forEach(boton => {
        boton.disabled = true;
    });

    botonContinuar.disabled = true;
}

function mostrarErrorCompra(mensaje) {
    mostrarEstado(mensaje, "error");

    window.scrollTo({
        top: estadoCatalogo.getBoundingClientRect().top +
             window.scrollY - 20,
        behavior: "smooth"
    });
}

/* =====================================================
   NAVEGACIÓN
===================================================== */

botonOfertas.addEventListener("click", () => {
    window.location.href = "ofertas-genshin.html";
});

/* =====================================================
   CARGAR PRODUCTOS ACTIVOS Y PRECIOS GVR
===================================================== */

async function cargarCatalogo() {
    productoSeleccionado = null;
    productosDisponibles = [];

    catalogo.replaceChildren();
    resumen.classList.remove("visible");

    mostrarEstado("Cargando paquetes...");

    if (!window.supabase) {
        mostrarEstado(
            "No se pudo inicializar la página. Recarga e inténtalo nuevamente.",
            "error"
        );
        return;
    }

    try {
        const { data, error } = await supabaseClient
            .from("game_products")
            .select(
                "id, game, product_name, price_gvr, active, provider, provider_product_id"
            )
            .eq("game", "Genshin Impact")
            .eq("active", true)
            .eq("provider", "nextlevel")
            .in("provider_product_id", PRODUCTOS_PERMITIDOS);

        if (error) {
            throw error;
        }

        const mapa = new Map();

        (data || []).forEach(producto => {
            const id = String(
                producto.provider_product_id || ""
            );

            const precio = obtenerPrecio(producto);

            if (
                !PRODUCTOS_PERMITIDOS.includes(id) ||
                !producto.id ||
                !precio
            ) {
                return;
            }

            mapa.set(id, {
                ...producto,
                price_gvr: precio
            });
        });

        productosDisponibles = PRODUCTOS_PERMITIDOS
            .filter(id => mapa.has(id))
            .map(id => mapa.get(id));

        if (!productosDisponibles.length) {
            mostrarEstado(
                "No hay paquetes disponibles en este momento.",
                "error"
            );
            actualizarBoton();
            return;
        }

        productosDisponibles.forEach(producto => {
            const tarjeta = document.createElement("button");

            tarjeta.type = "button";
            tarjeta.className = "producto";

            const nombre = document.createElement("div");
            nombre.className = "producto-nombre";
            nombre.textContent = obtenerNombre(producto);

            const precio = document.createElement("div");
            precio.className = "producto-precio";
            precio.textContent = formatearGVR(producto.price_gvr);

            const estado = document.createElement("div");
            estado.className = "producto-estado";
            estado.textContent = "Seleccionar paquete";

            tarjeta.append(nombre, precio, estado);

            tarjeta.addEventListener("click", () => {
                if (procesandoPedido || resultadoIncierto) {
                    return;
                }

                catalogo.querySelectorAll(".producto").forEach(
                    elemento => {
                        elemento.classList.remove("seleccionado");

                        const textoEstado =
                            elemento.querySelector(".producto-estado");

                        if (textoEstado) {
                            textoEstado.textContent =
                                "Seleccionar paquete";
                        }
                    }
                );

                tarjeta.classList.add("seleccionado");
                estado.textContent = "Paquete seleccionado";

                productoSeleccionado = producto;

                resumenProducto.textContent =
                    obtenerNombre(producto);

                resumenPrecio.textContent =
                    formatearGVR(producto.price_gvr);

                resumen.classList.add("visible");

                actualizarBoton();
            });

            catalogo.appendChild(tarjeta);
        });

        mostrarEstado(
            productosDisponibles.length +
            " paquetes disponibles."
        );

        actualizarBoton();

    } catch (error) {
        console.error("Error cargando el catálogo:", error);

        mostrarEstado(
            "No se pudieron cargar los paquetes. Recarga la página e inténtalo nuevamente.",
            "error"
        );

        actualizarBoton();
    }
}

/* =====================================================
   VALIDAR DATOS
===================================================== */

function validarFormulario() {
    const jugador = idJugador.value.trim();
    const zona = zonaJugador.value;

    if (!jugador) {
        mostrarErrorCompra(
            "Introduce tu ID de jugador."
        );

        idJugador.focus();
        return false;
    }

    if (jugador.length > 100) {
        mostrarErrorCompra(
            "El ID del jugador no es válido."
        );

        idJugador.focus();
        return false;
    }

    if (!zona) {
        mostrarErrorCompra(
            "Selecciona tu servidor."
        );

        zonaJugador.focus();
        return false;
    }

    if (!productoSeleccionado) {
        mostrarErrorCompra(
            "Selecciona primero un paquete."
        );

        return false;
    }

    if (
        !productosDisponibles.some(
            producto => producto.id === productoSeleccionado.id
        )
    ) {
        mostrarErrorCompra(
            "El paquete seleccionado ya no está disponible."
        );

        return false;
    }

    return true;
}

/* =====================================================
   PROCESAR COMPRA
===================================================== */

async function procesarCompra() {
    if (procesandoPedido || resultadoIncierto) {
        return;
    }

    if (!validarFormulario()) {
        return;
    }

    procesandoPedido = true;
    actualizarBoton();

    mostrarEstado(
        "Verificando tu sesión y preparando el pedido..."
    );

    try {
        /*
         * 1. Confirmar que existe una sesión autenticada.
         */

        const {
            data: sessionData,
            error: sessionError
        } = await supabaseClient.auth.getSession();

        if (sessionError) {
            throw new Error(
                "No se pudo verificar tu sesión. Vuelve a iniciar sesión."
            );
        }

        const session = sessionData?.session;

        if (!session?.access_token || !session?.user?.id) {
            procesandoPedido = false;
            actualizarBoton();

            mostrarErrorCompra(
                "Debes iniciar sesión para comprar. Inicia sesión y vuelve a intentarlo."
            );

            return;
        }

        /*
         * 2. Crear el pedido local y descontar el saldo GVR.
         *
         * Esta RPC se ejecuta una sola vez por intento.
         * No la repetimos si el envío posterior resulta incierto.
         */

        mostrarEstado(
            "Registrando tu pedido y verificando tu saldo..."
        );

        const { data: gameOrderId, error: purchaseError } =
            await supabaseClient.rpc(
                "purchase_game_product",
                {
                    p_product_id: productoSeleccionado.id,
                    p_player_id: idJugador.value.trim(),
                    p_zone_id: zonaJugador.value
                }
            );

        if (purchaseError) {
            console.error(
                "Error creando el pedido local:",
                purchaseError
            );

            throw new Error(
                purchaseError.message ||
                "No se pudo crear el pedido. Comprueba tu saldo GVR."
            );
        }

        /*
         * La función SQL debe devolver el UUID del pedido.
         */

        if (
            typeof gameOrderId !== "string" ||
            !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(
                gameOrderId
            )
        ) {
            /*
             * El resultado no permite confirmar el ID.
             * No ejecutamos de nuevo la compra.
             */

            resultadoIncierto = true;
            bloquearFormulario();

            mostrarErrorCompra(
                "El pedido pudo haberse registrado, pero no se pudo confirmar su identificador. No repitas la compra. Contacta con soporte para verificar el estado."
            );

            return;
        }

        /*
         * 3. Enviar el pedido existente a la Edge Function.
         *
         * IMPORTANTE:
         * No se vuelve a ejecutar purchase_game_product.
         */

        mostrarEstado(
            "Enviando tu pedido para su procesamiento..."
        );

        let respuestaEnvio;

        try {
            respuestaEnvio = await fetch(
                URL_CREAR_PEDIDO,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + session.access_token
                    },
                    body: JSON.stringify({
                        game_order_id: gameOrderId,
                        zone_id: zonaJugador.value
                    })
                }
            );
        } catch (errorRed) {
            console.error(
                "Resultado de envío no confirmado:",
                errorRed
            );

            resultadoIncierto = true;
            bloquearFormulario();

            mostrarErrorCompra(
                "Tu pedido quedó registrado, pero no pudimos confirmar su envío. No vuelvas a comprar el mismo paquete. Es necesario comprobar el estado del pedido antes de continuar."
            );

            return;
        }

        let resultadoEnvio;

        try {
            resultadoEnvio = await respuestaEnvio.json();
        } catch {
            resultadoEnvio = {};
        }

        /*
         * 4. Resultado confirmado por el sistema de pedidos.
         */

        if (
            respuestaEnvio.ok &&
            resultadoEnvio.success === true &&
            resultadoEnvio.game_order_id === gameOrderId
        ) {
            bloquearFormulario();

            mostrarEstado(
                "¡Pedido registrado correctamente! Tu recarga está en proceso. Puedes consultar su estado en el historial de pedidos.",
                "exito"
            );

            botonContinuar.textContent = "Pedido registrado";
            botonContinuar.disabled = true;

            resumenProducto.textContent =
                obtenerNombre(productoSeleccionado);

            resumenPrecio.textContent =
                formatearGVR(productoSeleccionado.price_gvr);

            resumen.classList.add("visible");

            console.log("Pedido aceptado:", {
                game_order_id: gameOrderId,
                provider_status: resultadoEnvio.provider_status
            });

            return;
        }

        /*
         * Un rechazo definitivo por saldo insuficiente del proveedor
         * debe ser reembolsado por el servidor.
         */

        if (
            resultadoEnvio.refunded === true &&
            resultadoEnvio.retry_safe === false
        ) {
            bloquearFormulario();

            mostrarErrorCompra(
                "No se pudo procesar la recarga y el sistema confirmó el reembolso de tus GVR. No repitas la compra hasta comprobar que el saldo se haya actualizado."
            );

            botonContinuar.textContent = "Pedido rechazado";
            return;
        }

        /*
         * Si el servidor señala un resultado incierto o no seguro,
         * bloqueamos nuevas compras para evitar duplicados.
         */

        if (
            resultadoEnvio.reconciliation_required === true ||
            resultadoEnvio.retry_safe === false ||
            respuestaEnvio.status >= 500
        ) {
            resultadoIncierto = true;
            bloquearFormulario();

            mostrarErrorCompra(
                "No se pudo confirmar el estado final del pedido. No repitas la compra. Comprueba el historial de pedidos o contacta con soporte para verificarlo."
            );

            return;
        }

        /*
         * Si el servidor rechazó el envío antes de confirmar una compra
         * remota y no marcó el resultado como incierto, conservamos el
         * UUID local para evitar crear un segundo pedido por accidente.
         */

        resultadoIncierto = true;
        bloquearFormulario();

        mostrarErrorCompra(
            "El pedido local fue creado, pero no se confirmó su procesamiento. No vuelvas a comprar todavía. Es necesario revisar el pedido existente."
        );

    } catch (error) {
        console.error("Error procesando la compra:", error);

        /*
         * Solo permitimos volver a intentar cuando no se ha creado
         * ningún pedido local.
         */

        procesandoPedido = false;
        actualizarBoton();

        mostrarErrorCompra(
            error.message ||
            "No se pudo completar la operación. Comprueba tu sesión y tu saldo GVR."
        );

    } finally {
        procesandoPedido = false;
        actualizarBoton();
    }
}

/* =====================================================
   EVENTOS
===================================================== */

idJugador.addEventListener("input", actualizarBoton);
zonaJugador.addEventListener("change", actualizarBoton);

botonContinuar.addEventListener("click", procesarCompra);

/* =====================================================
   INICIALIZACIÓN
===================================================== */

cargarCatalogo();
</script>

</html>
