<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Genshin Impact | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .volver {
            color: #28a9ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .tarjeta {
            background: #0a1830;
            border: 1px solid #164b8f;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 140, 255, 0.15);
        }

        .icono {
            font-size: 55px;
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #38a8ff;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #a9bdd8;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d9e7f7;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #225b9d;
            background: #07152b;
            color: white;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #38a8ff;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #168cff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0875dc;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .separador-ofertas {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #164b8f;
        }

        .boton-ofertas {
            width: 100%;
            padding: 13px;
            border: 1px solid #168cff;
            border-radius: 10px;
            background: #07152b;
            color: #28a9ff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton-ofertas:hover {
            background: #0a2345;
            border-color: #38a8ff;
        }

        .cargando {
            color: #9fb5d0;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="header">

        <div class="logo">
            <span class="rayo">⚡</span> Gamers Gold Top-Up
        </div>

        <a href="juegos.html" class="volver">
            ← Juegos
        </a>

    </div>

    <div class="tarjeta">

        <div class="icono">⚔️</div>

        <h1>Genshin Impact</h1>

        <p class="descripcion">
            Recarga Genshin Impact de forma rápida y sencilla.
        </p>

        <label for="idJugador">
            ID del jugador
        </label>

        <input
            type="text"
            id="idJugador"
            placeholder="Escribe tu ID de jugador"
            autocomplete="off"
        >

        <label for="cantidad">
            Selecciona tu recarga
        </label>

        <select id="cantidad">
            <option value="">Cargando productos...</option>
        </select>

        <button
            id="botonCompra"
            onclick="continuarPedido()"
        >
            Continuar
        </button>

        <div class="separador-ofertas">
            <button
                class="boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas Especiales
            </button>
        </div>

        <p id="mensaje" class="cargando"></p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


function abrirOfertas() {

    window.location.href =
        "ofertas-genshin.html";
}


async function cargarProductos() {

    const select =
        document.getElementById("cantidad");

    const mensaje =
        document.getElementById("mensaje");

    const {
        data,
        error
    } =
        await supabaseClient
            .from("game_products")
            .select(
                "id, game, product_name, game_currency_amount, price_gvr, active"
            )
            .eq("game", "Genshin Impact")
            .eq("active", true)
            .order("game_currency_amount", {
                ascending: true
            });


    if (error) {

        console.error(
            "ERROR PRODUCTOS GENSHIN:",
            error
        );

        select.innerHTML =
            '<option value="">No se pudieron cargar las recargas</option>';

        mensaje.textContent =
            "Error al cargar los productos.";

        return;
    }


    if (!data || data.length === 0) {

        select.innerHTML =
            '<option value="">No hay recargas disponibles</option>';

        return;
    }


    select.innerHTML =
        '<option value="">Selecciona una recarga</option>';


    data.forEach(producto => {

        const option =
            document.createElement("option");

        option.value =
            producto.product_name;

        option.textContent =
            producto.product_name +
            " — " +
            producto.price_gvr +
            " GVR";

        select.appendChild(option);

    });
}


async function continuarPedido() {

    const boton =
        document.getElementById("botonCompra");

    const idJugador =
        document
            .getElementById("idJugador")
            .value
            .trim();

    const cantidad =
        document
            .getElementById("cantidad")
            .value;


    if (!idJugador) {

        alert(
            "Escribe el ID de tu jugador."
        );

        return;
    }


    if (!cantidad) {

        alert(
            "Selecciona una recarga."
        );

        return;
    }


    boton.disabled = true;

    boton.textContent =
        "Procesando compra...";


    try {

        const {
            data: {
                session
            }
        } =
            await supabaseClient
                .auth
                .getSession();


        if (!session) {

            alert(
                "Debes iniciar sesión primero."
            );

            window.location.href =
                "login.html";

            return;
        }


        const {
            data: producto,
            error: productoError
        } =
            await supabaseClient
                .from("game_products")
                .select(
                    "id, game, product_name, game_currency_amount, price_gvr, active"
                )
                .eq("game", "Genshin Impact")
                .eq("product_name", cantidad)
                .eq("active", true)
                .maybeSingle();


        if (productoError) {

            console.error(
                "ERROR BUSCANDO PRODUCTO GENSHIN:",
                productoError
            );

            alert(
                "No se pudo comprobar el producto."
            );

            return;
        }


        if (!producto) {

            alert(
                "Producto no disponible."
            );

            return;
        }


        const {
            data: pedido,
            error: compraError
        } =
            await supabaseClient.rpc(
                "purchase_game_product",
                {
                    p_product_id: producto.id,
                    p_player_id: idJugador
                }
            );


        if (compraError) {

            console.error(
                "ERROR COMPRA GENSHIN:",
                compraError
            );

            const mensajeError =
                compraError.message || "";

            if (
                mensajeError
                    .toLowerCase()
                    .includes("saldo gvr insuficiente")
            ) {

                alert(
                    "Saldo GVR insuficiente."
                );

            } else {

                alert(
                    mensajeError ||
                    "No se pudo realizar la compra."
                );
            }

            return;
        }


        alert(
            "¡Compra realizada correctamente!\n\n" +
            "Pedido: " +
            pedido
        );


        window.location.href =
            "cuenta.html";


    } catch (error) {

        console.error(
            "ERROR GENERAL GENSHIN:",
            error
        );

        alert(
            error.message ||
            "Ocurrió un error al realizar la compra."
        );


    } finally {

        boton.disabled = false;

        boton.textContent =
            "Continuar";
    }
}


cargarProductos();

</script>

</body>
    </html>
