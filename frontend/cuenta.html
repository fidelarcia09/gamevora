<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mi cuenta | Gamers Gold Top-Up</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #050b18;
        color: white;
        min-height: 100vh;
        padding: 20px;
    }

    .contenedor {
        max-width: 500px;
        margin: auto;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        gap: 12px;
    }

    .logo {
        font-size: 24px;
        font-weight: 900;
    }

    .rayo {
        color: #00b7ff;
        text-shadow: 0 0 12px #008cff;
    }

    .volver {
        color: #28a9ff;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
    }

    .navegacion {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .separador {
        color: #31506f;
        font-size: 14px;
    }

    .card {
        background: #091a35;
        border: 1px solid #15518c;
        border-radius: 20px;
        padding: 25px 22px;
        box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
    }

    .avatar {
        width: 75px;
        height: 75px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: #061226;
        border: 2px solid #159dff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 35px;
    }

    h1 {
        text-align: center;
        font-size: 25px;
        margin-bottom: 5px;
    }

    .subtitulo {
        text-align: center;
        color: #8195ad;
        font-size: 13px;
        margin-bottom: 25px;
    }

    .dato {
        background: #061226;
        border: 1px solid #173d63;
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
    }

    .dato-titulo {
        color: #7891aa;
        font-size: 12px;
        margin-bottom: 5px;
    }

    .dato-valor {
        color: white;
        font-size: 15px;
        font-weight: bold;
        word-break: break-word;
    }

    .boton {
        display: block;
        width: 100%;
        padding: 13px;
        margin-top: 10px;
        border-radius: 10px;
        text-align: center;
        text-decoration: none;
        background: linear-gradient(90deg, #087cff, #00baff);
        color: white;
        font-size: 14px;
        font-weight: bold;
        border: none;
    }

    .boton-admin {
        background: linear-gradient(90deg, #063c72, #087cff);
        border: 1px solid #159dff;
        box-shadow: 0 0 15px rgba(0, 140, 255, 0.18);
    }

    .boton-admin:hover {
        box-shadow: 0 0 20px rgba(0, 170, 255, 0.35);
    }

    .boton-soporte {
        background: linear-gradient(90deg, #063c72, #087cff);
        border: 1px solid #159dff;
        box-shadow: 0 0 15px rgba(0, 140, 255, 0.18);
    }

    .boton-soporte:hover {
        box-shadow: 0 0 20px rgba(0, 170, 255, 0.35);
    }

    .boton-cerrar {
        background: #8b1e2d;
        border: 1px solid #ff4057;
        cursor: pointer;
    }

    .boton-cerrar:hover {
        background: #b42338;
        box-shadow: 0 0 15px rgba(255, 64, 87, 0.25);
    }

    #panelAdministracion {
        display: none;
    }

    @media (max-width: 400px) {
        .header {
            align-items: flex-start;
            flex-direction: column;
        }
    }
</style>

</head><body><div class="contenedor"><div class="header">

    <div class="logo">
        <span class="rayo">⚡</span> GAMERS GOLD
    </div>

    <div class="navegacion">

        <a href="reseñas.html" class="volver">
            Reseñas
        </a>

        <span class="separador">|</span>

        <a href="../index.html" class="volver">
            Inicio
        </a>

    </div>

</div>

<div class="card">

    <div class="avatar">👤</div>

    <h1>Mi cuenta</h1>

    <p class="subtitulo">
        Información de tu cuenta Gamers Gold Top-Up
    </p>

    <div class="dato">

        <div class="dato-titulo">
            Nombre de usuario
        </div>

        <div class="dato-valor" id="nombreUsuario">
            Cargando...
        </div>

    </div>

    <div class="dato">

        <div class="dato-titulo">
            Correo electrónico
        </div>

        <div class="dato-valor" id="correoUsuario">
            Cargando...
        </div>

    </div>

    <div class="dato">

        <div class="dato-titulo">
            ID de cuenta
        </div>

        <div class="dato-valor" id="idUsuario">
            Cargando...
        </div>

    </div>

    <div id="panelAdministracion">

        <a href="admin-ventas.html" class="boton boton-admin">
            Panel de ventas
        </a>

    </div>

    <a href="soporte.html" class="boton boton-soporte">
        Soporte
    </a>

    <button id="cerrarSesion" class="boton boton-cerrar">
        Cerrar sesión
    </button>

</div>

</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

async function comprobarAdministrador() {
    const { data, error } =
        await supabaseClient.rpc("is_support_admin");

    if (error) {
        console.error(
            "No se pudo comprobar administrador:",
            error
        );

        return false;
    }

    return data === true;
}

async function cargarCuenta() {
    const { data, error } =
        await supabaseClient.auth.getUser();

    if (error || !data.user) {
        alert("No hay una sesión iniciada.");
        window.location.href = "login.html";
        return;
    }

    const usuario = data.user;

    document.getElementById("correoUsuario").textContent =
        usuario.email || "Sin correo";

    document.getElementById("idUsuario").textContent =
        usuario.id;

    document.getElementById("nombreUsuario").textContent =
        usuario.user_metadata?.username || "Usuario";

    const esAdmin = await comprobarAdministrador();

    if (esAdmin) {
        document.getElementById(
            "panelAdministracion"
        ).style.display = "block";
    }
}

cargarCuenta();

document
    .getElementById("cerrarSesion")
    .addEventListener("click", async function() {
        const { error } =
            await supabaseClient.auth.signOut();

        if (error) {
            alert(
                "No se pudo cerrar la sesión: " +
                error.message
            );

            return;
        }

        window.location.href = "login.html";
    });
</script></body>
</html>
