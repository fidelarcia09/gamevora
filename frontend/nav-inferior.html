<style>
/* ==========================================
   GAMERS GOLD TOP-UP
   NAVEGACIÓN PREMIUM ANIMADA
========================================== */

.gg-bottom-nav,
.gg-bottom-nav * {
    box-sizing: border-box;
}

.gg-bottom-nav {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 99990;

    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 5px;

    padding: 9px 7px;

    background: rgba(5, 13, 29, 0.97);
    border: 1px solid rgba(0, 174, 255, 0.30);
    border-radius: 20px;

    box-shadow:
        0 0 25px rgba(0, 153, 255, 0.10),
        0 10px 35px rgba(0, 0, 0, 0.45);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    font-family: Arial, Helvetica, sans-serif;

    transform: translateY(0);
    opacity: 1;
    visibility: visible;

    transition:
        transform 0.32s ease,
        opacity 0.25s ease,
        visibility 0.32s ease;
}

/* OCULTAR AL BAJAR */

.gg-bottom-nav.gg-nav-hidden {
    transform: translateY(calc(100% + 35px));
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* ELEMENTOS */

.gg-bottom-nav .gg-nav-item {
    position: relative;
    min-width: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;

    padding: 9px 2px;

    color: #8193ad;
    background: transparent;

    border: 1px solid transparent;
    border-radius: 13px;

    text-decoration: none;

    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2px;
    line-height: 1.2;

    transition:
        color 0.22s ease,
        background 0.22s ease,
        border-color 0.22s ease,
        transform 0.22s ease;
}

/* ICONOS SVG */

.gg-bottom-nav .gg-nav-icon {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 23px;
    height: 23px;
    color: currentColor;
}

.gg-bottom-nav .gg-nav-icon svg {
    display: block;

    width: 22px;
    height: 22px;

    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;

    transition:
        transform 0.25s ease,
        filter 0.25s ease;
}

/* BOTÓN ACTIVO */

.gg-bottom-nav .gg-nav-item.gg-active {
    color: #35d5ff;

    background: linear-gradient(
        180deg,
        rgba(0, 174, 255, 0.14),
        rgba(0, 174, 255, 0.045)
    );

    border-color: rgba(0, 174, 255, 0.15);

    text-shadow: 0 0 12px rgba(0, 190, 255, 0.18);
}

/* INDICADOR LUMINOSO */

.gg-bottom-nav .gg-nav-item.gg-active::before {
    content: "";

    position: absolute;
    top: -1px;
    left: 50%;

    width: 23px;
    height: 2px;

    transform: translateX(-50%);

    background: #28d7ff;
    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 190, 255, 0.75);

    animation: gg-indicator-glow 2s ease-in-out infinite;
}

/* ANIMACIÓN DEL ICONO ACTIVO */

.gg-bottom-nav .gg-nav-item.gg-active .gg-nav-icon svg {
    animation: gg-icon-enter 0.35s ease-out both;

    filter: drop-shadow(
        0 0 5px rgba(0, 190, 255, 0.35)
    );
}

/* ANIMACIÓN DEL INDICADOR */

@keyframes gg-indicator-glow {
    0%, 100% {
        box-shadow: 0 0 6px rgba(0, 190, 255, 0.45);
    }

    50% {
        box-shadow: 0 0 13px rgba(0, 190, 255, 0.9);
    }
}

/* ENTRADA SUAVE DEL ICONO */

@keyframes gg-icon-enter {
    from {
        opacity: 0.65;
        transform: translateY(3px) scale(0.94);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* INTERACCIÓN */

.gg-bottom-nav .gg-nav-item:active {
    transform: scale(0.95);
}

@media (hover: hover) {
    .gg-bottom-nav .gg-nav-item:hover {
        color: #35d5ff;
        background-color: rgba(0, 174, 255, 0.07);
    }

    .gg-bottom-nav .gg-nav-item:hover .gg-nav-icon svg {
        transform: translateY(-2px);
    }
}

/* ESPACIO PARA QUE LA BARRA NO TAPE EL CONTENIDO */

body.gg-nav-enabled {
    padding-bottom: calc(105px + env(safe-area-inset-bottom)) !important;
}

/* ORDENADOR */

@media (min-width: 760px) {
    .gg-bottom-nav {
        left: auto;
        right: 24px;
        bottom: 22px;
        width: 370px;
        padding: 10px;
    }

    .gg-bottom-nav .gg-nav-item {
        font-size: 11px;
        padding: 10px 3px;
    }
}

/* ACCESIBILIDAD */

@media (prefers-reduced-motion: reduce) {
    .gg-bottom-nav,
    .gg-bottom-nav .gg-nav-item,
    .gg-bottom-nav .gg-nav-icon svg {
        transition: none !important;
        animation: none !important;
    }
}
</style><script>
(function () {
    "use strict";

    if (document.querySelector(".gg-bottom-nav")) {
        return;
    }

    const currentPath = window.location.pathname;

    const inFrontend = /\/frontend\//i.test(currentPath);
    const isAccountPage = /\/cuenta\.html$/i.test(currentPath);
    const isOrdersPage = /\/pedidos\.html$/i.test(currentPath);
    const isWalletPage = /\/wallet\.html$/i.test(currentPath);

    let activeSection = "inicio";

    if (isOrdersPage) {
        activeSection = "pedidos";
    } else if (isWalletPage) {
        activeSection = "wallet";
    } else if (isAccountPage) {
        activeSection = "perfil";
    }

    const homeHref = inFrontend ? "../index.html" : "index.html";
    const pagePrefix = inFrontend ? "" : "frontend/";

    const icons = {
        inicio: `
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3.5 10.5 12 3.8l8.5 6.7"/>
                <path d="M5.5 9.5v10h13v-10"/>
                <path d="M9.5 19.5v-6h5v6"/>
            </svg>
        `,

        pedidos: `
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="5" y="4.5" width="14" height="16" rx="2"/>
                <path d="M9 4.5v-1h6v1"/>
                <path d="M8.5 10h7"/>
                <path d="M8.5 14h7"/>
                <path d="M8.5 17.5h4.5"/>
            </svg>
        `,

        wallet: `
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="5.5" width="18" height="14" rx="2.5"/>
                <path d="M3 9h18"/>
                <path d="M15 14h3"/>
                <path d="M6 5.5V4.5a2 2 0 0 1 2-2h10"/>
            </svg>
        `,

        perfil: `
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.5"/>
                <path d="M5 20a7 7 0 0 1 14 0"/>
            </svg>
        `
    };

    const items = [
        {
            id: "inicio",
            label: "Inicio",
            href: homeHref
        },
        {
            id: "pedidos",
            label: "Pedidos",
            href: pagePrefix + "pedidos.html"
        },
        {
            id: "wallet",
            label: "Wallet",
            href: pagePrefix + "wallet.html"
        },
        {
            id: "perfil",
            label: "Perfil",
            href: pagePrefix + "cuenta.html"
        }
    ];

    const nav = document.createElement("nav");

    nav.className = "gg-bottom-nav";
    nav.setAttribute("aria-label", "Navegación principal");

    items.forEach(function (item) {
        const link = document.createElement("a");

        link.className = "gg-nav-item";
        link.href = item.href;

        if (item.id === activeSection) {
            link.classList.add("gg-active");
            link.setAttribute("aria-current", "page");
        }

        const icon = document.createElement("span");
        icon.className = "gg-nav-icon";
        icon.innerHTML = icons[item.id];

        const label = document.createElement("span");
        label.textContent = item.label;

        link.appendChild(icon);
        link.appendChild(label);
        nav.appendChild(link);
    });

    function insertNavigation() {
        if (!document.body || document.querySelector(".gg-bottom-nav")) {
            return;
        }

        document.body.appendChild(nav);
        document.body.classList.add("gg-nav-enabled");

        nav.classList.remove("gg-nav-hidden");

        let lastScrollY = Math.max(
            0,
            window.scrollY || window.pageYOffset || 0
        );

        let ticking = false;
        const threshold = 8;
        const topLimit = 60;

        function handleScroll() {
            const currentY = Math.max(
                0,
                window.scrollY || window.pageYOffset || 0
            );

            const difference = currentY - lastScrollY;

            if (currentY <= topLimit) {
                nav.classList.remove("gg-nav-hidden");
            } else if (difference > threshold) {
                nav.classList.add("gg-nav-hidden");
            } else if (difference < -threshold) {
                nav.classList.remove("gg-nav-hidden");
            }

            lastScrollY = currentY;
            ticking = false;
        }

        window.addEventListener("scroll", function () {
            if (!ticking) {
                window.requestAnimationFrame(handleScroll);
                ticking = true;
            }
        }, { passive: true });
    }

    if (document.readyState === "loading") {
        document.addEventListener(
            "DOMContentLoaded",
            insertNavigation,
            { once: true }
        );
    } else {
        insertNavigation();
    }
})();
</script>
