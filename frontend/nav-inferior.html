<style>
/* ==========================================
   GAMERS GOLD TOP-UP
   NAVEGACIÓN PREMIUM ANIMADA
========================================== */

.gg-bottom-nav,
.gg-bottom-nav * {

}

.gg-bottom-nav {

    left: 12px;
    right: 12px;
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 99990;

    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 5px;

    padding: 9px 7px;

    background: rgba(5, 13, 29, 0.97);
    border: 1px solid rgba(0, 174, 255, 0.30);
    border-radius: 20px;

    box-shadow:
        0 0 25px rgba(0, 153, 255, 0.10),
        0 10px 35px rgba(0, 0, 0, 0.45);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    font-family: Arial, Helvetica, sans-serif;

    transform: translateY(0);
    opacity: 1;
    visibility: visible;

    transition:
        transform 0.32s ease,
        opacity 0.25s ease,
        visibility 0.32s ease;
}

/* MANTENER LOS CINCO ACCESOS EN UNA SOLA HILERA PARA REVENDEDORES */
.gg-bottom-nav.gg-has-reseller {
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 2px;
    padding-left: 5px;
    padding-right: 5px;
}

.gg-bottom-nav.gg-has-reseller .gg-nav-item {
    padding-left: 1px;
    padding-right: 1px;
    font-size: 9px;
    letter-spacing: 0;
}

/* OCULTAR AL BAJAR */

.gg-bottom-nav.gg-nav-hidden {
    transform: translateY(calc(100% + 35px));
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

/* ELEMENTOS */

.gg-bottom-nav .gg-nav-item {
    position: relative;
    min-width: 0;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;

    padding: 9px 2px;

    color: #8193ad;
    background: transparent;

    border: 1px solid transparent;
    border-radius: 13px;

    text-decoration: none;

    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2px;
    line-height: 1.2;

    transition:
        color 0.22s ease,
        background 0.22s ease,
        border-color 0.22s ease,
        transform 0.22s ease;
}

/* ICONOS SVG */

.gg-bottom-nav .gg-nav-icon {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 23px;
    height: 23px;
    color: currentColor;
}

.gg-bottom-nav .gg-nav-icon svg {
    display: block;

    width: 22px;
    height: 22px;

    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;

        transform 0.25s ease,
        filter 0.25s ease;
}

.gg-bottom-nav .gg-nav-avatar {
    display: block;
    width: 25px;
    height: 25px;
    border-radius: 50%;

    border: 1.5px solid rgba(53, 213, 255, 0.8);
    box-shadow: 0 0 8px rgba(0, 174, 255, 0.25);
    flex-shrink: 0;
}
   
.gg-bottom-nav .gg-nav-icon.gg-nav-avatar-preset {
    width: 27px;
    height: 27px;

    border: 1.5px solid rgba(53, 213, 255, .8);

    box-shadow: 0 0 8px rgba(0, 174, 255, .25);
}
.gg-bottom-nav .gg-nav-icon.gg-nav-avatar-preset svg {
    display: block;
    width: 100%;
    height: 100%;
}

/* BOTÓN ACTIVO */

.gg-bottom-nav .gg-nav-item.gg-active {
    color: #35d5ff;

    background: linear-gradient(
        180deg,
        rgba(0, 174, 255, 0.14),
        rgba(0, 174, 255, 0.045)
    );

    border-color: rgba(0, 174, 255, 0.15);

    text-shadow: 0 0 12px rgba(0, 190, 255, 0.18);
}

/* INDICADOR LUMINOSO */

.gg-bottom-nav .gg-nav-item.gg-active::before {
    content: "";

    position: absolute;
    top: -1px;
    left: 50%;

    width: 23px;
    height: 2px;

    transform: translateX(-50%);

    background: #28d7ff;
    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0, 190, 255, 0.75);

/* ANIMACIÓN DEL ICONO ACTIVO */

.gg-bottom-nav .gg-nav-item.gg-active .gg-nav-icon svg {

/* ANIMACIÓN DEL INDICADOR */

@keyframes gg-indicator-glow {

        box-shadow: 0 0 13px rgba(0, 190, 255, 0.9);
    }
}

/* ENTRADA SUAVE DEL ICONO */

@keyframes gg-icon-enter {
    from {
        opacity: 0.65;
        transform: translateY(3px) scale(0.94);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

/* INTERACCIÓN */

.gg-bottom-nav .gg-nav-item:active {

@media (hover: hover) {
    .gg-bottom-nav .gg-nav-item:hover {

body.gg-nav-enabled {

/* ACCESIBILIDAD */

@media (prefers-reduced-motion: reduce) {
    .gg-bottom-nav,
    .gg-bottom-nav .gg-nav-item,

    function insertNavigation() {
        if (!document.body || document.querySelector(".gg-bottom-nav")) {
            return;
        }

        document.body.appendChild(nav);
        document.body.classList.add("gg-nav-enabled");

        nav.classList.remove("gg-nav-hidden");
        agregarNavegacionRevender().catch(function (error) {
            console.error("No se pudo verificar el acceso de Revender:", error);
        });

        let lastScrollY = Math.max(
            0,
            window.scrollY || window.pageYOffset || 0
        );

        let ticking = false;
        const threshold = 8;
        const topLimit = 60;

        function handleScroll() {
            const currentY = Math.max(
                0,
                window.scrollY || window.pageYOffset || 0
            );

            const difference = currentY - lastScrollY;

            if (currentY <= topLimit) {
                nav.classList.remove("gg-nav-hidden");
            } else if (difference > threshold) {
                nav.classList.add("gg-nav-hidden");
            } else if (difference < -threshold) {
                nav.classList.remove("gg-nav-hidden");
            }

            lastScrollY = currentY;
            ticking = false;
        }

        window.addEventListener("scroll", function () {
            if (!ticking) {
                window.requestAnimationFrame(handleScroll);
                ticking = true;
            }
        }, { passive: true });
    }
