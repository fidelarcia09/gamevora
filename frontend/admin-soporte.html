<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración | Gamevora</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 700px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 10px;
        }

        .logo {
            font-size: 23px;
            font-weight: 900;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .navegacion {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .volver {
            color: #28a9ff;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
        }

        .separador {
            color: #31506f;
        }

        .titulo {
            margin-bottom: 18px;
        }

        .titulo h1 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .titulo p {
            color: #8195ad;
            font-size: 13px;
        }

        .ticket {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 17px;
            padding: 18px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: .2s;
        }

        .ticket:hover {
            border-color: #159dff;
            box-shadow: 0 0 18px rgba(0, 140, 255, .12);
        }

        .ticket-asunto {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .ticket-info {
            color: #8195ad;
            font-size: 12px;
            line-height: 1.6;
        }

        .estado {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
        }

        .estado-open {
            background: #0c3155;
            color: #5dc8ff;
            border: 1px solid #17649a;
        }

        .estado-human {
            background: #382b08;
            color: #ffd45c;
            border: 1px solid #876d19;
        }

        .estado-resolved {
            background: #123820;
            color: #68df8c;
            border: 1px solid #247342;
        }

        .cargando,
        .vacio,
        .error {
            text-align: center;
            padding: 30px 10px;
            color: #7189a3;
            font-size: 13px;
        }

        .error {
            color: #ff6578;
        }

        .contador {
            color: #28a9ff;
            font-weight: bold;
        }

        @media (max-width: 450px) {

            body {
                padding: 14px;
            }

            .logo {
                font-size: 20px;
            }

            .volver {
                font-size: 12px;
            }
        }

        .boton-resolver {
    width: 100%;
    margin-top: 12px;
    padding: 11px;
    border: 1px solid #247342;
    border-radius: 10px;
    background: #123820;
    color: #68df8c;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.boton-resolver:hover {
    background: #18502d;
}

.ticket-resuelto {
    margin-top: 12px;
    color: #68df8c;
    font-size: 12px;
    font-weight: bold;
}
    </style>
</head>

<body>

<div class="contenedor">

    <div class="header">

        <div class="logo">
            <span class="rayo">⚡</span> GAMEVORA
        </div>

        <div class="navegacion">

            <a href="soporte.html" class="volver">
                Soporte
            </a>

            <span class="separador">|</span>

            <a href="cuenta.html" class="volver">
                Mi Cuenta
            </a>

        </div>

    </div>

    <div class="titulo">

        <h1>⚙️ Administración</h1>

        <p>
            Panel de soporte de Gamevora
        </p>

    </div>

    <div id="contenido">

        <div class="cargando">
            Comprobando acceso...
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const contenido =
document.getElementById("contenido");


/* =========================
   INICIAR
========================= */

async function iniciar() {

    const { data, error } =
        await supabaseClient.auth.getUser();

    if (error || !data.user) {

        window.location.href = "login.html";

        return;
    }

    const { data: esAdmin, error: adminError } =
        await supabaseClient.rpc(
            "is_support_admin"
        );

    if (adminError) {

        console.error(adminError);

        contenido.innerHTML = `
            <div class="error">
                No se pudo comprobar el acceso.
            </div>
        `;

        return;
    }

    if (!esAdmin) {

        contenido.innerHTML = `
            <div class="error">
                No tienes permiso para acceder
                a esta sección.
            </div>
        `;

        return;
    }

    await cargarTickets();

}


/* =========================
   CARGAR TODOS LOS TICKETS
========================= */

async function cargarTickets() {

    const { data: tickets, error } =
        await supabaseClient
            .from("support_tickets")
            .select(`
                id,
                user_id,
                category,
                subject,
                status,
                created_at,
                updated_at
            `)
            .order("updated_at", {
                ascending: false
            });

    if (error) {

        console.error(error);

        contenido.innerHTML = `
            <div class="error">
                No se pudieron cargar los tickets.
            </div>
        `;

        return;
    }

    mostrarTickets(tickets || []);

}


/* =========================
   MOSTRAR TICKETS
========================= */

function mostrarTickets(tickets) {

    if (tickets.length === 0) {

        contenido.innerHTML = `
            <div class="vacio">
                No hay tickets de soporte todavía.
            </div>
        `;

        return;
    }

    let html = `

        <p style="
            color:#8195ad;
            font-size:13px;
            margin-bottom:15px;
        ">
            Tickets registrados:
            <span class="contador">
                ${tickets.length}
            </span>
        </p>

    `;

    tickets.forEach(ticket => {

        let estadoTexto = "Abierto";
        let estadoClase = "estado-open";

        if (ticket.status === "human") {
            estadoTexto = "Atención humana";
            estadoClase = "estado-human";
        }

        if (ticket.status === "resolved") {
            estadoTexto = "Resuelto";
            estadoClase = "estado-resolved";
        }

        const fecha =
            new Date(ticket.updated_at)
                .toLocaleString("es-ES");

        html += `

    <div
        class="ticket"
        data-id="${ticket.id}"
    >

        <div class="ticket-asunto">
            ${escapeHTML(ticket.subject)}
        </div>

        <div class="ticket-info">
            Usuario:
            ${escapeHTML(ticket.user_id)}
            <br>

            Categoría:
            ${escapeHTML(ticket.category)}
            <br>

            Última actividad:
            ${fecha}
        </div>

        <span class="estado ${estadoClase}">
            ${estadoTexto}
        </span>

        ${
            ticket.status !== "resolved"
            ? `
                <button
                    class="boton-resolver"
                    data-id="${ticket.id}"
                    type="button"
                >
                    ✅ Resolver ticket
                </button>
            `
            : `
                <div class="ticket-resuelto">
                    ✅ Ticket resuelto
                </div>
            `
        }

    </div>

`;

    });

    contenido.innerHTML = html;

    document
        .querySelectorAll(".ticket")
        .forEach(elemento => {

            elemento.addEventListener(
                "click",
                function() {

                    const id =
                        this.dataset.id;

                    window.location.href =
                        "ticket.html?id=" + id;

                }
            );

        });

document
    .querySelectorAll(".boton-resolver")
    .forEach(boton => {

        boton.addEventListener(
            "click",
            async function(event) {

                event.stopPropagation();

                const ticketId =
                    this.dataset.id;

                const confirmar =
                    confirm(
                        "¿Quieres marcar este ticket como resuelto?"
                    );

                if (!confirmar) {
                    return;
                }

                this.disabled = true;
                this.textContent =
                    "Resolviendo...";

                const { error } =
                    await supabaseClient
                        .from("support_tickets")
                        .update({
                            status: "resolved",
                            closed_at: new Date().toISOString(),
                            updated_at: new Date().toISOString()
                        })
                        .eq("id", ticketId);

                if (error) {

                    console.error(error);

                    alert(
                        "No se pudo resolver el ticket:\n\n" +
                        error.message
                    );

                    this.disabled = false;
                    this.textContent =
                        "✅ Resolver ticket";

                    return;
                }

                await cargarTickets();

            }
        );

    });
    
}


/* =========================
   SEGURIDAD HTML
========================= */

function escapeHTML(texto) {

    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   ARRANCAR
========================= */

iniciar();

</script>

</body>
              </html>
