<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b18"><title>Wallet | Gamers Gold Top-Up</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #050b18;
        color: #fff;
        min-height: 100vh;
        padding: 20px;
    }

    button, a {
        -webkit-tap-highlight-color: transparent;
    }

    .contenedor {
        max-width: 520px;
        margin: auto;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
    }

    .logo {
        font-size: 21px;
        font-weight: 900;
        letter-spacing: .3px;
    }

    .rayo {
        color: #00b7ff;
        text-shadow: 0 0 12px #008cff;
    }

    .volver {
        color: #28a9ff;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
    }

    .card {
        background: linear-gradient(160deg, #0a1b35, #071329);
        border: 1px solid #173b64;
        border-radius: 20px;
        padding: 23px 19px;
        box-shadow: 0 12px 35px rgba(0, 0, 0, .2);
        min-width: 0;
    }

    h1 {
        font-size: 25px;
        text-align: center;
        margin-bottom: 8px;
    }

    .subtitulo {
        text-align: center;
        color: #91a5bf;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 24px;
    }

    .saldo {
        margin-bottom: 17px;
        padding: 24px 15px;
        border-radius: 16px;
        text-align: center;
        background:
            radial-gradient(circle at top right, rgba(0, 183, 255, .15), transparent 55%),
            linear-gradient(135deg, #08244a, #063467);
        border: 1px solid #168cff;
        box-shadow: 0 0 24px rgba(0, 140, 255, .12);
    }

    .saldo-titulo {
        color: #a4d6ff;
        font-size: 13px;
        margin-bottom: 10px;
    }

    .saldo-valor {
        font-size: clamp(25px, 7vw, 32px);
        font-weight: 900;
        color: #fff;
        overflow-wrap: anywhere;
    }

    .boton {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        min-height: 49px;
        padding: 13px 16px;
        margin-top: 12px;
        border-radius: 12px;
        text-align: center;
        text-decoration: none;
        background: linear-gradient(100deg, #087cff, #00baff);
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        border: 1px solid rgba(120, 210, 255, .3);
        box-shadow: 0 5px 18px rgba(0, 140, 255, .16);
        transition: transform .2s, filter .2s;
    }

    .boton:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
    }

    .boton svg {
        width: 21px;
        height: 21px;
        flex-shrink: 0;
    }

    .movimientos {
        margin-top: 28px;
        min-width: 0;
    }

    .movimientos-cabecera {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 15px;
    }

    .movimientos-cabecera h2 {
        font-size: 17px;
        font-weight: 800;
    }

    .etiqueta {
        color: #83cfff;
        background: rgba(0, 153, 255, .1);
        border: 1px solid rgba(0, 153, 255, .22);
        padding: 5px 9px;
        border-radius: 20px;
        font-size: 11px;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .lista-movimientos {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
    }

    .movimiento {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px;
        background: #09182d;
        border: 1px solid #17314f;
        border-radius: 13px;
        min-width: 0;
        width: 100%;
        overflow: hidden;
    }

    .movimiento-icono {
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        border-radius: 12px;
        background: rgba(0, 160, 255, .12);
        color: #47c5ff;
    }

    .movimiento-icono svg {
        width: 21px;
        height: 21px;
    }

    .movimiento-info {
        flex: 1;
        min-width: 0;
        overflow: hidden;
    }

    .movimiento-titulo {
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 5px;
        overflow-wrap: anywhere;
    }

    .movimiento-fecha {
        color: #8094ae;
        font-size: 11px;
        line-height: 1.5;
        overflow-wrap: anywhere;
    }

    .movimiento-monto {
        text-align: right;
        font-size: 13px;
        font-weight: 800;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .positivo {
        color: #39dda0;
    }

    .negativo {
        color: #ff8585;
    }

    .vacio,
    .cargando-movimientos {
        text-align: center;
        color: #8195ad;
        font-size: 13px;
        line-height: 1.6;
        padding: 24px 14px;
        background: #09182d;
        border: 1px solid #17314f;
        border-radius: 13px;
    }

    .estado {
        text-align: center;
        color: #8195ad;
        font-size: 12px;
        line-height: 1.5;
        margin-top: 16px;
    }

    .estado.error {
        color: #ff9999;
    }

    .pie {
        text-align: center;
        color: #536984;
        font-size: 11px;
        margin-top: 23px;
    }

    @media (max-width: 400px) {
        body {
            padding: 15px;
        }

        .header {
            align-items: flex-start;
        }

        .logo {
            font-size: 18px;
        }

        .card {
            padding: 20px 14px;
        }

        .movimientos-cabecera h2 {
            font-size: 15px;
        }

        .movimiento {
            gap: 9px;
            padding: 11px 9px;
        }

        .movimiento-icono {
            width: 36px;
            height: 36px;
        }

        .movimiento-monto {
            font-size: 12px;
        }
    }
</style>

</head><body>
    <div class="contenedor">    <header class="header">
        <div class="logo">
            <span class="rayo">G</span> GAMERS GOLD
        </div>

        <a href="../index.html" class="volver">Inicio</a>
    </header>

    <main class="card">

        <h1>Mi Wallet</h1>

        <p class="subtitulo">
            Consulta tu saldo y administra tus GVR.
        </p>

        <section class="saldo" aria-label="Saldo disponible">
            <div class="saldo-titulo">Saldo disponible</div>

            <div class="saldo-valor" id="saldoGVR" aria-live="polite">
                Cargando...
            </div>
        </section>

        <a href="recargar-gvr.html" class="boton">
            <svg viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 8v8"></path>
                <path d="M8 12h8"></path>
            </svg>

            Añadir GVR
        </a>

        <section class="movimientos">

            <div class="movimientos-cabecera">
                <h2>Historial de movimientos</h2>
                <span class="etiqueta">Últimos 2</span>
            </div>

            <div id="listaMovimientos"
                class="lista-movimientos"
                aria-live="polite">

                <div class="cargando-movimientos">
                    Cargando movimientos...
                </div>

            </div>

        </section>

        <p class="estado" id="estadoWallet" role="status"></p>

    </main>

    <footer class="pie">
        Gamers Gold Top-Up · Wallet GVR
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://gsuhzcavghsiolmipnzi.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    const iconoMovimiento = `
        <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="M12 3v18"></path>
            <path d="M17 7.5C17 5.6 14.8 4.5 12 4.5S7 5.6 7 7.5
                9 10.5 12 10.5s5 1.1 5 3-2.2 4-5 4-5-1.1-5-3"></path>
        </svg>
    `;

    function formatoCantidad(cantidad) {
        const numero = Number(cantidad);

        if (!Number.isFinite(numero)) {
            return "0";
        }

        return numero.toLocaleString("es-ES", {
            maximumFractionDigits: 2
        });
    }

    function formatoFecha(fecha) {
        const fechaObjeto = new Date(fecha);

        if (Number.isNaN(fechaObjeto.getTime())) {
            return "Fecha no disponible";
        }

        return fechaObjeto.toLocaleString("es-ES", {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function nombreMovimiento(movimiento) {
        const tipo = String(movimiento.type || "").toLowerCase();

        if (
            tipo.includes("refund") ||
            tipo.includes("reembolso")
        ) {
            return "Reembolso";
        }

        if (
            tipo.includes("purchase") ||
            tipo.includes("compra") ||
            tipo.includes("debit")
        ) {
            return "Compra";
        }

        if (
            tipo.includes("topup") ||
            tipo.includes("top_up") ||
            tipo.includes("deposit") ||
            tipo.includes("recarga")
        ) {
            return "Recarga de saldo";
        }

        if (
            tipo.includes("credit") ||
            tipo.includes("add")
        ) {
            return "Saldo añadido";
        }

        return movimiento.type
            ? String(movimiento.type).replace(/[_-]/g, " ")
            : "Movimiento de wallet";
    }

    function esEntrada(movimiento) {
        const tipo = String(movimiento.type || "").toLowerCase();

        if (
            tipo.includes("refund") ||
            tipo.includes("reembolso") ||
            tipo.includes("deposit") ||
            tipo.includes("topup") ||
            tipo.includes("top_up") ||
            tipo.includes("recarga") ||
            tipo.includes("credit") ||
            tipo.includes("add")
        ) {
            return true;
        }

        if (
            tipo.includes("purchase") ||
            tipo.includes("compra") ||
            tipo.includes("debit") ||
            tipo.includes("withdraw")
        ) {
            return false;
        }

        const antes = Number(movimiento.balance_before);
        const despues = Number(movimiento.balance_after);

        if (
            Number.isFinite(antes) &&
            Number.isFinite(despues) &&
            antes !== despues
        ) {
            return despues > antes;
        }

        return Number(movimiento.amount) >= 0;
    }

    function renderizarMovimiento(movimiento) {
        const entrada = esEntrada(movimiento);
        const cantidad = Math.abs(Number(movimiento.amount) || 0);

        const elemento = document.createElement("article");
        elemento.className = "movimiento";

        const icono = document.createElement("div");
        icono.className = "movimiento-icono";
        icono.innerHTML = iconoMovimiento;

        const info = document.createElement("div");
        info.className = "movimiento-info";

        const titulo = document.createElement("div");
        titulo.className = "movimiento-titulo";
        titulo.textContent = nombreMovimiento(movimiento);

        const fecha = document.createElement("div");
        fecha.className = "movimiento-fecha";
        fecha.textContent = formatoFecha(movimiento.created_at);

        info.append(titulo, fecha);

        const monto = document.createElement("div");
        monto.className = "movimiento-monto " +
            (entrada ? "positivo" : "negativo");

        monto.textContent =
            `${entrada ? "+" : "−"}${formatoCantidad(cantidad)} GVR`;

        elemento.append(icono, info, monto);

        return elemento;
    }

    async function cargarWallet() {
        const saldoElemento =
            document.getElementById("saldoGVR");

        const estadoElemento =
            document.getElementById("estadoWallet");

        const listaElemento =
            document.getElementById("listaMovimientos");

        const { data, error } =
            await supabaseClient.auth.getUser();

        if (error || !data.user) {
            window.location.href = "login.html";
            return;
        }

        const usuario = data.user;

        const { data: wallet, error: walletError } =
            await supabaseClient
                .from("wallets")
                .select("balance")
                .eq("user_id", usuario.id)
                .maybeSingle();

        if (walletError) {
            console.error(
                "Error cargando wallet:",
                walletError
            );

            saldoElemento.textContent = "No disponible";

            estadoElemento.textContent =
                "No se pudo consultar el saldo. Inténtalo nuevamente.";

            estadoElemento.className = "estado error";

        } else if (!wallet) {
            saldoElemento.textContent = "0 GVR";

            estadoElemento.textContent =
                "No se encontró una wallet para esta cuenta.";

            estadoElemento.className = "estado error";

        } else {
            const saldo = Number(wallet.balance);

            if (Number.isFinite(saldo)) {
                saldoElemento.textContent =
                    `${formatoCantidad(saldo)} GVR`;
            } else {
                saldoElemento.textContent = "No disponible";

                estadoElemento.textContent =
                    "No se pudo interpretar el saldo de la wallet.";

                estadoElemento.className = "estado error";
            }
        }

        const { data: movimientos, error: movimientosError } =
            await supabaseClient
                .from("transactions")
                .select(
                    "id, type, amount, balance_before, balance_after, created_at"
                )
                .eq("user_id", usuario.id)
                .order("created_at", { ascending: false })
                .limit(2);

        listaElemento.replaceChildren();

        if (movimientosError) {
            console.error(
                "Error cargando movimientos:",
                movimientosError
            );

            const mensaje = document.createElement("div");
            mensaje.className = "vacio";
            mensaje.textContent =
                "No se pudo cargar el historial. Inténtalo nuevamente.";

            listaElemento.appendChild(mensaje);
            return;
        }

        if (!movimientos || movimientos.length === 0) {
            const mensaje = document.createElement("div");
            mensaje.className = "vacio";
            mensaje.textContent =
                "Todavía no tienes movimientos registrados.";

            listaElemento.appendChild(mensaje);
            return;
        }

        const fragmento = document.createDocumentFragment();

        movimientos.forEach(movimiento => {
            fragmento.appendChild(
                renderizarMovimiento(movimiento)
            );
        });

        listaElemento.appendChild(fragmento);
    }

    cargarWallet().catch(error => {
        console.error(
            "Error inesperado cargando wallet:",
            error
        );

        document.getElementById("estadoWallet").textContent =
            "Ocurrió un error al cargar la wallet. Recarga la página.";

        document.getElementById("estadoWallet").className =
            "estado error";

        const lista =
            document.getElementById("listaMovimientos");

        lista.replaceChildren();

        const mensaje = document.createElement("div");
        mensaje.className = "vacio";
        mensaje.textContent =
            "No se pudo cargar el historial.";

        lista.appendChild(mensaje);
    });
</script>

</body>
</html>
