<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar GVR - Gamevora</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #020b1c;
            color: white;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #00aaff;
        }

        .volver {
            color: #00aaff;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            padding: 20px;
        }

        .card {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px 20px;
            background: #081b38;
            border: 1px solid #126dcc;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 140, 255, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .dato {
            background: #041329;
            border: 1px solid #164b82;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .titulo {
            color: #8fa3bd;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .valor {
            font-size: 22px;
            font-weight: bold;
        }

        .boton {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .nota {
            text-align: center;
            color: #71859f;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        ⚡ GAME<span>VORA</span>
    </div>

    <a href="recargar-gvr.html" class="volver">
        ← Volver
    </a>

</header>

<main>

    <div class="card">

        <h1>Confirmar recarga</h1>

        <div class="dato">

            <div class="titulo">
                Cantidad de GVR
            </div>

            <div class="valor" id="mostrarCantidad">
                Cargando...
            </div>

        </div>

        <div class="dato">

            <div class="titulo">
                Método de pago
            </div>

            <div class="valor" id="mostrarMetodo">
                Cargando...
            </div>

        </div>

        <div class="dato">

            <div class="titulo">
                Estado
            </div>

            <div class="valor">
                Pendiente de pago
            </div>

        </div>

        <button
            class="boton"
            id="botonContinuar"
            type="button"
            onclick="continuarPago()"
        >
            Continuar ⚡
        </button>

        <div class="nota">
            El pago real se conectará posteriormente.
        </div>

    </div>

</main>

<script>

// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


// ==========================================
// PARÁMETROS
// ==========================================

const parametros =
    new URLSearchParams(
        window.location.search
    );

const cantidad =
    parametros.get("cantidad");

const metodo =
    parametros.get("metodo");


// ==========================================
// ELEMENTOS
// ==========================================

const mostrarCantidad =
    document.getElementById(
        "mostrarCantidad"
    );

const mostrarMetodo =
    document.getElementById(
        "mostrarMetodo"
    );

const botonContinuar =
    document.getElementById(
        "botonContinuar"
    );


// ==========================================
// MOSTRAR DATOS
// ==========================================

if (cantidad) {

    mostrarCantidad.textContent =
        "⚡ " + cantidad + " GVR";

} else {

    mostrarCantidad.textContent =
        "No especificada";

}


if (metodo) {

    mostrarMetodo.textContent =
        "💵 " + metodo;

} else {

    mostrarMetodo.textContent =
        "No especificado";

}


// ==========================================
// CONTINUAR PAGO
// ==========================================

async function continuarPago() {

    if (!cantidad || !metodo) {

        alert(
            "Faltan datos de la compra."
        );

        return;
    }


    const cantidadNumerica =
        Number(
            cantidad.replace(/,/g, "")
        );


    if (
        isNaN(cantidadNumerica) ||
        cantidadNumerica <= 0
    ) {

        alert(
            "La cantidad de GVR no es válida."
        );

        return;
    }


    botonContinuar.disabled = true;

    botonContinuar.textContent =
        "Comprobando sesión...";


    // ======================================
    // COMPROBAR SESIÓN GUARDADA
    // ======================================

    const {
        data: sessionData,
        error: sessionError
    } =
        await supabaseClient.auth.getSession();


    console.log(
        "Sesión encontrada:",
        sessionData?.session
    );


    if (
        sessionError ||
        !sessionData?.session
    ) {

        botonContinuar.disabled = false;

        botonContinuar.textContent =
            "Continuar ⚡";

        console.error(
            "Error de sesión:",
            sessionError
        );

        alert(
            "Gamevora no pudo detectar tu sesión.\n\n" +
            "Aunque aparezcas conectado en tu cuenta, " +
            "esta página no está recibiendo la sesión de Supabase."
        );

        return;
    }


    // ======================================
    // OBTENER USUARIO
    // ======================================

    botonContinuar.textContent =
        "Verificando usuario...";


    const {
        data: userData,
        error: userError
    } =
        await supabaseClient.auth.getUser();


    const user =
        userData?.user;


    console.log(
        "Usuario detectado:",
        user
    );


    if (
        userError ||
        !user
    ) {

        botonContinuar.disabled = false;

        botonContinuar.textContent =
            "Continuar ⚡";

        console.error(
            "Error obteniendo usuario:",
            userError
        );

        alert(
            "No se pudo verificar tu usuario en Gamevora."
        );

        return;
    }


    // ======================================
    // REGISTRAR VENTA
    // ======================================

    botonContinuar.textContent =
        "Registrando compra...";


    const {
        error: ventaError
    } =
        await supabaseClient
            .from("ventas")
            .insert({

                tipo:
                    "gvr",

                usuario_id:
                    user.id,

                nombre_usuario:
                    user.user_metadata?.username ||
                    user.user_metadata?.nombre ||
                    user.email?.split("@")[0] ||
                    "Usuario",

                correo_usuario:
                    user.email,

                gvr_comprado:
                    cantidadNumerica,

                precio:
                    null,

                moneda:
                    "USD",

                metodo_pago:
                    metodo,

                estado:
                    "pendiente"

            });


    // ======================================
    // ERROR DE VENTA
    // ======================================

    if (ventaError) {

        console.error(
            "Error registrando venta:",
            ventaError
        );

        botonContinuar.disabled = false;

        botonContinuar.textContent =
            "Continuar ⚡";

        alert(
            "No se pudo registrar la compra.\n\n" +
            ventaError.message
        );

        return;
    }


    // ======================================
    // MODO DE PRUEBA
    // ======================================

    const saldoActual =
        Number(
            localStorage.getItem(
                "gamevora_gvr"
            ) || "0"
        );


    const nuevoSaldo =
        saldoActual +
        cantidadNumerica;


    localStorage.setItem(
        "gamevora_gvr",
        nuevoSaldo
    );


    // ======================================
    // CONFIRMACIÓN
    // ======================================

    alert(
        "Compra registrada correctamente.\n\n" +
        "⚡ " +
        cantidadNumerica +
        " GVR\n\n" +
        "Estado: Pendiente"
    );


    window.location.href =
        "cuenta.html";

}

</script>

</body>
</html>
