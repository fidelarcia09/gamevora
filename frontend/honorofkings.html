<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b18">
    <meta name="description" content="Consulta los paquetes de Tokens de Honor of Kings en Gamers Gold Top-Up.">

    <title>Honor of Kings | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        :root {
            --fondo: #050b18;
            --tarjeta: #091a35;
            --borde: #15518c;
            --azul: #008cff;
            --cian: #00baff;
            --texto: #ffffff;
            --texto-secundario: #8fa5bd;
        }

        body {
            background: var(--fondo);
            color: var(--texto);
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 18px;
            border-bottom: 1px solid #12385f;
        }

        .logo {
            font-size: 19px;
            font-weight: 900;
            line-height: 1.3;
        }

        .logo .rayo {
            color: var(--cian);
            text-shadow: 0 0 12px var(--azul);
        }

        .inicio {
            flex-shrink: 0;
            text-decoration: none;
            color: white;
            border: 1px solid #168cff;
            padding: 9px 12px;
            border-radius: 9px;
            font-size: 13px;
        }

        .inicio:hover {
            background: #0b2c50;
        }

        .tarjeta {
            background: var(--tarjeta);
            border: 1px solid var(--borde);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.12);
        }

        .icono {
            text-align: center;
            font-size: 54px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: var(--texto-secundario);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b8c9dc;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        .titulo-paquetes {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .texto-paquetes {
            color: var(--texto-secundario);
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .estado {
            padding: 12px;
            margin-bottom: 16px;
            background: #061226;
            border: 1px solid #173b60;
            border-radius: 10px;
            color: var(--texto-secundario);
            font-size: 12px;
            line-height: 1.5;
        }

        .estado.error {
            border-color: #813b4b;
            color: #ffb8c3;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .producto {
            min-width: 0;
            padding: 16px 10px;
            background: #061226;
            border: 1px solid #204c78;
            border-radius: 13px;
            text-align: center;
            cursor: pointer;
            transition:
                border-color 0.2s,
                background 0.2s,
                transform 0.2s,
                box-shadow 0.2s;
        }

        .producto:hover {
            border-color: var(--azul);
            background: #0a2040;
            transform: translateY(-2px);
        }

        .producto.seleccionado {
            border: 2px solid var(--cian);
            background: #0a2b50;
            box-shadow: 0 0 15px rgba(0, 186, 255, 0.18);
        }

        .producto-nombre {
            color: white;
            font-size: 15px;
            font-weight: bold;
            line-height: 1.4;
            overflow-wrap: anywhere;
            margin-bottom: 9px;
        }

        .producto-estado {
            color: var(--cian);
            font-size: 11px;
        }

        .mensaje-vacio {
            grid-column: 1 / -1;
            padding: 20px 12px;
            border: 1px dashed #204c78;
            border-radius: 12px;
            text-align: center;
            color: var(--texto-secundario);
            font-size: 13px;
            line-height: 1.6;
        }

        .recargar {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .recargar:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .separador-ofertas {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #12385f;
        }

        .boton-ofertas {
            width: 100%;
            padding: 14px;
            border: 1px solid #168cff;
            border-radius: 10px;
            background: linear-gradient(90deg, #061b3a, #0a2d5c);
            color: var(--cian);
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .boton-ofertas:hover {
            transform: scale(1.01);
            box-shadow: 0 0 18px rgba(0, 140, 255, 0.3);
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .logo {
                font-size: 16px;
            }

            .inicio {
                padding: 8px;
                font-size: 12px;
            }

            .tarjeta {
                padding: 20px 14px;
            }

            h1 {
                font-size: 24px;
            }

            .catalogo {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<main class="contenedor">

    <header>
        <div class="logo">
            <span class="rayo">⚡</span> Gamers Gold Top-Up
        </div>

        <a href="juegos.html" class="inicio">← Juegos</a>
    </header>

    <section class="tarjeta">

        <div class="icono">👑</div>

        <h1>Honor of Kings</h1>

        <p class="descripcion">
            Explora los paquetes de Tokens disponibles para Honor of Kings.
            Estamos preparando nuestro sistema de recargas.
        </p>

        <label for="id">ID del jugador</label>

        <input
            type="text"
            id="id"
            placeholder="Escribe tu ID de Honor of Kings"
            autocomplete="off"
            maxlength="100"
        >

        <h2 class="titulo-paquetes">Selecciona tu paquete</h2>

        <p class="texto-paquetes">
            Elige el paquete de Tokens que deseas consultar.
        </p>

        <div
            class="estado"
            id="estadoCatalogo"
            aria-live="polite"
            role="status"
        >
            Conectando con el catálogo...
        </div>

        <div
            class="catalogo"
            id="catalogo"
            aria-label="Paquetes de Tokens"
        ></div>

        <button
            class="recargar"
            id="botonRecargar"
            type="button"
            disabled
        >
            Compras temporalmente desactivadas
        </button>

        <div class="separador-ofertas">
            <button
                class="boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas Especiales
            </button>
        </div>

    </section>

</main>

<script>
"use strict";

/* =========================================
   CONFIGURACIÓN DEL CATÁLOGO
========================================= */

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const URL_CATALOGO =
    SUPABASE_URL + "/functions/v1/nextlevel-catalogo";

const catalogoElemento =
    document.getElementById("catalogo");

const estadoCatalogo =
    document.getElementById("estadoCatalogo");

const botonRecargar =
    document.getElementById("botonRecargar");

let productosDisponibles = [];
let productoSeleccionado = null;

/* =========================================
   OFERTAS ESPECIALES
========================================= */

function abrirOfertas() {
    window.location.href = "ofertas-honor.html";
}

/* =========================================
   EXTRAER PRODUCTOS
========================================= */

function extraerProductos(respuesta) {
    if (Array.isArray(respuesta)) {
        return respuesta;
    }

    if (!respuesta || typeof respuesta !== "object") {
        return [];
    }

    if (Array.isArray(respuesta.productos)) {
        return respuesta.productos;
    }

    if (Array.isArray(respuesta.products)) {
        return respuesta.products;
    }

    if (Array.isArray(respuesta.data)) {
        return respuesta.data;
    }

    if (
        respuesta.data &&
        Array.isArray(respuesta.data.products)
    ) {
        return respuesta.data.products;
    }

    return [];
}

/* =========================================
   OBTENER NOMBRE DEL PRODUCTO
========================================= */

function obtenerNombre(producto) {
    return String(
        producto.name ||
        producto.productName ||
        producto.product_name ||
        producto.title ||
        producto.productId ||
        "Paquete de Tokens"
    ).trim();
}

/* =========================================
   OBTENER ID DEL PROVEEDOR
========================================= */

function obtenerProductId(producto) {
    return String(
        producto.productId ||
        producto.product_id ||
        producto.id ||
        ""
    ).trim();
}

/* =========================================
   IDENTIFICAR PAQUETES DE TOKENS
========================================= */

function esPaqueteTokens(producto) {
    const id = obtenerProductId(producto).toLowerCase();
    const nombre = obtenerNombre(producto).toLowerCase();

    /*
     * Aceptamos los identificadores con el formato
     * conocido de Honor of Kings y los nombres que
     * identifican claramente paquetes de Tokens.
     *
     * No mostramos ofertas ni productos de otro tipo.
     */

    const idCorrecto =
        /^fz-honor_of_kings-\d+_tokens$/.test(id);

    const nombreCorrecto =
        /^\d[\d,.\s]*\s*tokens?$/.test(nombre);

    return idCorrecto || nombreCorrecto;
}

/* =========================================
   MOSTRAR MENSAJE
========================================= */

function mostrarEstado(mensaje, esError = false) {
    estadoCatalogo.textContent = mensaje;

    estadoCatalogo.classList.toggle(
        "error",
        esError
    );
}

/* =========================================
   DIBUJAR TARJETAS
========================================= */

function mostrarProductos(productos) {
    catalogoElemento.innerHTML = "";

    productos.forEach(producto => {
        const idProducto = obtenerProductId(producto);
        const nombreProducto = obtenerNombre(producto);

        const tarjeta = document.createElement("button");

        tarjeta.type = "button";
        tarjeta.className = "producto";
        tarjeta.dataset.productId = idProducto;

        tarjeta.setAttribute(
            "aria-pressed",
            "false"
        );

        const nombre = document.createElement("div");
        nombre.className = "producto-nombre";
        nombre.textContent = nombreProducto;

        const texto = document.createElement("div");
        texto.className = "producto-estado";
        texto.textContent = "Seleccionar paquete";

        tarjeta.appendChild(nombre);
        tarjeta.appendChild(texto);

        tarjeta.addEventListener("click", () => {
            seleccionarProducto(
                producto,
                tarjeta
            );
        });

        catalogoElemento.appendChild(tarjeta);
    });
}

/* =========================================
   SELECCIONAR PAQUETE
========================================= */

function seleccionarProducto(producto, tarjeta) {
    productoSeleccionado = producto;

    document.querySelectorAll(".producto").forEach(elemento => {
        elemento.classList.remove("seleccionado");

        elemento.setAttribute(
            "aria-pressed",
            "false"
        );

        const texto =
            elemento.querySelector(".producto-estado");

        if (texto) {
            texto.textContent = "Seleccionar paquete";
        }
    });

    tarjeta.classList.add("seleccionado");

    tarjeta.setAttribute(
        "aria-pressed",
        "true"
    );

    const texto =
        tarjeta.querySelector(".producto-estado");

    if (texto) {
        texto.textContent = "✓ Paquete seleccionado";
    }

    /*
     * La selección es solamente visual.
     * No se crea ningún pedido ni se realiza un pago.
     */

    console.log(
        "PAQUETE SELECCIONADO:",
        obtenerProductId(producto),
        obtenerNombre(producto)
    );
}

/* =========================================
   CARGAR CATÁLOGO REAL
========================================= */

async function cargarCatalogoTokens() {
    productosDisponibles = [];
    productoSeleccionado = null;

    catalogoElemento.innerHTML = "";

    botonRecargar.disabled = true;

    mostrarEstado(
        "Conectando con el catálogo de Honor of Kings..."
    );

    try {
        const respuesta = await fetch(
            URL_CATALOGO + "?game=honor-of-kings",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const resultado = await respuesta.json();

        console.log(
            "CATÁLOGO HONOR OF KINGS:",
            resultado
        );

        if (!respuesta.ok) {
            throw new Error(
                resultado.error ||
                resultado.message ||
                "Error HTTP " + respuesta.status
            );
        }

        const productos = extraerProductos(resultado);

        if (productos.length === 0) {
            throw new Error(
                "El catálogo no devolvió productos."
            );
        }

        /*
         * Solo paquetes disponibles de Tokens.
         * No mostramos precios NXC del proveedor.
         */

        productosDisponibles = productos
            .filter(producto =>
                producto &&
                producto.available === true &&
                obtenerProductId(producto) !== "" &&
                esPaqueteTokens(producto)
            )
            .sort((a, b) => {
                const nombreA = obtenerNombre(a);
                const nombreB = obtenerNombre(b);

                const cantidadA =
                    parseInt(
                        nombreA.replace(/[^\d]/g, ""),
                        10
                    ) || 0;

                const cantidadB =
                    parseInt(
                        nombreB.replace(/[^\d]/g, ""),
                        10
                    ) || 0;

                return cantidadA - cantidadB;
            });

        if (productosDisponibles.length === 0) {
            mostrarEstado(
                "El catálogo respondió, pero no encontramos paquetes de Tokens disponibles con los identificadores esperados.",
                true
            );

            catalogoElemento.innerHTML = `
                <div class="mensaje-vacio">
                    Todavía no podemos mostrar los paquetes.
                    Necesitamos revisar los identificadores
                    reales del catálogo antes de configurar
                    el filtro.
                </div>
            `;

            return;
        }

        mostrarProductos(productosDisponibles);

        mostrarEstado(
            productosDisponibles.length +
            " paquetes de Tokens encontrados. " +
            "Las compras todavía no están habilitadas."
        );

        console.log(
            "TOKENS DISPONIBLES:",
            productosDisponibles.map(producto => ({
                id: obtenerProductId(producto),
                nombre: obtenerNombre(producto)
            }))
        );

    } catch (error) {
        console.error(
            "ERROR CARGANDO HONOR OF KINGS:",
            error
        );

        productosDisponibles = [];
        productoSeleccionado = null;

        catalogoElemento.innerHTML = `
            <div class="mensaje-vacio">
                No se pudo cargar el catálogo.
                Intenta recargar la página.
            </div>
        `;

        mostrarEstado(
            "No se pudo conectar con el catálogo de Honor of Kings. Revisa la conexión e inténtalo de nuevo.",
            true
        );
    }
}

/* =========================================
   INICIO
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    cargarCatalogoTokens
);
</script>

</body>
    </html>
