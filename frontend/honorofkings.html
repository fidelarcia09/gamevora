<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Honor of Kings | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px;
            border-bottom: 1px solid #12385f;
            background: #071225;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
        }

        .logo .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .inicio {
            text-decoration: none;
            color: white;
            border: 1px solid #168cff;
            padding: 9px 13px;
            border-radius: 9px;
            font-size: 13px;
            white-space: nowrap;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 25px 18px;
        }

        .juego {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.12);
        }

        .icono {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #b8c9dc;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        select:disabled {
            opacity: 0.75;
        }

        .recargar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .recargar:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .separador-ofertas {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #12385f;
        }

        .boton-ofertas {
            width: 100%;
            padding: 14px;
            border: 1px solid #168cff;
            border-radius: 10px;
            background: linear-gradient(90deg, #061b3a, #0a2d5c);
            color: #00baff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 140, 255, 0.15);
            transition: 0.2s;
        }

        .boton-ofertas:hover {
            transform: scale(1.02);
            box-shadow: 0 0 18px rgba(0, 140, 255, 0.3);
        }

        .estado-catalogo {
            color: #8fa5bd;
            font-size: 12px;
            line-height: 1.5;
            margin-top: -8px;
            margin-bottom: 16px;
        }

        @media (max-width: 380px) {
            header {
                padding: 14px 10px;
            }

            .logo {
                font-size: 17px;
            }

            .inicio {
                padding: 8px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <span class="rayo">⚡</span> Gamers Gold Top-Up
    </div>

    <a href="juegos.html" class="inicio">← Juegos</a>
</header>

<main class="contenedor">
    <section class="juego">

        <div class="icono">👑</div>

        <h1>Honor of Kings</h1>

        <p class="descripcion">
            Recarga tu cuenta de Honor of Kings de forma rápida y sencilla.
        </p>

        <label for="id">ID del jugador</label>

        <input
            type="text"
            id="id"
            placeholder="Escribe tu ID de Honor of Kings"
            autocomplete="off"
        >

        <label for="cantidad">Selecciona una cantidad de Tokens</label>

        <select id="cantidad" disabled>
            <option value="">Cargando paquetes de Tokens...</option>
        </select>

        <p class="estado-catalogo" id="estadoCatalogo" aria-live="polite">
            Conectando con el catálogo...
        </p>

        <button
            class="recargar"
            id="botonRecargar"
            type="button"
            onclick="continuarRecarga()"
            disabled
        >
            Continuar ⚡
        </button>

        <div class="separador-ofertas">
            <button
                class="boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas Especiales
            </button>
        </div>

    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* SUPABASE */

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* CATÁLOGO NEXT LEVEL */

const URL_CATALOGO =
    SUPABASE_URL + "/functions/v1/nextlevel-catalogo";

const selectCantidad = document.getElementById("cantidad");
const botonRecargar = document.getElementById("botonRecargar");
const estadoCatalogo = document.getElementById("estadoCatalogo");

let catalogoCargado = false;
let productosDisponibles = [];

/* OFERTAS ESPECIALES */

function abrirOfertas() {
    window.location.href = "ofertas-honor.html";
}

/* EXTRAER PRODUCTOS DE LA RESPUESTA */

function extraerProductos(respuesta) {
    if (Array.isArray(respuesta)) {
        return respuesta;
    }

    if (!respuesta || typeof respuesta !== "object") {
        return [];
    }

    if (Array.isArray(respuesta.productos)) {
        return respuesta.productos;
    }

    if (Array.isArray(respuesta.products)) {
        return respuesta.products;
    }

    if (Array.isArray(respuesta.data)) {
        return respuesta.data;
    }

    if (respuesta.data && Array.isArray(respuesta.data.products)) {
        return respuesta.data.products;
    }

    return [];
}

/* OBTENER NOMBRE */

function obtenerNombre(producto) {
    return String(
        producto.name ||
        producto.productName ||
        producto.product_name ||
        producto.title ||
        producto.productId ||
        "Producto de Honor of Kings"
    ).trim();
}

/* OBTENER ID DEL PROVEEDOR */

function obtenerProductId(producto) {
    return String(
        producto.productId ||
        producto.product_id ||
        producto.id ||
        ""
    ).trim();
}

/* IDENTIFICAR PAQUETES DE TOKENS */

function esPaqueteTokens(producto) {
    const id = obtenerProductId(producto).toLowerCase();
    const nombre = obtenerNombre(producto).toLowerCase();

    return (
        /fz-honor_of_kings-\d+_tokens/.test(id) ||
        /^\d[\d,]*\s*tokens?$/.test(nombre)
    );
}

/* CARGAR CATÁLOGO REAL */

async function cargarCatalogoTokens() {
    catalogoCargado = false;
    productosDisponibles = [];

    selectCantidad.disabled = true;
    botonRecargar.disabled = true;

    selectCantidad.innerHTML =
        '<option value="">Cargando paquetes de Tokens...</option>';

    estadoCatalogo.textContent =
        "Conectando con el catálogo de Honor of Kings...";

    try {
        const respuesta = await fetch(
            URL_CATALOGO + "?game=honor-of-kings",
            {
                method: "GET",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Accept": "application/json"
                },
                cache: "no-store"
            }
        );

        const resultado = await respuesta.json();

        console.log("CATÁLOGO HONOR OF KINGS:", resultado);

        if (!respuesta.ok) {
            throw new Error(
                resultado.error ||
                resultado.message ||
                "Error HTTP " + respuesta.status
            );
        }

        const productos = extraerProductos(resultado);

        if (productos.length === 0) {
            throw new Error("El catálogo no devolvió productos.");
        }

        /*
         * SOLO MOSTRAMOS TOKENS DISPONIBLES.
         * Las ofertas especiales no aparecen en esta lista.
         */

        productosDisponibles = productos
            .filter(producto =>
                producto &&
                producto.available === true &&
                obtenerProductId(producto) !== "" &&
                esPaqueteTokens(producto)
            )
            .sort((a, b) => {
                const cantidadA = parseInt(
                    obtenerNombre(a).replace(/[^\d]/g, ""),
                    10
                ) || 0;

                const cantidadB = parseInt(
                    obtenerNombre(b).replace(/[^\d]/g, ""),
                    10
                ) || 0;

                return cantidadA - cantidadB;
            });

        selectCantidad.innerHTML = "";

        const opcionInicial = document.createElement("option");
        opcionInicial.value = "";
        opcionInicial.textContent = "Selecciona una cantidad";

        selectCantidad.appendChild(opcionInicial);

        productosDisponibles.forEach(producto => {
            const opcion = document.createElement("option");

            opcion.value = obtenerProductId(producto);
            opcion.textContent = obtenerNombre(producto);

            selectCantidad.appendChild(opcion);
        });

        if (productosDisponibles.length === 0) {
            selectCantidad.innerHTML =
                '<option value="">No hay paquetes disponibles</option>';

            estadoCatalogo.textContent =
                "No se encontraron paquetes de Tokens disponibles.";

            return;
        }

        catalogoCargado = true;

        selectCantidad.disabled = false;

        /*
         * El catálogo se puede consultar, pero las compras
         * siguen deshabilitadas mientras se preparan los precios.
         */

        botonRecargar.disabled = true;

        estadoCatalogo.textContent =
            productosDisponibles.length +
            " paquetes de Tokens encontrados. Las compras todavía no están habilitadas.";

        console.log(
            "TOKENS MOSTRADOS:",
            productosDisponibles.map(producto => ({
                id: obtenerProductId(producto),
                nombre: obtenerNombre(producto)
            }))
        );

    } catch (error) {
        console.error("ERROR CARGANDO HONOR OF KINGS:", error);

        catalogoCargado = false;
        productosDisponibles = [];

        selectCantidad.innerHTML =
            '<option value="">Error cargando paquetes</option>';

        selectCantidad.disabled = true;
        botonRecargar.disabled = true;

        estadoCatalogo.textContent =
            "No se pudo cargar el catálogo. Intenta recargar la página.";
    }
}

/* COMPRAS TODAVÍA DESHABILITADAS */

function continuarRecarga() {
    alert(
        "Las recargas de Honor of Kings todavía no están habilitadas. " +
        "Estamos preparando los precios y la conexión de pedidos."
    );
}

/* INICIAR */

document.addEventListener(
    "DOMContentLoaded",
    cargarCatalogoTokens
);
</script>

</body>
</html>
