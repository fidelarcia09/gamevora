<script type="module">

 getClient: () => supabase,
 getProduct: () => { const selected = productoSeleccionado; return selected && (selected.local || selected); },

   alert("El ID del jugador no es válido. Compruébalo antes de pagar."); return false;

 }

let vistaActual = "tokens";
let procesando = false;
let usuarioActualId = null;

const CLAVE_PEDIDO_BASE = "ggt_honor_of_kings_pedido_";

function mostrarEstado(mensaje, tipo = "") {
    mensaje = typeof mensaje === "string" ? mensaje.replace(/pedido aceptado por next level/gi, "Pedido aceptado por Gamers Gold Top-Up") : mensaje;
  estadoCatalogo.textContent = mensaje;
  estadoCatalogo.style.display = mensaje ? "" : "none";
  estadoCatalogo.classList.toggle("error", tipo === "error");
  estadoCatalogo.classList.toggle("correcto", tipo === "correcto");
}
function errorTexto(error, alternativo = "No se pudo completar la operación.") {
  return error?.message || alternativo;
}
function normalizarTexto(valor) {
  return String(valor ?? "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[\s_-]/g, "");
}
function extraerProductos(respuesta) {
  if (Array.isArray(respuesta)) return respuesta;
  if (!respuesta || typeof respuesta !== "object") return [];
  for (const lista of [respuesta.productos, respuesta.products, respuesta.data, respuesta.data?.products, respuesta.data?.productos, respuesta.items, respuesta.results]) {
    if (Array.isArray(lista)) return lista;
  }
  return [];
}
function obtenerProductId(producto) {
  return String(producto?.productId || producto?.product_id || producto?.provider_product_id || producto?.providerProductId || producto?.id || "").trim();
}
function obtenerNombre(producto) {
  return String(producto?.nombreMostrar || producto?.name || producto?.productName || producto?.product_name || producto?.title || producto?.nombre || obtenerProductId(producto) || "Producto de Honor of Kings").trim();
}
function esPaqueteTokens(producto) {
  const id = obtenerProductId(producto).toLowerCase();
  const nombre = obtenerNombre(producto).trim();
  return /^fz-honor_of_kings-\d+_tokens$/.test(id) || /^\d[\d,.\s]*\s*tokens?$/i.test(nombre);
}
function mostrarPrecio(precio) {
  return Number(precio).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " GVR";
}
function productoComprable(local) {
  return !!local && local.active === true && Number.isFinite(Number(local.price_gvr)) && Number(local.price_gvr) > 0 &&
    local.provider === "nextlevel" && !!local.provider_product_id;
}
function buscarLocalPorId(id) {
  return productosLocales.find(p => String(p.provider_product_id || "").trim() === String(id).trim()) || null;
}
function buscarProveedorPorId(id) {
  const exacto = productosProveedor.find(p => obtenerProductId(p) === id);
  if (exacto) return exacto;

  const objetivo = normalizarTexto(id);
  return productosProveedor.find(p => {
    const idProveedor = normalizarTexto(obtenerProductId(p));
    return idProveedor === objetivo ||
      (idProveedor.includes("honorofkings") && objetivo.includes("honorofkings") &&
       idProveedor.endsWith(objetivo.replace(/^fzhonorofkings/, "")));
  }) || null;
}
function buscarProveedorOferta(oferta) {
  const exacto = buscarProveedorPorId(oferta.id);
  if (exacto) return exacto;

  const claves = {
    standard_purchase_rebate_pack: ["standardpurchaserebatepack", "standardrebatepack"],
    weekly_card: ["weeklycard"],
    premium_purchase_rebate_pack: ["premiumpurchaserebatepack", "premiumrebatepack"],
    weekly_card_plus: ["weeklycardplus"]
  };
  const idBase = oferta.id.replace("fz-honor_of_kings-", "");
  const candidatas = claves[idBase] || [normalizarTexto(oferta.nombre)];
  return productosProveedor.find(p => {
    const id = normalizarTexto(obtenerProductId(p));
    const nombre = normalizarTexto(obtenerNombre(p));
    return candidatas.some(clave => {
      const normalizada = normalizarTexto(clave);
      return id.includes(normalizada) || nombre.includes(normalizada);
    });
  }) || null;
}
function clavePedidoPendiente(userId) {
  return CLAVE_PEDIDO_BASE + userId;
}
function guardarPedidoPendiente() {
  if (!usuarioActualId || !pedidoPendienteId) return;
  localStorage.setItem(clavePedidoPendiente(usuarioActualId), JSON.stringify({ orderId: pedidoPendienteId, accion: accionPendiente }));
}
function borrarPedidoPendiente() {
  if (usuarioActualId) localStorage.removeItem(clavePedidoPendiente(usuarioActualId));
  pedidoPendienteId = null;
  accionPendiente = "crear";
}
function recuperarPedidoPendiente(userId) {
  try {
    const guardado = localStorage.getItem(clavePedidoPendiente(userId));
    if (!guardado) { pedidoPendienteId = null; accionPendiente = "crear"; return; }
    const datos = JSON.parse(guardado);
    if (typeof datos.orderId !== "string" || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(datos.orderId)) throw new Error("La referencia del pedido no es válida.");
    pedidoPendienteId = datos.orderId;
    accionPendiente = datos.accion === "consultar" ? "consultar" : "enviar";
  } catch (error) {
    console.error("Error recuperando pedido:", error);
    pedidoPendienteId = null;
    accionPendiente = "crear";
  }
}
async function verificarPedidoGuardado(userId) {
  if (!pedidoPendienteId) return false;
  const idVerificado = pedidoPendienteId;
  const { data, error } = await supabase.from("game_orders")
    .select("id,status,provider_order_id,provider_client_reference,provider_submitted_at,provider_status,provider_error")
    .eq("id", idVerificado).eq("user_id", userId).maybeSingle();
  if (error) {
    console.error("Error verificando pedido:", error.message);
    throw new Error("No se pudo verificar el pedido anterior. No iniciaremos otra compra hasta resolverlo.");
  }
  if (!data) throw new Error("No pudimos confirmar el pedido anterior en la base de datos. No hagas otra recarga hasta aclarar su estado.");
  const status = String(data.status || "").toLowerCase();
  const errorProveedor = String(data.provider_status || "") + " " + String(data.provider_error || "");
  if (status === "failed" && !data.provider_order_id && !data.provider_submitted_at) { borrarPendiente(); actualizarBoton(); mostrarEstado("El pedido anterior falló y no tiene una recarga remota asociada. Puedes iniciar un pedido nuevo.", "aviso"); return false; }
  if (status === "completed" || status === "refunded") {
    borrarPedidoPendiente();
    return false;
  }
  if (data.provider_order_id || data.provider_client_reference || data.provider_submitted_at) accionPendiente = "consultar";
  else if (status === "pending") accionPendiente = "enviar";
  else accionPendiente = "consultar";
  guardarPedidoPendiente();
  actualizarBoton();
  return true;
}
function limpiarSeleccion() {
  document.querySelectorAll("#catalogo .producto, #catalogoOfertas .producto").forEach(el => el.classList.remove("seleccionado"));
}
function seleccionarProducto(proveedor, local, tipo, tarjeta) {
  if (procesando || pedidoPendienteId || !productoComprable(local)) return;
  limpiarSeleccion();
  tarjeta.classList.add("seleccionado");
  productoSeleccionado = { proveedor, local, tipo };
  actualizarBoton();
}
function cambiarVista(vista) {
  vistaActual = vista;
  $("vistaTokens").classList.toggle("vista-oculta", vista !== "tokens");
  $("vistaOfertas").classList.toggle("vista-oculta", vista !== "ofertas");
  $("pestanaTokens").classList.toggle("activa", vista === "tokens");
  $("pestanaOfertas").classList.toggle("activa", vista === "ofertas");
  $("pestanaTokens").setAttribute("aria-selected", String(vista === "tokens"));
  $("pestanaOfertas").setAttribute("aria-selected", String(vista === "ofertas"));
  productoSeleccionado = null;
  limpiarSeleccion();
  mostrarEstado(vista === "tokens" ? "Selecciona el paquete de Tokens que deseas comprar." : "Selecciona una oferta especial.");
  actualizarBoton();
}
$("pestanaTokens").addEventListener("click", () => cambiarVista("tokens"));
$("pestanaOfertas").addEventListener("click", () => cambiarVista("ofertas"));

function actualizarBoton() {
  if (procesando) { botonContinuar.disabled = true; return; }
  if (pedidoPendienteId) {
    botonContinuar.textContent = accionPendiente === "enviar" ? "RECUPERAR PEDIDO" : "CONSULTAR PEDIDO";
    botonContinuar.disabled = false;
    return;
  }
  botonContinuar.textContent = vistaActual === "ofertas" ? "COMPRAR OFERTA" : "RECARGAR";
  botonContinuar.disabled = !campoJugador.value.trim() || !productoSeleccionado;
}
function cerrarModal(resultado) {
  modalFondo.classList.remove("visible");
  modalFondo.setAttribute("aria-hidden", "true");
  document.body.classList.remove("modal-abierto");
  if (typeof resolverConfirmacionModal === "function") {
    const resolver = resolverConfirmacionModal;
    resolverConfirmacionModal = null;
    resolver(resultado);
  }
}
function abrirModal(producto, playerId, precio) {
  modalPaquete.textContent = obtenerNombre(producto);
  modalJugador.textContent = playerId;
  modalTotal.textContent = mostrarPrecio(precio);
  modalFondo.classList.add("visible");
  modalFondo.setAttribute("aria-hidden", "false");
  document.body.classList.add("modal-abierto");
  modalCancelar.disabled = false;
  modalAceptar.disabled = false;
  return new Promise(resolve => { resolverConfirmacionModal = resolve; modalCancelar.focus(); });
}
modalCancelar.addEventListener("click", () => cerrarModal(false));
modalAceptar.addEventListener("click", () => cerrarModal(true));
modalFondo.addEventListener("click", e => { if (e.target === modalFondo) cerrarModal(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalFondo.classList.contains("visible")) cerrarModal(false); });

async function cargarProductosLocales() {
  const { data, error } = await supabase.from("game_products")
    .select("id,game,product_name,price_gvr,active,provider,provider_product_id,provider_region")
    .eq("game", "Honor of Kings").eq("provider", "nextlevel");
  if (error) throw new Error("No se pudieron verificar los productos y sus precios GVR.");
  productosLocales = data || [];
}
function renderizarTokens() {
  catalogo.replaceChildren();
  if (!productosTokens.length) {
    const vacio = document.createElement("div");
    vacio.className = "estado";
    vacio.textContent = "No encontramos paquetes de Tokens disponibles en Next Level.";
    catalogo.appendChild(vacio);
    return;
  }
  productosTokens.forEach(producto => {
    const id = obtenerProductId(producto);
    const local = buscarLocalPorId(id);
    const comprable = producto.available === true && productoComprable(local);
    const tarjeta = document.createElement("button");
    tarjeta.type = "button"; tarjeta.className = "producto"; if (local?.id) tarjeta.dataset.ggProductId = String(local.id);
    tarjeta.disabled = !comprable;
    if (!comprable) tarjeta.classList.add("producto-no-disponible");
    const nombre = document.createElement("div"); nombre.className = "producto-nombre"; nombre.textContent = obtenerNombre(producto);
    const precio = document.createElement("div"); precio.className = "producto-precio";
    precio.textContent = productoComprable(local) ? mostrarPrecio(Number(local.price_gvr)) : "Precio pendiente";
    const estado = document.createElement("div"); estado.className = "producto-estado";
    estado.textContent = comprable ? "Disponible" : (!local ? "Falta configurar en Supabase" : local.active !== true ? "Temporalmente inactivo" : producto.available !== true ? "No disponible en proveedor" : "Revisar precio GVR");
    tarjeta.append(nombre, precio, estado);
    if (comprable) tarjeta.addEventListener("click", () => seleccionarProducto(producto, local, "tokens", tarjeta));
    catalogo.appendChild(tarjeta);
  });
}
function renderizarOfertas() {
  catalogoOfertas.replaceChildren();
  if (OFERTAS_HONOR.length === 0) {
    const vacio = document.createElement("div");
    vacio.className = "estado";
    vacio.textContent = "No hay ofertas especiales disponibles actualmente.";
    catalogoOfertas.appendChild(vacio);
    return;
  }
  OFERTAS_HONOR.forEach(oferta => {
    const proveedor = buscarProveedorOferta(oferta);
    const idProveedor = proveedor ? obtenerProductId(proveedor) : oferta.id;
    const local = buscarLocalPorId(idProveedor);
    const comprable = !!proveedor && proveedor.available === true && productoComprable(local);
    const tarjeta = document.createElement("button");
    tarjeta.type = "button"; tarjeta.className = "producto producto-oferta"; if (local?.id) tarjeta.dataset.ggProductId = String(local.id);
    tarjeta.disabled = !comprable;
    if (!comprable) tarjeta.classList.add("producto-no-disponible");
    const icono = document.createElement("div"); icono.className = "oferta-icono"; icono.textContent = oferta.icono;
    const nombre = document.createElement("div"); nombre.className = "producto-nombre"; nombre.textContent = oferta.nombre;
    const precio = document.createElement("div"); precio.className = "producto-precio";
    precio.textContent = productoComprable(local) ? mostrarPrecio(Number(local.price_gvr)) : "Precio pendiente";
    const estado = document.createElement("div"); estado.className = "producto-estado";
    if (comprable) estado.textContent = "Disponible";
    else if (!proveedor) estado.textContent = "No encontrado en catálogo";
    else if (proveedor.available !== true) estado.textContent = "No disponible en proveedor";
    else if (!local) estado.textContent = "Falta configurar en Supabase";
    else if (local.active !== true) estado.textContent = "Oferta temporalmente inactiva";
    else estado.textContent = "Revisar precio GVR";
    tarjeta.append(icono, nombre, precio, estado);
    if (comprable) {
      const productoConNombre = { ...proveedor, nombreMostrar: oferta.nombre };
      tarjeta.addEventListener("click", () => seleccionarProducto(productoConNombre, local, "oferta", tarjeta));
    }
    catalogoOfertas.appendChild(tarjeta);
  });
}
async function cargarCatalogo() {
  productosProveedor = []; productosTokens = []; productoSeleccionado = null;
  catalogo.replaceChildren(); catalogoOfertas.replaceChildren();
  mostrarEstado("Conectando con el catálogo...");
  try {
    const respuestaHTTP = await fetch(URL_CATALOGO + "?game=honor-of-kings", {
      method: "GET",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY, Accept: "application/json" },
      cache: "no-store"
    });
    const [resultado] = await Promise.all([respuestaHTTP.json(), cargarProductosLocales()]);
    if (!respuestaHTTP.ok) throw new Error(resultado.error || resultado.message || "Error HTTP " + respuestaHTTP.status);
    if (resultado?.success === false) throw new Error(resultado.message || resultado.error || "No se pudo cargar el catálogo.");
    const productos = extraerProductos(resultado);
    if (!productos.length) throw new Error("Next Level no devolvió productos para Honor of Kings.");
    const mapa = new Map();
    productos.forEach(p => {
      const id = obtenerProductId(p);
      if (p && id && p.available === true && esPaqueteTokens(p) && !mapa.has(id)) mapa.set(id, p);
    });
    productosProveedor = productos.filter(p => p && obtenerProductId(p));
    productosTokens = Array.from(mapa.values()).sort((a,b) => {
      const nA = parseInt(obtenerNombre(a).replace(/[^\d]/g,""),10) || 0;
      const nB = parseInt(obtenerNombre(b).replace(/[^\d]/g,""),10) || 0;
      return nA - nB;
    });
    renderizarTokens();
    renderizarOfertas();
    mostrarEstado("");
    
  } catch (error) {
    console.error("Error cargando catálogo de Honor of Kings:", error);
    catalogo.replaceChildren(); catalogoOfertas.replaceChildren();
    mostrarEstado(errorTexto(error, "No se pudo cargar el catálogo."), "error");
  }
  actualizarBoton();
}
async function llamarFuncion(url, accessToken, body) {
  const respuesta = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY, Authorization: "Bearer " + accessToken },
    body: JSON.stringify(body)
  });
  let datos = {};
  try { datos = await respuesta.json(); } catch {}
  if (!respuesta.ok) {
    const error = new Error(datos.error || datos.message || "La función devolvió HTTP " + respuesta.status);
    error.status = respuesta.status; error.data = datos; throw error;
  }
  return datos;
}
async function consultarPedido(accessToken) {
  if (!pedidoPendienteId) throw new Error("No hay ningún pedido guardado para consultar.");
  const datos = await llamarFuncion(URL_CONSULTAR_PEDIDO, accessToken, { game_order_id: pedidoPendienteId });
  const estadoLocal = String(datos.status || "").toLowerCase();
  const estadoProveedor = String(datos.provider_status || "").toUpperCase();
  if (estadoLocal === "completed" || estadoLocal === "refunded" || estadoLocal === "failed") {
    const mensaje = estadoLocal === "completed" ? "¡Recarga completada por el proveedor!" : estadoLocal === "refunded" ? "El pedido figura como reembolsado." : "El pedido figura como fallido. Verifica el reembolso antes de comprar otra vez.";
    borrarPedidoPendiente(); actualizarBoton(); mostrarEstado(mensaje, estadoLocal === "completed" ? "correcto" : "error");
    alert(mensaje + "\n\nPedido: " + (datos.game_order_id || "consultado"));
    return;
  }
  if (estadoProveedor === "FAILED") {
    accionPendiente = "consultar"; guardarPedidoPendiente(); actualizarBoton();
    mostrarEstado("El proveedor informa FAILED. Verifica el pedido y el reembolso antes de volver a comprar.", "error"); return;
  }
  accionPendiente = "consultar"; guardarPedidoPendiente(); actualizarBoton();
  mostrarEstado(datos.message || "El pedido sigue pendiente. Verifica su estado antes de comprar otra vez.");
}
async function enviarPedido(accessToken) {
  if (!pedidoPendienteId) throw new Error("No hay ningún pedido guardado para enviar.");
  const idPedido = pedidoPendienteId;
  accionPendiente = "consultar"; guardarPedidoPendiente(); actualizarBoton();
  try {
    const datos = await llamarFuncion(URL_CREAR_PEDIDO, accessToken, { game_order_id: idPedido });
    console.log("Respuesta de crear pedido Honor of Kings:", datos);
    mostrarEstado(datos.message || "Solicitud procesada. Abriendo el seguimiento del pedido...", "correcto");
  } catch (error) {
    console.error("Error enviando pedido:", error, error.data || "");
    mostrarEstado("No se pudo confirmar el envío. Abriendo el seguimiento del pedido para verificar su estado.", "error");
  }
  window.location.href = new URL("checkout.html?id=" + encodeURIComponent(idPedido), window.location.href).href;
}
async function crearCompra(accessToken, playerId) {
  if (!productoSeleccionado) throw new Error("Selecciona primero un producto disponible.");
  const local = productoSeleccionado.local;
  const idProveedor = obtenerProductId(productoSeleccionado.proveedor);
  if (!local || !productoComprable(local) || String(local.provider_product_id).trim() !== idProveedor) {
    throw new Error("El producto no está correctamente configurado para la compra.");
  }
  const { data: productoActual, error: errorProducto } = await supabase.from("game_products")
    .select("id,game,price_gvr,active,provider,provider_product_id")
    .eq("id", local.id).eq("provider", "nextlevel").eq("active", true).maybeSingle();
  if (errorProducto) throw new Error("No se pudo verificar el producto antes de comprar.");
  if (!productoActual || normalizarTexto(productoActual.game) !== "honorofkings" ||
      String(productoActual.provider_product_id || "").trim() !== idProveedor ||
      !Number.isFinite(Number(productoActual.price_gvr)) || Number(productoActual.price_gvr) <= 0) {
    throw new Error("El producto o su precio cambiaron. Actualiza el catálogo antes de comprar.");
  }
  const precioFinal = await window.ggGetResellerDiscountedPrice(Number(productoActual.price_gvr));
  const confirmar = await abrirModal(productoSeleccionado.proveedor, playerId, precioFinal);
  if (!confirmar) { mostrarEstado("Compra cancelada. No se creó ningún pedido."); return; }
  mostrarEstado("Creando pedido. No cierres esta página...");
  const { data: orderId, error: errorCompra } = await supabase.rpc("purchase_game_product", {
    p_product_id: productoActual.id,
    p_player_id: playerId
  });
  if (errorCompra) {
    console.error("Error creando compra:", errorCompra.message);
    throw new Error(errorCompra.message || "No se pudo crear la compra. Comprueba tu saldo y tu sesión.");
  }
  if (typeof orderId !== "string" || !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(orderId)) {
    throw new Error("No recibimos un ID de pedido válido. Revisa game_orders antes de volver a intentarlo.");
  }
  pedidoPendienteId = orderId; accionPendiente = "enviar"; guardarPedidoPendiente(); actualizarBoton();
  await enviarPedido(accessToken);
}

campoJugador.addEventListener("input", actualizarBoton);
botonContinuar.addEventListener("click", async () => {
  if (procesando) return;
  procesando = true; botonContinuar.disabled = true;
  try {
    const { data: { session }, error: sessionError } = await supabase.auth.getSession();
    if (sessionError) throw new Error("No se pudo comprobar la sesión.");
    if (!session?.access_token) throw new Error("Debes iniciar sesión para continuar.");
    const { data: { user }, error: userError } = await supabase.auth.getUser();
    if (userError || !user) throw new Error("Tu sesión no es válida o ha caducado. Inicia sesión nuevamente.");
    usuarioActualId = user.id;
    recuperarPedidoPendiente(user.id);
    await verificarPedidoGuardado(user.id);
    if (pedidoPendienteId) {
      if (accionPendiente === "enviar") {
        mostrarEstado("Retomando el pedido pendiente existente. No se creará otro pedido...");
        await enviarPedido(session.access_token);
      } else {
        mostrarEstado("Consultando el estado del pedido anterior...");
        await consultarPedido(session.access_token);
      }
      return;
    }
    const playerId = campoJugador.value.trim();
    if (!playerId) throw new Error("Introduce tu ID de Honor of Kings.");
    if (playerId.length > 100) throw new Error("El ID del jugador es demasiado largo.");
    if (!productoSeleccionado) throw new Error(vistaActual === "ofertas" ? "Selecciona primero una oferta disponible." : "Selecciona primero un paquete de Tokens disponible.");
    await crearCompra(session.access_token, playerId);
  } catch (error) {
    console.error("Error en compra de Honor of Kings:", error);
    mostrarEstado(errorTexto(error), "error");
    alert(errorTexto(error));
  } finally {
    procesando = false;
    actualizarBoton();
  }
});

async function iniciar() {
  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user?.id) {
      usuarioActualId = session.user.id;
      recuperarPedidoPendiente(usuarioActualId);

            // Validar la referencia guardada al abrir la página para liberar pedidos ya fallidos.
            await verificarPedidoGuardado(usuarioActualId);
      actualizarBoton();
    }
  } catch (error) { console.error("No se pudo recuperar la sesión:", error); }
  await cargarCatalogo();
  actualizarBoton();
}
iniciar();
</script>
