<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PUBG Mobile | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            border-bottom: 1px solid #12385f;
            background: #071225;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
        }

        .logo .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .inicio {
            text-decoration: none;
            color: white;
            border: 1px solid #168cff;
            padding: 9px 13px;
            border-radius: 9px;
            font-size: 13px;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 25px 18px;
        }

        .juego {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.12);
        }

        .icono {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #b8c9dc;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        .recargar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* =========================
           OFERTAS ESPECIALES
           ========================= */

        .separador-ofertas {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #12385f;
        }

        .boton-ofertas {
            width: 100%;
            padding: 14px;
            border: 1px solid #168cff;
            border-radius: 10px;
            background: linear-gradient(90deg, #061b3a, #0a2d5c);
            color: #00baff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 140, 255, 0.15);
            transition: 0.2s;
        }

        .boton-ofertas:hover {
            transform: scale(1.02);
            box-shadow: 0 0 18px rgba(0, 140, 255, 0.3);
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <span class="rayo">⚡</span> Gamers Gold Top-Up
    </div>

    <a href="juegos.html" class="inicio">
        ← Juegos
    </a>

</header>


<main class="contenedor">

    <section class="juego">

        <div class="icono">🎯</div>

        <h1>PUBG Mobile</h1>

        <p class="descripcion">
            Recarga tu cuenta de PUBG Mobile de forma rápida y sencilla.
        </p>


        <label for="idjugador">
            ID del jugador
        </label>

        <input
            type="text"
            id="idjugador"
            placeholder="Escribe tu ID de PUBG Mobile"
        >


        <label for="cantidad">
            Cantidad
        </label>

        <select id="cantidad">

            <option value="">
                Selecciona una cantidad
            </option>

        </select>


        <button
            class="recargar"
            type="button"
            onclick="continuarRecarga()"
        >
            Continuar ⚡
        </button>


        <!-- =========================
             OFERTAS ESPECIALES
             ========================= -->

        <div class="separador-ofertas">

            <button
                class="boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas Especiales
            </button>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


/* =========================
   ABRIR OFERTAS ESPECIALES
   ========================= */

function abrirOfertas() {

    window.location.href = "ofertas-pubg.html";

}


/* =========================
   CARGAR PRODUCTOS PUBG
   ========================= */

async function cargarProductos() {

    const cantidad =
        document.getElementById("cantidad");

    cantidad.innerHTML = `
        <option value="">
            Cargando productos...
        </option>
    `;


    const {
        data,
        error
    } = await supabaseClient

        .from("game_products")

        .select(
            "id, game, product_name, game_currency_amount, price_gvr, active"
        )

        .eq("game", "PUBG Mobile")

        .eq("active", true)

        .order(
            "game_currency_amount",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(
            "Error cargando productos:",
            error
        );

        cantidad.innerHTML = `
            <option value="">
                No se pudieron cargar los productos
            </option>
        `;

        return;
    }


    if (!data || data.length === 0) {

        cantidad.innerHTML = `
            <option value="">
                No hay productos disponibles
            </option>
        `;

        return;
    }


    cantidad.innerHTML = `
        <option value="">
            Selecciona una cantidad
        </option>
    `;


    data.forEach(producto => {

        const option =
            document.createElement("option");

        option.value =
            producto.product_name;

        option.textContent =
            producto.product_name +
            " — " +
            producto.price_gvr +
            " GVR";

        cantidad.appendChild(option);

    });

}


/* =========================
   RECARGA PUBG MOBILE
   ========================= */

async function continuarRecarga() {

    const idJugador =
        document
            .getElementById("idjugador")
            .value
            .trim();

    const cantidad =
        document
            .getElementById("cantidad")
            .value;


    if (idJugador === "") {

        alert(
            "Escribe tu ID de PUBG Mobile."
        );

        return;
    }


    if (cantidad === "") {

        alert(
            "Selecciona una cantidad."
        );

        return;
    }


    const {
        data: {
            session
        },
        error: sessionError
    } =
        await supabaseClient.auth.getSession();


    if (sessionError || !session) {

        alert(
            "Debes iniciar sesión primero."
        );

        window.location.href =
            "login.html";

        return;
    }


    const {
        data: producto,
        error: productoError
    } =
        await supabaseClient

            .from("game_products")

            .select(
                "id, game, product_name, price_gvr, active"
            )

            .eq(
                "game",
                "PUBG Mobile"
            )

            .eq(
                "product_name",
                cantidad
            )

            .eq(
                "active",
                true
            )

            .maybeSingle();


    console.log(
        "PRODUCTO:",
        producto
    );

    console.log(
        "ERROR:",
        productoError
    );


    if (productoError) {

        alert(
            "Error buscando producto:\n\n" +
            productoError.message
        );

        return;
    }


    if (!producto) {

        alert(
            "No se encontró el producto."
        );

        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient.rpc(
            "purchase_game_product",
            {
                p_product_id:
                    producto.id,

                p_player_id:
                    idJugador
            }
        );


    if (error) {

        console.error(error);

        alert(
            "No se pudo realizar la compra:\n\n" +
            error.message
        );

        return;
    }


    alert(

        "¡Compra realizada! ⚡\n\n" +

        producto.product_name +

        "\n\nPrecio: " +

        producto.price_gvr +

        " GVR\n\n" +

        "ID del pedido: " +

        data

    );


    window.location.href =
        "cuenta.html";

}


/* =========================
   INICIAR
   ========================= */

cargarProductos();

</script>

</body>
</html>
