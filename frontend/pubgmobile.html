<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PUBG Mobile | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050b18;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 174, 255, 0.25);
        }

        .volver {
            display: inline-block;
            color: #00bfff;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            font-style: italic;
            color: #00d9ff;
            text-shadow: 0 0 12px rgba(0, 217, 255, 0.5);
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: #0a1428;
            border: 1px solid rgba(0, 174, 255, 0.25);
            border-radius: 18px;
            padding: 25px 20px;
            box-shadow: 0 0 25px rgba(0, 174, 255, 0.08);
        }

        .icono {
            width: 85px;
            height: 85px;
            margin: 0 auto 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111d35;
            font-size: 42px;
            border: 1px solid rgba(0, 174, 255, 0.25);
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: #9aa8bd;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #233553;
            background: #071020;
            color: white;
            outline: none;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            border-color: #00bfff;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 11px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #botonRecarga {
            background: #00bfff;
            color: #00111c;
        }

        #botonRecarga:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 18px rgba(0, 191, 255, 0.35);
        }

        .boton-ofertas {
            margin-top: 12px;
            background: #101e38;
            color: #00d9ff;
            border: 1px solid rgba(0, 217, 255, 0.35);
        }

        .boton-ofertas:hover {
            background: #142746;
            border-color: #00d9ff;
            transform: translateY(-1px);
        }

        .mensaje {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #ff7373;
            min-height: 20px;
        }

        .cargando {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="volver">← Juegos</a>
    <div class="logo">GAMERS GOLD TOP-UP</div>
</header>

<div class="contenedor">

    <div class="card">

        <div class="icono">🎯</div>

        <h1>PUBG Mobile</h1>

        <p class="descripcion">
            Selecciona tu cantidad de UC y realiza tu recarga.
        </p>

        <label for="idjugador">
            ID del jugador
        </label>

        <input
            type="text"
            id="idjugador"
            placeholder="Escribe tu ID de PUBG Mobile"
            autocomplete="off"
        >

        <label for="cantidad">
            Cantidad
        </label>

        <select id="cantidad">
            <option value="">Cargando productos...</option>
        </select>

        <button
            id="botonRecarga"
            type="button"
            onclick="continuarRecarga()"
        >
            Continuar ⚡
        </button>

        <!-- OFERTAS ESPECIALES -->
        <button
            class="boton-ofertas"
            type="button"
            onclick="window.location.href='ofertas-pubg.html'"
        >
            🎁 Ofertas especiales
        </button>

        <div
            id="mensaje"
            class="mensaje"
        ></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


/* =========================================================
   ELEMENTOS
   ========================================================= */

const idJugador =
    document.getElementById("idjugador");

const cantidad =
    document.getElementById("cantidad");

const botonRecarga =
    document.getElementById("botonRecarga");

const mensaje =
    document.getElementById("mensaje");


/* =========================================================
   CARGAR PRODUCTOS PUBG MOBILE
   ========================================================= */

async function cargarProductos() {

    cantidad.innerHTML =
        '<option value="">Cargando productos...</option>';

    const { data, error } =
        await supabaseClient
            .from("game_products")
            .select(
                "id, game, product_name, game_currency_amount, price_gvr, active"
            )
            .eq("game", "PUBG Mobile")
            .eq("active", true)
            .order("game_currency_amount", {
                ascending: true
            });

    if (error) {

        console.error(
            "Error cargando productos:",
            error
        );

        cantidad.innerHTML =
            '<option value="">No se pudieron cargar</option>';

        return;
    }

    if (!data || data.length === 0) {

        cantidad.innerHTML =
            '<option value="">No hay productos disponibles</option>';

        return;
    }

    cantidad.innerHTML =
        '<option value="">Selecciona una cantidad</option>';

    data.forEach(producto => {

        const option =
            document.createElement("option");

        option.value =
            producto.product_name;

        option.textContent =
            `${producto.product_name} — ${producto.price_gvr} GVR`;

        cantidad.appendChild(option);

    });

}


/* =========================================================
   CONTINUAR RECARGA
   ========================================================= */

async function continuarRecarga() {

    mensaje.textContent = "";

    const id =
        idJugador.value.trim();

    const productoNombre =
        cantidad.value;

    if (!id) {

        mensaje.textContent =
            "Escribe tu ID de jugador.";

        return;
    }

    if (!productoNombre) {

        mensaje.textContent =
            "Selecciona una cantidad.";

        return;
    }

    botonRecarga.disabled = true;
    botonRecarga.classList.add("cargando");
    botonRecarga.textContent = "Procesando...";


    try {

        /* =====================================================
           VERIFICAR SESIÓN
           ===================================================== */

        const {
            data: {
                session
            }
        } =
            await supabaseClient.auth.getSession();


        if (!session) {

            mensaje.textContent =
                "Debes iniciar sesión para realizar una recarga.";

            return;
        }


        /* =====================================================
           BUSCAR PRODUCTO EXACTO
           ===================================================== */

        const {
            data: producto,
            error: errorProducto
        } =
            await supabaseClient
                .from("game_products")
                .select(
                    "id, game, product_name, price_gvr, active"
                )
                .eq("game", "PUBG Mobile")
                .eq("product_name", productoNombre)
                .eq("active", true)
                .single();


        if (errorProducto || !producto) {

            mensaje.textContent =
                "No se encontró el producto seleccionado.";

            return;
        }


        /* =====================================================
           REALIZAR COMPRA
           ===================================================== */

        const {
            data: resultado,
            error
        } =
            await supabaseClient.rpc(
                "purchase_game_product",
                {
                    p_product_id: producto.id,
                    p_player_id: id
                }
            );


        if (error) {

            console.error(
                "Error en la compra:",
                error
            );

            mensaje.textContent =
                error.message ||
                "No se pudo realizar la compra.";

            return;
        }


        /* =====================================================
           COMPRA EXITOSA
           ===================================================== */

        console.log(
            "Compra realizada:",
            resultado
        );

        window.location.href =
            `confirmar-gvr.html?order=${resultado}`;

    } catch (error) {

        console.error(
            "Error inesperado:",
            error
        );

        mensaje.textContent =
            "Ocurrió un error. Inténtalo nuevamente.";

    } finally {

        botonRecarga.disabled = false;
        botonRecarga.classList.remove("cargando");
        botonRecarga.textContent =
            "Continuar ⚡";

    }

}


/* =========================================================
   INICIAR
   ========================================================= */

cargarProductos();

</script>

</body>
</html>
