<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b18">
    <meta name="description" content="Recarga UC de PUBG Mobile en Gamers Gold Top-Up.">

    <title>PUBG Mobile | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 650px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 21px;
            font-weight: 900;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .volver {
            color: #28a9ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
        }

        .tarjeta {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
        }

        .icono {
            text-align: center;
            font-size: 52px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .etiqueta {
            display: block;
            margin: 18px 0 10px;
            color: #b8c9dc;
            font-size: 13px;
            font-weight: bold;
        }

        input,
        select {
            display: block;
            width: 100%;
            padding: 13px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        select option {
            background: #061226;
            color: white;
        }

        .ayuda {
            margin-top: 7px;
            color: #8299b4;
            font-size: 11px;
            line-height: 1.5;
        }

        .estado {
            padding: 13px;
            margin: 18px 0;
            border: 1px solid #204c78;
            border-radius: 10px;
            background: #061226;
            color: #a9c4df;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-line;
        }

        .estado.error {
            color: #ffaaaa;
            border-color: #843d4b;
        }

        .estado.exito {
            color: #a5ffd0;
            border-color: #21895a;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .producto {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            min-width: 0;
            min-height: 125px;
            padding: 15px 12px;
            background: #061226;
            color: white;
            border: 1px solid #164b75;
            border-radius: 13px;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .producto:hover {
            border-color: #168cff;
        }

        .producto.seleccionado {
            border-color: #00baff;
            box-shadow: 0 0 12px rgba(0, 186, 255, 0.15);
        }

        .producto:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .producto-nombre {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .producto-precio {
            color: #45c8ff;
            font-size: 16px;
            font-weight: bold;
        }

        .separador-ofertas {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #164b8f;
        }

        .boton {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
        }

        .continuar {
            margin-top: 18px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            cursor: pointer;
            opacity: 1;
        }

        .continuar:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .boton-ofertas {
            background: #07152b;
            color: #28a9ff;
            border: 1px solid #168cff;
            cursor: pointer;
        }

        .boton-ofertas:hover {
            background: #0a2345;
            border-color: #38a8ff;
        }

        .nota {
            margin-top: 20px;
            text-align: center;
            color: #8299b4;
            font-size: 11px;
            line-height: 1.6;
        }

        @media (max-width: 380px) {
            body {
                padding: 12px;
            }

            .tarjeta {
                padding: 22px 14px;
            }

            .catalogo {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <header class="header">
        <div class="logo">
            <span class="rayo">⚡</span> Gamers Gold Top-Up
        </div>

        <a href="juegos.html" class="volver">← Juegos</a>
    </header>

    <main class="tarjeta">

        <div class="icono">🎯</div>

        <h1>PUBG Mobile</h1>

        <p class="descripcion">
            Selecciona tu región y el paquete de UC que deseas comprar.
        </p>

        <label class="etiqueta" for="idJugador">
            ID del jugador
        </label>

        <input
            type="text"
            id="idJugador"
            placeholder="Introduce tu ID de PUBG Mobile"
            autocomplete="off"
            maxlength="100"
        >

        <p class="ayuda">
            Comprueba tu ID antes de realizar una recarga.
        </p>

        <label class="etiqueta" for="regionJugador">
            Región de la cuenta
        </label>

        <select id="regionJugador">
            <option value="Global">Global</option>
        </select>

        <label class="etiqueta">
            Selecciona un paquete de UC
        </label>

        <div id="estadoCatalogo" class="estado" aria-live="polite">
            Cargando paquetes...
        </div>

        <div id="catalogo" class="catalogo"></div>

        <button
            id="botonContinuar"
            class="boton continuar"
            type="button"
            disabled
        >
            Selecciona un paquete
        </button>

        <div class="separador-ofertas">
            <button
                class="boton boton-ofertas"
                type="button"
                onclick="abrirOfertas()"
            >
                🎁 Ofertas especiales
            </button>
        </div>

        <p class="nota">
            Revisa el ID del jugador y el precio antes de confirmar tu compra.
        </p>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
        }
    }
);

const catalogo = document.getElementById("catalogo");
const estadoCatalogo = document.getElementById("estadoCatalogo");
const selectorRegion = document.getElementById("regionJugador");
const campoJugador = document.getElementById("idJugador");
const botonContinuar = document.getElementById("botonContinuar");

let productosDisponibles = [];
let productoSeleccionado = null;
let procesandoCompra = false;

/* =====================================================
   NAVEGACIÓN
===================================================== */

function abrirOfertas() {
    window.location.href = "ofertas-pubg.html";
}

/* =====================================================
   MENSAJES
===================================================== */

function mostrarEstado(mensaje, tipo = "") {
    estadoCatalogo.textContent = mensaje;
    estadoCatalogo.classList.remove("error", "exito");

    if (tipo === "error") {
        estadoCatalogo.classList.add("error");
    }

    if (tipo === "exito") {
        estadoCatalogo.classList.add("exito");
    }
}

/* =====================================================
   FORMATO DE PRECIOS
===================================================== */

function formatearGVR(valor) {
    const precio = Number(valor);

    if (!Number.isFinite(precio)) {
        return "Precio no disponible";
    }

    return precio.toLocaleString("es-ES", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }) + " GVR";
}

/* =====================================================
   CARGAR PRODUCTOS DE SUPABASE
===================================================== */

async function cargarCatalogo() {
    productoSeleccionado = null;
    productosDisponibles = [];

    catalogo.replaceChildren();
    botonContinuar.disabled = true;
    botonContinuar.textContent = "Selecciona un paquete";

    mostrarEstado("Cargando paquetes...");

    try {
        const { data, error } = await supabaseClient
            .from("game_products")
            .select(`
                id,
                game,
                product_name,
                game_currency_amount,
                price_gvr,
                active,
                provider,
                provider_product_id,
                provider_region
            `)
            .eq("game", "PUBG Mobile")
            .eq("active", true)
            .eq("provider", "nextlevel")
            .eq("provider_region", "Global")
            .gt("game_currency_amount", 0)
            .order("game_currency_amount", {
                ascending: true
            });

        if (error) {
            console.error("Error cargando paquetes:", error);

            throw new Error(
                "No se pudieron cargar los paquetes. Inténtalo de nuevo."
            );
        }

        productosDisponibles = (data || []).filter(producto => {
            const nombre = String(
                producto.product_name || ""
            );

            const precio = Number(producto.price_gvr);

            return (
                producto.provider_product_id &&
                /\bUC\b/i.test(nombre) &&
                Number.isFinite(precio) &&
                precio > 0
            );
        });

        if (productosDisponibles.length === 0) {
            mostrarEstado(
                "No hay paquetes disponibles en este momento.",
                "error"
            );

            return;
        }

        productosDisponibles.forEach(producto => {
            const tarjeta = document.createElement("button");

            tarjeta.type = "button";
            tarjeta.className = "producto";

            const nombre = document.createElement("div");
            nombre.className = "producto-nombre";
            nombre.textContent = producto.product_name;

            const precio = document.createElement("div");
            precio.className = "producto-precio";
            precio.textContent = formatearGVR(producto.price_gvr);

            tarjeta.append(nombre, precio);

            tarjeta.addEventListener("click", () => {
                seleccionarProducto(producto, tarjeta);
            });

            catalogo.appendChild(tarjeta);
        });

        mostrarEstado(
            productosDisponibles.length +
            " paquetes disponibles."
        );

    } catch (error) {
        console.error("Error en el catálogo:", error);

        catalogo.replaceChildren();

        mostrarEstado(
            error.message || "No se pudo cargar el catálogo.",
            "error"
        );
    }
}

/* =====================================================
   SELECCIONAR PRODUCTO
===================================================== */

function seleccionarProducto(producto, tarjetaSeleccionada) {
    if (procesandoCompra) {
        return;
    }

    productoSeleccionado = producto;

    document.querySelectorAll(".producto").forEach(tarjeta => {
        tarjeta.classList.remove("seleccionado");
    });

    tarjetaSeleccionada.classList.add("seleccionado");

    botonContinuar.disabled = false;
    botonContinuar.textContent =
        "Comprar por " + formatearGVR(producto.price_gvr);

    mostrarEstado(
        producto.product_name +
        " seleccionado. Total: " +
        formatearGVR(producto.price_gvr)
    );
}

/* =====================================================
   INICIAR COMPRA
===================================================== */

async function continuarCompra() {
    if (procesandoCompra) {
        return;
    }

    const playerId = campoJugador.value.trim();

    if (!playerId) {
        mostrarEstado(
            "Introduce el ID de tu jugador.",
            "error"
        );

        campoJugador.focus();
        return;
    }

    if (playerId.length > 100) {
        mostrarEstado(
            "El ID del jugador no es válido.",
            "error"
        );

        return;
    }

    if (!productoSeleccionado) {
        mostrarEstado(
            "Selecciona un paquete antes de continuar.",
            "error"
        );

        return;
    }

    const { data: sessionData, error: sessionError } =
        await supabaseClient.auth.getSession();

    const session = sessionData?.session;

    if (sessionError || !session) {
        window.location.href = "login.html";
        return;
    }

    procesandoCompra = true;
    botonContinuar.disabled = true;
    botonContinuar.textContent = "Procesando compra...";

    mostrarEstado("Registrando tu pedido...");

    let gameOrderId = null;

    try {
        /*
         * PASO 1:
         * Crear el pedido local y descontar el saldo GVR.
         *
         * El servidor comprueba el precio, el producto y
         * el saldo. El precio enviado por el navegador no
         * se utiliza para calcular el cobro.
         */

        const { data: orderId, error: purchaseError } =
            await supabaseClient.rpc(
                "purchase_game_product",
                {
                    p_product_id: productoSeleccionado.id,
                    p_player_id: playerId,
                    p_zone_id: null
                }
            );

        if (purchaseError) {
            console.error(
                "Error registrando la compra:",
                purchaseError
            );

            if (
                purchaseError.message &&
                purchaseError.message.toLowerCase().includes("iniciar sesión")
            ) {
                window.location.href = "login.html";
                return;
            }

            throw new Error(
                purchaseError.message ||
                "No se pudo registrar el pedido."
            );
        }

        if (!orderId) {
            throw new Error(
                "No se recibió el identificador del pedido."
            );
        }

        gameOrderId = orderId;

        /*
         * PASO 2:
         * Enviar el pedido ya creado a la función de pedidos.
         *
         * Si esta llamada falla después de crear el pedido
         * local, no se vuelve a ejecutar la compra.
         */

        mostrarEstado("Enviando tu pedido...");

        const { data: resultado, error: envioError } =
            await supabaseClient.functions.invoke(
                "nextlevel-crear-pedido",
                {
                    body: {
                        game_order_id: gameOrderId
                    },
                    headers: {
                        Authorization:
                            "Bearer " + session.access_token
                    }
                }
            );

        if (envioError) {
            console.error(
                "Error enviando el pedido:",
                envioError
            );

            mostrarEstado(
                "Tu pedido quedó registrado con el número:\n" +
                gameOrderId +
                "\n\nNo se pudo confirmar el envío. No repitas la compra. " +
                "Conserva este número para revisar el estado del pedido.",
                "error"
            );

            botonContinuar.textContent = "Pedido pendiente de revisión";

            return;
        }

        if (!resultado || resultado.success !== true) {
            console.error(
                "Respuesta inesperada del pedido:",
                resultado
            );

            mostrarEstado(
                "Tu pedido quedó registrado con el número:\n" +
                gameOrderId +
                "\n\nNo se confirmó el envío. No repitas la compra. " +
                "Conserva este número para revisar el estado.",
                "error"
            );

            botonContinuar.textContent = "Pedido pendiente de revisión";

            return;
        }

        /*
         * PASO 3:
         * Mostrar confirmación sin afirmar que la recarga
         * ya se completó.
         */

        mostrarEstado(
            "¡Pedido enviado correctamente!\n\n" +
            "Paquete: " + productoSeleccionado.product_name + "\n" +
            "Precio: " + formatearGVR(productoSeleccionado.price_gvr) + "\n" +
            "ID del jugador: " + playerId + "\n" +
            "Número de pedido: " + gameOrderId + "\n\n" +
            "El pedido está registrado. La recarga puede tardar unos momentos en completarse.",
            "exito"
        );

        botonContinuar.textContent = "Pedido registrado";

    } catch (error) {
        console.error("Error durante la compra:", error);

        if (gameOrderId) {
            /*
             * El pedido local ya existe. No repetir RPC ni
             * intentar crear una segunda compra.
             */

            mostrarEstado(
                "El pedido quedó registrado con el número:\n" +
                gameOrderId +
                "\n\nNo repitas la compra. Revisa el estado del pedido antes de intentar otra operación.",
                "error"
            );

            botonContinuar.textContent = "Pedido pendiente de revisión";

        } else {
            mostrarEstado(
                error.message ||
                "No se pudo completar la operación.",
                "error"
            );

            botonContinuar.disabled = false;
            botonContinuar.textContent = productoSeleccionado
                ? "Comprar por " + formatearGVR(productoSeleccionado.price_gvr)
                : "Selecciona un paquete";
        }

    } finally {
        procesandoCompra = false;
    }
}

/* =====================================================
   EVENTOS
===================================================== */

botonContinuar.addEventListener("click", continuarCompra);

/* =====================================================
   INICIALIZAR
===================================================== */

cargarCatalogo();
</script>

</body>
</html>
