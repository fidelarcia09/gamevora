<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de Ventas | Gamevora</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at top, #102b55 0%, #06101f 45%, #02060d 100%);
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            border-bottom: 1px solid rgba(0, 174, 255, 0.25);
            background: rgba(2, 8, 18, 0.9);
        }

        .header-contenido {
            max-width: 1200px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #00aaff;
            text-shadow: 0 0 15px rgba(0, 170, 255, 0.7);
        }

        .volver {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 10px;
            background: rgba(0, 130, 255, 0.15);
            border: 1px solid rgba(0, 170, 255, 0.3);
        }

        .contenedor {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .titulo {
            margin-bottom: 25px;
        }

        .titulo h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .titulo p {
            color: #9eb3ca;
        }

        .estadisticas {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: rgba(8, 24, 45, 0.9);
            border: 1px solid rgba(0, 170, 255, 0.25);
            border-radius: 15px;
            padding: 20px;
        }

        .stat span {
            display: block;
            color: #9eb3ca;
            margin-bottom: 8px;
        }

        .stat strong {
            font-size: 28px;
            color: #00b7ff;
        }

        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filtro {
            border: 1px solid rgba(0, 170, 255, 0.3);
            background: rgba(7, 25, 48, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        .filtro.activo {
            background: #0077ff;
            border-color: #00b7ff;
        }

        .ventas {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .venta {
            background: rgba(7, 20, 38, 0.95);
            border: 1px solid rgba(0, 170, 255, 0.25);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.06);
        }

        .venta-cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .tipo {
            font-weight: bold;
            color: #00b7ff;
            font-size: 18px;
        }

        .estado {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .estado-pendiente {
            background: rgba(255, 190, 0, 0.15);
            color: #ffd000;
        }

        .estado-procesando {
            background: rgba(0, 150, 255, 0.15);
            color: #00aaff;
        }

        .estado-completado {
            background: rgba(0, 255, 130, 0.12);
            color: #00ff91;
        }

        .estado-cancelado,
        .estado-error {
            background: rgba(255, 50, 50, 0.12);
            color: #ff5555;
        }

        .datos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .dato {
            background: rgba(0, 0, 0, 0.18);
            padding: 10px;
            border-radius: 9px;
        }

        .dato small {
            display: block;
            color: #7990a8;
            margin-bottom: 4px;
        }

        .dato div {
            word-break: break-word;
        }

        .vacio {
            text-align: center;
            padding: 50px 20px;
            color: #8da3ba;
            background: rgba(7, 20, 38, 0.8);
            border-radius: 15px;
            border: 1px solid rgba(0, 170, 255, 0.15);
        }

        #error {
            display: none;
            white-space: pre-wrap;
            word-break: break-word;
            background: rgba(120, 0, 0, 0.2);
            border: 1px solid #ff4040;
            color: #ff8080;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 800px) {
            .estadisticas {
                grid-template-columns: repeat(2, 1fr);
            }

            .datos {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {
            .estadisticas {
                grid-template-columns: 1fr 1fr;
            }

            .stat strong {
                font-size: 22px;
            }

            .venta-cabecera {
                align-items: flex-start;
                flex-direction: column;
            }

            .titulo h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-contenido">

        <div class="logo">
            GAMEVORA
        </div>

        <a href="cuenta.html" class="volver">
            ← Mi cuenta
        </a>

    </div>
</header>

<main class="contenedor">

    <div class="titulo">
        <h1>🛒 Panel de ventas</h1>
        <p>Control de compras GVR y recargas de juegos</p>
    </div>

    <div id="error"></div>

    <section class="estadisticas">

        <div class="stat">
            <span>Ventas totales</span>
            <strong id="totalVentas">0</strong>
        </div>

        <div class="stat">
            <span>Pendientes</span>
            <strong id="ventasPendientes">0</strong>
        </div>

        <div class="stat">
            <span>Completadas</span>
            <strong id="ventasCompletadas">0</strong>
        </div>

        <div class="stat">
            <span>GVR vendidos</span>
            <strong id="gvrVendidos">0</strong>
        </div>

    </section>

    <div class="filtros">

        <button class="filtro activo" data-filtro="todas">
            Todas
        </button>

        <button class="filtro" data-filtro="gvr">
            💎 GVR
        </button>

        <button class="filtro" data-filtro="recarga">
            🎮 Recargas
        </button>

        <button class="filtro" data-filtro="pendiente">
            🟡 Pendientes
        </button>

        <button class="filtro" data-filtro="completado">
            🟢 Completadas
        </button>

    </div>

    <section id="listaVentas" class="ventas">

        <div class="vacio">
            Cargando ventas...
        </div>

    </section>

</main>

<script>

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const VAPID_PUBLIC_KEY =
    "BOTEc5uNWGMOVSZicoL3lqSEgQZdcOgQMiZF_JKbk-Yg9dmtU9Yp2yEuONOl3Y3IU42K0DevmR8vmSTCkpq69Ig";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let todasLasVentas = [];

let filtroActual = "todas";


// ================================
// MOSTRAR ERROR
// ================================

function mostrarError(mensaje) {

    const errorBox =
        document.getElementById("error");

    errorBox.textContent = mensaje;

    errorBox.style.display = "block";

}


// ================================
// CONVERTIR VAPID PUBLIC KEY
// ================================

function convertirBase64UrlAUint8Array(base64UrlData) {

    const padding =
        "=".repeat(
            (4 - base64UrlData.length % 4) % 4
        );

    const base64 =
        (
            base64UrlData +
            padding
        )
        .replace(/-/g, "+")
        .replace(/_/g, "/");

    const rawData =
        window.atob(base64);

    return Uint8Array.from(
        [...rawData].map(
            char => char.charCodeAt(0)
        )
    );
}


// ================================
// NOTIFICACIONES PUSH
// ================================

async function registrarNotificacionesPush() {

    try {

        if (!("serviceWorker" in navigator)) {

            console.log(
                "Service Worker no disponible"
            );

            return;
        }


        if (!("PushManager" in window)) {

            console.log(
                "Push Notifications no disponibles"
            );

            return;
        }


        const registro =
            await navigator.serviceWorker.register(
                "service-worker.js"
            );


        console.log(
            "Service Worker registrado:",
            registro.scope
        );


        const permiso =
            await Notification.requestPermission();


        if (permiso !== "granted") {

            console.log(
                "Permiso de notificaciones no concedido"
            );

            return;
        }


        console.log(
            "Permiso de notificaciones concedido"
        );


        let suscripcion =
            await registro.pushManager.getSubscription();


        // Si no existe, crearla
        if (!suscripcion) {

            suscripcion =
                await registro.pushManager.subscribe({

                    userVisibleOnly: true,

                    applicationServerKey:
                        convertirBase64UrlAUint8Array(
                            VAPID_PUBLIC_KEY
                        )

                });

        }


        console.log(
            "Suscripción Push:",
            suscripcion
        );


        const {
            data: { user },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            console.error(
                "No se pudo obtener el usuario:",
                userError
            );

            return;
        }


        const datosSuscripcion =
            suscripcion.toJSON();


        if (
            !datosSuscripcion.endpoint ||
            !datosSuscripcion.keys ||
            !datosSuscripcion.keys.p256dh ||
            !datosSuscripcion.keys.auth
        ) {

            throw new Error(
                "La suscripción Push no contiene los datos necesarios."
            );

        }


        const {
            error: guardarError
        } =
            await supabaseClient
                .from("admin_push_subscriptions")
                .upsert(
                    {
                        user_id: user.id,
                        endpoint:
                            datosSuscripcion.endpoint,
                        p256dh:
                            datosSuscripcion.keys.p256dh,
                        auth:
                            datosSuscripcion.keys.auth,
                        updated_at:
                            new Date().toISOString()
                    },
                    {
                        onConflict: "endpoint"
                    }
                );


        if (guardarError) {

            throw guardarError;

        }


        console.log(
            "✅ Dispositivo administrador registrado para Push."
        );

    } catch (error) {

        console.error(
            "Error configurando notificaciones:",
            error
        );

        mostrarError(
            "No se pudo configurar el dispositivo para notificaciones Push.\n\n" +
            error.message
        );

    }

}


// ================================
// COMPROBAR ADMIN
// ================================

async function comprobarAdministrador() {

    const {
        data: { user },
        error: authError
    } =
        await supabaseClient.auth.getUser();


    if (authError) {

        mostrarError(
            "ERROR DE AUTENTICACIÓN:\n" +
            authError.message
        );

        return false;
    }


    if (!user) {

        window.location.href = "index.html";

        return false;
    }


    const {
        data,
        error
    } =
        await supabaseClient.rpc(
            "is_support_admin"
        );


    if (error) {

        mostrarError(
            "ERROR AL COMPROBAR ADMIN:\n\n" +
            "Mensaje: " +
            error.message +
            "\n" +
            "Código: " +
            error.code +
            "\n" +
            "Detalles: " +
            error.details +
            "\n" +
            "Ayuda: " +
            error.hint
        );

        console.error(
            "Error is_support_admin:",
            error
        );

        return false;
    }


    if (data !== true) {

        window.location.href = "cuenta.html";

        return false;
    }


    return true;
}


// ================================
// CARGAR VENTAS
// ================================

async function cargarVentas() {

    const lista =
        document.getElementById(
            "listaVentas"
        );


    lista.innerHTML = `
        <div class="vacio">
            Cargando ventas...
        </div>
    `;


    const {
        data,
        error
    } =
        await supabaseClient
            .from("ventas")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        mostrarError(
            "ERROR SUPABASE AL CARGAR VENTAS:\n\n" +

            "Mensaje: " +
            error.message +

            "\n\nCódigo: " +
            error.code +

            "\n\nDetalles: " +
            error.details +

            "\n\nAyuda: " +
            error.hint
        );


        console.error(
            "Error completo de Supabase:",
            error
        );


        lista.innerHTML = `
            <div class="vacio">
                No se pudieron cargar las ventas.
                <br><br>
                Revisa el mensaje de error de arriba.
            </div>
        `;

        return;
    }


    todasLasVentas =
        data || [];


    actualizarEstadisticas();

    mostrarVentas();

}


// ================================
// ESTADÍSTICAS
// ================================

function actualizarEstadisticas() {

    const total =
        todasLasVentas.length;


    const pendientes =
        todasLasVentas.filter(
            venta =>
                venta.estado === "pendiente"
        ).length;


    const completadas =
        todasLasVentas.filter(
            venta =>
                venta.estado === "completado"
        ).length;


    const gvrVendidos =
        todasLasVentas.reduce(
            (total, venta) =>
                total +
                (Number(
                    venta.gvr_comprado
                ) || 0),
            0
        );


    document.getElementById(
        "totalVentas"
    ).textContent = total;


    document.getElementById(
        "ventasPendientes"
    ).textContent = pendientes;


    document.getElementById(
        "ventasCompletadas"
    ).textContent = completadas;


    document.getElementById(
        "gvrVendidos"
    ).textContent =
        gvrVendidos;

}


// ================================
// ESCAPAR HTML
// ================================

function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "—";

    }


    return String(valor)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ================================
// MOSTRAR VENTAS
// ================================

function mostrarVentas() {

    const lista =
        document.getElementById(
            "listaVentas"
        );


    let ventasFiltradas =
        [...todasLasVentas];


    if (filtroActual === "gvr") {

        ventasFiltradas =
            ventasFiltradas.filter(
                venta =>
                    venta.tipo === "gvr"
            );

    }


    if (filtroActual === "recarga") {

        ventasFiltradas =
            ventasFiltradas.filter(
                venta =>
                    venta.tipo === "recarga"
            );

    }


    if (filtroActual === "pendiente") {

        ventasFiltradas =
            ventasFiltradas.filter(
                venta =>
                    venta.estado === "pendiente"
            );

    }


    if (filtroActual === "completado") {

        ventasFiltradas =
            ventasFiltradas.filter(
                venta =>
                    venta.estado === "completado"
            );

    }


    if (ventasFiltradas.length === 0) {

        lista.innerHTML = `
            <div class="vacio">
                No hay ventas para mostrar.
            </div>
        `;

        return;
    }


    lista.innerHTML =
        ventasFiltradas
            .map(
                venta =>
                    crearVentaHTML(
                        venta
                    )
            )
            .join("");

}


// ================================
// CREAR VENTA
// ================================

function crearVentaHTML(venta) {

    const tipoTexto =
        venta.tipo === "gvr"
            ? "💎 Compra de GVR"
            : "🎮 Recarga de juego";


    const claseEstado =
        "estado-" +
        escaparHTML(
            venta.estado
        );


    let fecha = "—";


    if (venta.created_at) {

        fecha =
            new Date(
                venta.created_at
            ).toLocaleString(
                "es-ES",
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

    }


    return `
        <article class="venta">

            <div class="venta-cabecera">

                <div class="tipo">
                    ${tipoTexto}
                </div>

                <div class="estado ${claseEstado}">
                    ${escaparHTML(
                        venta.estado
                    )}
                </div>

            </div>

            <div class="datos">

                <div class="dato">
                    <small>Usuario</small>
                    <div>
                        ${escaparHTML(
                            venta.nombre_usuario
                        )}
                    </div>
                </div>

                <div class="dato">
                    <small>Correo</small>
                    <div>
                        ${escaparHTML(
                            venta.correo_usuario
                        )}
                    </div>
                </div>

                <div class="dato">
                    <small>ID de usuario</small>
                    <div>
                        ${escaparHTML(
                            venta.usuario_id
                        )}
                    </div>
                </div>

                ${
                    venta.juego
                    ?
                    `
                    <div class="dato">
                        <small>Juego</small>
                        <div>
                            ${escaparHTML(
                                venta.juego
                            )}
                        </div>
                    </div>
                    `
                    :
                    ""
                }

                ${
                    venta.id_jugador
                    ?
                    `
                    <div class="dato">
                        <small>ID del jugador</small>
                        <div>
                            ${escaparHTML(
                                venta.id_jugador
                            )}
                        </div>
                    </div>
                    `
                    :
                    ""
                }

                ${
                    venta.producto
                    ?
                    `
                    <div class="dato">
                        <small>Producto</small>
                        <div>
                            ${escaparHTML(
                                venta.producto
                            )}
                        </div>
                    </div>
                    `
                    :
                    ""
                }

                ${
                    venta.cantidad !== null &&
                    venta.cantidad !== undefined
                    ?
                    `
                    <div class="dato">
                        <small>Cantidad</small>
                        <div>
                            ${escaparHTML(
                                venta.cantidad
                            )}
                        </div>
                    </div>
                    `
                    :
                    ""
                }

                ${
                    venta.gvr_comprado
                    ?
                    `
                    <div class="dato">
                        <small>GVR comprado</small>
                        <div>
                            💎 ${escaparHTML(
                                venta.gvr_comprado
                            )} GVR
                        </div>
                    </div>
                    `
                    :
                    ""
                }

                <div class="dato">
                    <small>Precio</small>
                    <div>
                        ${escaparHTML(
                            venta.precio
                        )}
                        ${escaparHTML(
                            venta.moneda
                        )}
                    </div>
                </div>

                <div class="dato">
                    <small>Método de pago</small>
                    <div>
                        ${escaparHTML(
                            venta.metodo_pago
                        )}
                    </div>
                </div>

                <div class="dato">
                    <small>Proveedor</small>
                    <div>
                        ${escaparHTML(
                            venta.proveedor
                        )}
                    </div>
                </div>

                <div class="dato">
                    <small>ID orden proveedor</small>
                    <div>
                        ${escaparHTML(
                            venta.id_orden_proveedor
                        )}
                    </div>
                </div>

                <div class="dato">
                    <small>Fecha</small>
                    <div>
                        ${escaparHTML(
                            fecha
                        )}
                    </div>
                </div>

            </div>

        </article>
    `;

}


// ================================
// FILTROS
// ================================

document
    .querySelectorAll(".filtro")
    .forEach(
        boton => {

            boton.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".filtro"
                        )
                        .forEach(
                            b =>
                                b.classList.remove(
                                    "activo"
                                )
                        );


                    boton.classList.add(
                        "activo"
                    );


                    filtroActual =
                        boton.dataset.filtro;


                    mostrarVentas();

                }
            );

        }
    );


// ================================
// INICIO
// ================================

async function iniciar() {

    const esAdmin =
        await comprobarAdministrador();


    if (!esAdmin) {

        return;

    }


    await cargarVentas();

    await registrarNotificacionesPush();

}


iniciar();

</script>

</body>
</html>
