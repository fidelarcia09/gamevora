<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Confirmar pedido | Gamers Gold Top-Up</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #08152d;
            border-bottom: 1px solid #123b70;
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 10px #008cff;
        }

        .volver {
            color: #28a9ff;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            padding: 25px 18px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
            background: #091a35;
            border: 1px solid #173e68;
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.12);
        }

        .icono {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .version-prueba {
            text-align: center;
            color: #00b7ff;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .descripcion {
            text-align: center;
            color: #8195ad;
            margin-bottom: 25px;
        }

        .dato {
            background: #061226;
            border: 1px solid #173e68;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .dato span {
            display: block;
            color: #8195ad;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .dato strong {
            font-size: 17px;
        }

        .total {
            margin-top: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid #168cff;
            border-radius: 14px;
            background: #0b2850;
        }

        .total span {
            display: block;
            color: #8fcfff;
            margin-bottom: 8px;
        }

        .total strong {
            font-size: 25px;
        }

        .confirmar {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .confirmar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .nota {
            text-align: center;
            color: #627b97;
            font-size: 11px;
            line-height: 1.5;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <span class="rayo">⚡</span> Gamers Gold Top-Up
    </div>

    <a href="javascript:history.back()" class="volver">
        ← Volver
    </a>

</header>

<main>

    <div class="contenedor">

        <div class="icono">🧾</div>

        <h1>Confirmar pedido</h1>

        <p class="version-prueba">
            🧪 VERSIÓN NUEVA DE PRUEBA
        </p>

        <p class="descripcion">
            Revisa tu pedido antes de confirmarlo.
        </p>

        <div class="dato">
            <span>Juego</span>
            <strong>Free Fire 🔥</strong>
        </div>

        <div class="dato">
            <span>ID del jugador</span>
            <strong id="mostrarId">Cargando...</strong>
        </div>

        <div class="dato">
            <span>Cantidad</span>
            <strong id="mostrarCantidad">Cargando...</strong>
        </div>

        <div class="total">
            <span>Total a pagar</span>
            <strong>Precio en GVR próximamente</strong>
        </div>

        <button
            class="confirmar"
            id="botonConfirmar"
            type="button"
            onclick="confirmarPedido()"
        >
            Confirmar pedido ⚡
        </button>

    </div>

</main>

<script>

// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


// ==========================================
// PARÁMETROS DEL PEDIDO
// ==========================================

const parametros =
    new URLSearchParams(
        window.location.search
    );

const id =
    parametros.get("id");

const cantidad =
    parametros.get("cantidad");


// ==========================================
// MOSTRAR DATOS
// ==========================================

document.getElementById(
    "mostrarId"
).textContent =
    id || "No especificado";

document.getElementById(
    "mostrarCantidad"
).textContent =
    cantidad || "No especificada";


// ==========================================
// CONFIRMAR PEDIDO
// ==========================================

async function confirmarPedido() {

    if (!id || !cantidad) {

        alert(
            "Faltan datos del pedido."
        );

        return;
    }


    const boton =
        document.getElementById(
            "botonConfirmar"
        );


    boton.disabled = true;

    boton.textContent =
        "Registrando pedido...";


    // ======================================
    // COMPROBAR SESIÓN
    // ======================================

    const {
        data: sessionData,
        error: sessionError
    } =
        await supabaseClient.auth.getSession();


    if (
        sessionError ||
        !sessionData?.session
    ) {

        console.error(
            "Error de sesión:",
            sessionError
        );

        boton.disabled = false;

        boton.textContent =
            "Confirmar pedido ⚡";

        alert(
            "Debes iniciar sesión para realizar este pedido."
        );

        return;
    }


    // ======================================
    // OBTENER USUARIO
    // ======================================

    const {
        data: userData,
        error: userError
    } =
        await supabaseClient.auth.getUser();


    const user =
        userData?.user;


    if (
        userError ||
        !user
    ) {

        console.error(
            "Error obteniendo usuario:",
            userError
        );

        boton.disabled = false;

        boton.textContent =
            "Confirmar pedido ⚡";

        alert(
            "No se pudo verificar tu usuario."
        );

        return;
    }


    // ======================================
    // DATOS DE LA VENTA
    // ======================================

    const datosVenta = {

        tipo:
            "recarga",

        usuario_id:
            user.id,

        nombre_usuario:
            user.user_metadata?.username ||
            user.user_metadata?.nombre ||
            user.email?.split("@")[0] ||
            "Usuario",

        correo_usuario:
            user.email,

        juego:
            "Free Fire",

        id_jugador:
            id,

        producto:
            cantidad,

        cantidad:
            Number(cantidad) || null,

        gvr_comprado:
            null,

        precio:
            null,

        moneda:
            "GVR",

        metodo_pago:
            "GVR",

        estado:
            "pendiente"
    };


    console.log(
        "DATOS DE VENTA:",
        datosVenta
    );


    // ======================================
    // GUARDAR EN VENTAS
    // ======================================

    const {
        data: ventaData,
        error: ventaError
    } =
        await supabaseClient
            .from("ventas")
            .insert(datosVenta)
            .select();


    // ======================================
    // ERROR
    // ======================================

    if (ventaError) {

        console.error(
            "ERROR SUPABASE:",
            ventaError
        );

        boton.disabled = false;

        boton.textContent =
            "Confirmar pedido ⚡";

        alert(
            "NO SE PUDO REGISTRAR LA VENTA\n\n" +
            "Mensaje: " +
            (ventaError.message || "Sin mensaje") +
            "\n\nCódigo: " +
            (ventaError.code || "Sin código") +
            "\n\nDetalles: " +
            (ventaError.details || "Sin detalles")
        );

        return;
    }


    // ======================================
    // COMPROBAR QUE SUPABASE DEVOLVIÓ DATOS
    // ======================================

    console.log(
        "VENTA REGISTRADA:",
        ventaData
    );


    if (
        !ventaData ||
        ventaData.length === 0
    ) {

        boton.disabled = false;

        boton.textContent =
            "Confirmar pedido ⚡";

        alert(
            "El pedido fue procesado, pero Supabase no devolvió la venta registrada."
        );

        return;
    }


    // ======================================
    // ÉXITO
    // ======================================

    alert(
        "✅ PEDIDO REGISTRADO\n\n" +
        "La venta fue guardada en Gamevora.\n\n" +
        "Estado: Pendiente"
    );


    // ======================================
    // IR AL RESULTADO
    // ======================================

    const url =
        "pedido-realizado.html?id=" +
        encodeURIComponent(id) +
        "&cantidad=" +
        encodeURIComponent(cantidad);

    window.location.href =
        url;
}

</script>

</body>
</html>
