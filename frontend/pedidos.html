<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050b18">
  <title>Pedidos | Gamers Gold Top-Up</title>
  <style>
  :root{
    color-scheme:dark;
    --fondo:#050b18;
    --panel:#0a1b35;
    --panel2:#071329;
    --panel3:#0b203b;
    --texto:#f4f8ff;
    --suave:#91a5bf;
    --cian:#00baff;
    --azul:#087cff;
    --borde:#173b64;
    --borde-suave:rgba(105,158,215,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
  body{min-height:100vh;background:radial-gradient(ellipse at 50% -15%,rgba(0,140,255,.13),transparent 48%),var(--fondo);color:var(--texto);padding:22px 16px 120px}
  .contenedor{width:100%;max-width:680px;margin:0 auto;padding:0 4px}
  .header{display:flex;align-items:center;gap:14px;margin:2px 0 22px}
  .boton-atras{display:inline-flex;align-items:center;gap:9px;color:#d9eaff;text-decoration:none;font-size:14px;font-weight:800}
  .icono-atras{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #17649a;border-radius:13px;background:linear-gradient(145deg,#0b2444,#061226);color:var(--cian);box-shadow:0 0 14px rgba(0,140,255,.12)}
  .icono-atras svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .boton-atras:focus-visible,.filtro:focus-visible,.pedido summary:focus-visible{outline:2px solid #75d7ff;outline-offset:3px}
  .encabezado{margin:0 0 18px}
  h1{font-size:clamp(27px,6vw,34px);line-height:1.12;letter-spacing:-.9px;margin-bottom:7px;color:#fff;font-weight:900}
  .descripcion{color:#91a5bf;font-size:13px;line-height:1.55}
  .resumen-estadisticas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:17px 8px;margin:0 0 22px;background:linear-gradient(145deg,#0b203b,#071329);border:1px solid #173b64;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,.2),0 0 18px rgba(0,140,255,.07)}
  .estadistica{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;padding:2px 5px;text-align:center}
  .estadistica+.estadistica{border-left:1px solid #17314f}
  .estadistica-icono{width:25px;height:25px;color:var(--cian);filter:drop-shadow(0 0 7px rgba(0,186,255,.35))}
  .estadistica-icono svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .estadistica-numero{font-size:27px;line-height:1;font-weight:900;letter-spacing:-.7px;color:#fff;font-variant-numeric:tabular-nums}
  .estadistica-etiqueta{font-size:12px;color:#91a5bf;font-weight:600}
  .filtros{display:flex;gap:9px;overflow-x:auto;padding:2px 0 10px;margin-bottom:14px;scrollbar-width:thin;scrollbar-color:#185a8d transparent}
  .filtro{display:inline-flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto;border:1px solid #173b64;border-radius:999px;background:linear-gradient(145deg,#0a1b35,#071329);color:#b8cbe0;padding:10px 15px;font-size:13px;font-weight:750;cursor:pointer;transition:background .18s,color .18s,border-color .18s,box-shadow .18s}
  .filtro:hover{border-color:#28a9ff;color:#fff;box-shadow:0 0 12px rgba(0,140,255,.12)}
  .filtro.activo{background:linear-gradient(110deg,#087cff,#00baff);border-color:#35caff;color:#fff;box-shadow:0 0 15px rgba(0,140,255,.28)}
  .filtro-cantidad{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:rgba(0,186,255,.15);border:1px solid rgba(0,186,255,.2);color:#80dfff;font-size:11px;font-weight:900}
  .filtro.activo .filtro-cantidad{background:rgba(5,11,24,.2);border-color:rgba(255,255,255,.22);color:#fff}
  .lista{display:flex;flex-direction:column;gap:17px;padding:0 1px}
  .grupo-fecha{overflow:hidden;background:linear-gradient(155deg,#0b192d,#07101e);border:1px solid rgba(105,158,215,.2);border-radius:18px;box-shadow:0 10px 28px rgba(0,0,0,.2)}
  .grupo-fecha-cabecera{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #17314f;background:linear-gradient(110deg,#0d2340,#08172c)}
  .grupo-fecha-titulo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:900;color:#f4f8ff}
  .grupo-fecha-titulo:before{content:"";width:5px;height:27px;border-radius:8px;background:linear-gradient(180deg,#00d0ff,#087cff);box-shadow:0 0 12px rgba(0,186,255,.5)}
  .grupo-fecha-cantidad{padding:6px 11px;border-radius:99px;background:rgba(0,153,255,.12);border:1px solid rgba(0,153,255,.22);color:#83cfff;font-size:11px;font-weight:850;white-space:nowrap}
  .grupo-pedidos{display:flex;flex-direction:column}
  .pedido{position:relative;padding:14px 15px;background:linear-gradient(155deg,#0a1b32,#071326);overflow-wrap:anywhere}
  .pedido+.pedido{border-top:1px solid #17314f}
  .pedido summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;min-height:58px}
  .pedido summary::-webkit-details-marker{display:none}
  .icono-juego{width:58px;height:58px;flex:0 0 58px;border-radius:14px;background:linear-gradient(145deg,#0b315a,#071a32);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--cian);border:1px solid #185a8d;box-shadow:0 0 12px rgba(0,140,255,.1)}
  .icono-juego img{display:block;width:100%;height:100%;object-fit:cover}
  .icono-juego svg{width:44px;height:37px}
  .pedido-centro{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .pedido-titulo{font-size:14px;font-weight:850;line-height:1.35;color:#f4f8ff;overflow:hidden;text-overflow:ellipsis}
  .pedido-subtitulo{font-size:11px;line-height:1.35;color:#91a5bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pedido-meta{font-size:10px;line-height:1.4;color:#7188a5;overflow-wrap:anywhere}
  .pedido-derecha{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:7px;flex:0 0 auto;max-width:42%}
  .pedido-precio{font-size:15px;font-weight:900;letter-spacing:-.25px;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
  .estado-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;background:rgba(57,221,160,.12);border:1px solid rgba(57,221,160,.22);color:#39dda0;font-size:10px;font-weight:850;white-space:nowrap}
  .estado-chip:before{content:"";width:7px;height:7px;border:1.7px solid currentColor;border-radius:50%;display:inline-block}
  .estado-chip.pendiente{background:rgba(255,190,70,.12);border-color:rgba(255,190,70,.25);color:#ffd477}
  .estado-chip.revision{background:rgba(255,160,70,.12);border-color:rgba(255,160,70,.25);color:#ffbd78}
  .estado-chip.error{background:rgba(255,100,100,.12);border-color:rgba(255,100,100,.22);color:#ff8585}
  .flecha{width:17px;height:17px;flex:0 0 17px;color:#7f9ab8;transition:transform .2s}
  details[open] .flecha{transform:rotate(180deg);color:var(--cian)}
  .detalles{padding:13px 2px 2px 70px;color:#91a5bf;font-size:12px;line-height:1.75;border-top:1px solid #17314f;margin-top:13px}
  .detalle-fila{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding:4px 0}
  .detalle-etiqueta{color:#7188a5;flex:0 0 auto}
  .detalle-valor{text-align:right;color:#d9eaff;overflow-wrap:anywhere}
  .estado{font-weight:850;color:#39dda0}
  .estado.pendiente{color:#ffd477}
  .estado.revision{color:#ffbd78}
  .estado.error{color:#ff8585}
  .vacio{padding:26px 5px;color:#91a5bf;font-size:13px;line-height:1.6;text-align:center}
  .vacio.error{color:#ff8585}
  .boton-reintentar{margin-top:14px;border:1px solid #185a8d;border-radius:11px;background:linear-gradient(135deg,#0a2343,#0b315a);color:#8bdcff;padding:10px 15px;font-weight:800;cursor:pointer}
  .nota{margin-top:18px;color:#7188a5;font-size:10px;line-height:1.6;text-align:center}
  [hidden]{display:none!important}
  @media(max-width:520px){
    body{padding:17px 12px 118px}.contenedor{padding:0}.header{margin-bottom:19px}
    .resumen-estadisticas{padding:14px 5px;margin-bottom:18px;border-radius:18px}
    .estadistica-numero{font-size:25px}.estadistica-etiqueta{font-size:11px}
    .filtro{padding:9px 12px;font-size:12px}
    .lista{gap:14px}.grupo-fecha{border-radius:16px}
    .grupo-fecha-cabecera{padding:12px 13px}.grupo-fecha-titulo{font-size:15px}
    .pedido{padding:12px 10px}.pedido summary{gap:9px}
    .icono-juego{width:49px;height:49px;flex-basis:49px;border-radius:12px}
    .pedido-titulo{font-size:12px}.pedido-subtitulo{font-size:10px}
    .pedido-precio{font-size:13px}.pedido-derecha{gap:6px;max-width:39%}
    .estado-chip{font-size:9px;padding:4px 7px}.flecha{width:15px;flex-basis:15px}
    .detalles{padding-left:0}.detalle-fila{gap:9px}
  }
  @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
</style>

  <script>
  "use strict";

  const supabaseClient = window.supabase.createClient(
    "https://gsuhzcavghsiolmipnzi.supabase.co",
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx"
  );

  const listaPedidos = document.getElementById("listaPedidos");
  const estadoCarga = document.getElementById("estadoCarga");
  const botonesFiltro = [...document.querySelectorAll(".filtro")];
  let historialCompleto = [];
  let filtroActual = "todos";

  function escaparHTML(valor) {
    return String(valor ?? "").replace(/[&<>"']/g, caracter => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    })[caracter]);
  }

  function fechaLegible(fecha) {
    if (!fecha) return "No disponible";
    const convertida = new Date(fecha);
    return Number.isNaN(convertida.getTime()) ? "No disponible" : convertida.toLocaleString("es-ES");
  }

  // Código público para mostrar pedidos. El UUID original sigue intacto
  // para las consultas y relaciones con Supabase.
  function codigoPedidoVisible(id) {
    const limpio = String(id ?? "").replaceAll("-", "").toUpperCase();
    return limpio ? "GT-" + limpio.slice(0, 8) : "No disponible";
  }

  function normalizarEstado(estado) {
    return String(estado ?? "pending").trim().toLowerCase();
  }

  function traducirEstado(estado) {
    const clave = normalizarEstado(estado);
    const estados = {
      pending:"Pendiente", processing:"Procesando", completed:"Completado",
      failed:"Fallido", refunded:"Reembolsado", approved:"Aprobada",
      rejected:"Rechazada", pendiente:"Pendiente", completado:"Completado",
      completada:"Completada", rechazado:"Rechazado", rechazada:"Rechazada",
      review:"En revisión", under_review:"En revisión", manual_review:"En revisión",
      revision:"En revisión", en_revision:"En revisión", reviewing:"En revisión"
    };
    return estados[clave] || (estado ? String(estado) : "Pendiente");
  }

  function categoriaEstado(estado) {
    const clave = normalizarEstado(estado);

    // Los pedidos finalizados no deben permanecer en el filtro "Revisión".
    if ([
      "completed", "completado", "completada", "approved", "aprobado", "aprobada"
    ].includes(clave)) return "completados";

    if ([
      "pending", "processing", "pendiente", "procesando", "queued", "submitted"
    ].includes(clave)) return "pendientes";

    // Solo los estados que indican revisión explícitamente aparecen en ese filtro.
    if ([
      "review", "under_review", "manual_review", "revision", "en_revision",
      "reviewing", "pending_review", "in_review", "en_revision_manual"
    ].includes(clave)) return "revision";

    // Cancelados, rechazados, fallidos y reembolsados siguen en "Todos",
    // pero salen de "Revisión" porque ya no requieren revisión.
    if ([
      "cancelled", "canceled", "cancelado", "cancelada",
      "rejected", "rechazado", "rechazada",
      "failed", "fallido", "fallida", "error",
      "refunded", "reembolsado", "reembolsada"
    ].includes(clave)) return "finalizados";

    // No clasificar automáticamente estados desconocidos como "En revisión".
    return "otros";
  }

  function claseEstado(estado) {
    const categoria = categoriaEstado(estado);
    if (categoria === "pendientes") return "pendiente";
    if (categoria === "revision") {
      const clave = normalizarEstado(estado);
      if (["failed","fallido","rejected","rechazado","rechazada","refunded","reembolsado"].includes(clave)) return "error";
      return "revision";
    }
    return "";
  }

  function iconoJuego() {
    return '<svg viewBox="0 0 64 44" fill="none" aria-hidden="true"><path d="M16 7.5h32c5.4 0 9.4 3.3 11 9l3 12.1c1.3 5.2-4.6 9-8.7 5.7l-8.1-6.6H18.8l-8.1 6.6C6.6 37.6.7 33.8 2 28.6L5 16.5c1.6-5.7 5.6-9 11-9Z" fill="#0b1d31" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/><path d="M13 15v10M8 20h10" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><circle cx="49" cy="17" r="2" fill="currentColor"/><circle cx="54" cy="22" r="2" fill="currentColor"/><path d="M24 29.2h16" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".8"/></svg>';
  }

  function campo(etiqueta, valor, clase="") {
    return `<div class="detalle-fila"><span class="detalle-etiqueta">${escaparHTML(etiqueta)}</span><span class="detalle-valor ${clase}">${escaparHTML(valor ?? "No disponible")}</span></div>`;
  }

  function prepararPedido(tipo, datos, fecha, titulo, estado, detalles) {
    return { tipo, datos, fecha, titulo, estado, detalles, categoria: categoriaEstado(estado) };
  }

  function rutaImagenJuego(titulo) {
    const nombre = String(titulo || "").toLowerCase();
    const imagenes = [
      { claves: ["free fire", "freefire"], ruta: "./imagenes/file_00000000323881f5b39e628c9a42a0d2.png" },
      { claves: ["call of duty", "cod mobile", "codmobile"], ruta: "./imagenes/IMG-20260926-WA0024.jpg" },
      { claves: ["mobile legends", "mobilelegends"], ruta: "./imagenes/file_00000000a7e081f9b4b5577efa5f6066.png" },
      { claves: ["blood strike", "bloodstrike"], ruta: "./imagenes/file_00000000da8481f980717bbfaf5b7888.png" },
      { claves: ["pubg mobile", "pubgmobile", "pubg"], ruta: "./imagenes/file_00000000cde881f6a366f4dbeb1a5fd0.png" },
      { claves: ["honor of kings", "honorofkings"], ruta: "./imagenes/file_00000000061881f7812f5a04ddc3600d.png" },
      { claves: ["arena breakout", "arenabreakout"], ruta: "./imagenes/file_00000000eb3881f9a2e363c447e0f6ba.png" },
      { claves: ["genshin impact", "genshinimpact"], ruta: "./imagenes/file_00000000266081f685eb030a10579fbe.png" }
    ];
    const juego = imagenes.find(item => item.claves.some(clave => nombre.includes(clave)));
    return juego ? juego.ruta : "";
  }

  function precioVisible(item) {
    const datos = item.datos || {};
    if (item.tipo === "juego") return `${Number(datos.price_gvr || 0).toLocaleString("es-ES",{maximumFractionDigits:2})} GVR`;
    if (item.tipo === "gvr_anterior") return `${Number(datos.precio || 0).toLocaleString("es-ES",{maximumFractionDigits:2})} ${datos.moneda || "USD"}`;
    return `${Number(datos.payment_amount || 0).toLocaleString("es-ES",{maximumFractionDigits:2})} ${datos.payment_currency || ""}`.trim();
  }

  function subtituloVisible(item) {
    const datos = item.datos || {};
    if (item.tipo === "juego") {
      const producto = Array.isArray(datos.game_products) ? datos.game_products[0] : datos.game_products;
      const juego = producto?.game || String(item.titulo || "").split(" · ")[0] || "Recarga de juego";
      return datos.player_id ? `${juego} · ID ${datos.player_id}` : juego;
    }
    if (item.tipo === "gvr_anterior") return `Compra de saldo · ${datos.metodo_pago || "GVR"}`;
    return `Solicitud de saldo · ${datos.payment_method || "Pago pendiente"}`;
  }

  function etiquetaFecha(fecha) {
    const d = new Date(fecha);
    if (Number.isNaN(d.getTime())) return "Fecha no disponible";
    const hoy = new Date();
    const ayer = new Date(hoy);
    ayer.setDate(hoy.getDate()-1);
    const clave = x => `${x.getFullYear()}-${x.getMonth()}-${x.getDate()}`;
    if (clave(d) === clave(hoy)) return "Hoy";
    if (clave(d) === clave(ayer)) return "Ayer";
    return d.toLocaleDateString("es-ES",{day:"numeric",month:"long"});
  }

  function claveFecha(fecha) {
    const d = new Date(fecha);
    return Number.isNaN(d.getTime()) ? "sin-fecha" : `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }

  function actualizarResumen() {
    const ahora = new Date();
    const entregadas = historialCompleto.filter(item => item.categoria === "completados").length;
    const curso = historialCompleto.filter(item => ["pendientes","revision"].includes(item.categoria)).length;
    const mes = historialCompleto.filter(item => {
      const d = new Date(item.fecha);
      return !Number.isNaN(d.getTime()) && d.getMonth() === ahora.getMonth() && d.getFullYear() === ahora.getFullYear();
    }).length;
    document.getElementById("statEntregadas").textContent = entregadas;
    document.getElementById("statCurso").textContent = curso;
    document.getElementById("statMes").textContent = mes;
    document.getElementById("countTodos").textContent = historialCompleto.length;
    document.getElementById("countCompletados").textContent = entregadas;
    document.getElementById("countPendientes").textContent = historialCompleto.filter(item => item.categoria === "pendientes").length;
    document.getElementById("countRevision").textContent = historialCompleto.filter(item => item.categoria === "revision").length;
  }

  function crearElementoPedido(item) {
    const detalles = document.createElement("details");
    detalles.className = "pedido";
    detalles.dataset.categoria = item.categoria;

    const resumen = document.createElement("summary");
    const rutaImagen = item.tipo === "juego" ? rutaImagenJuego(item.titulo) : "";
    const visualJuego = rutaImagen
      ? `<span class="icono-juego"><img src="${rutaImagen}" alt="" loading="lazy"></span>`
      : `<span class="icono-juego">${iconoJuego()}</span>`;
    const estado = traducirEstado(item.estado);
    const clase = claseEstado(item.estado);
    const hora = item.fecha ? new Date(item.fecha).toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}) : "—";
    const codigo = item.tipo === "gvr_solicitud" ? codigoPedidoVisible(item.datos?.id) : codigoPedidoVisible(item.datos?.id);
    const centro = document.createElement("span");
    centro.className = "pedido-centro";
    centro.innerHTML = `<span class="pedido-titulo">${escaparHTML(item.titulo)}</span><span class="pedido-subtitulo">${escaparHTML(subtituloVisible(item))}</span><span class="pedido-meta">${escaparHTML(hora)} · ${escaparHTML(codigo)}</span>`;
    const derecha = document.createElement("span");
    derecha.className = "pedido-derecha";
    derecha.innerHTML = `<span class="pedido-precio">${escaparHTML(precioVisible(item))}</span><span class="estado-chip ${escaparHTML(clase)}">${escaparHTML(estado)}</span>`;
    const flecha = document.createElementNS("http://www.w3.org/2000/svg","svg");
    flecha.setAttribute("class","flecha");flecha.setAttribute("viewBox","0 0 24 24");flecha.setAttribute("fill","none");flecha.setAttribute("stroke","currentColor");flecha.setAttribute("stroke-width","2");flecha.setAttribute("stroke-linecap","round");flecha.setAttribute("stroke-linejoin","round");flecha.setAttribute("aria-hidden","true");
    flecha.innerHTML = '<path d="m6 9 6 6 6-6"/>';
    resumen.append(visualJuego,centro,derecha,flecha);
    detalles.appendChild(resumen);

    const panel = document.createElement("div");
    panel.className = "detalles";
    panel.innerHTML = item.detalles;
    detalles.appendChild(panel);
    return detalles;
  }

  function renderizarHistorial() {
    listaPedidos.replaceChildren();
    const filtrados = historialCompleto.filter(item => filtroActual === "todos" || item.categoria === filtroActual);
    if (!filtrados.length) {
      estadoCarga.style.display = "block";
      estadoCarga.className = "vacio";
      estadoCarga.textContent = filtroActual === "todos" ? "Todavía no tienes pedidos." : "No hay pedidos en esta categoría.";
      return;
    }
    estadoCarga.style.display = "none";
    const grupos = new Map();
    filtrados.forEach(item => {
      const clave = claveFecha(item.fecha);
      if (!grupos.has(clave)) grupos.set(clave,[]);
      grupos.get(clave).push(item);
    });
    const fragmento = document.createDocumentFragment();
    grupos.forEach((items, clave) => {
      const grupo = document.createElement("section");
      grupo.className = "grupo-fecha";
      const cabecera = document.createElement("div");
      cabecera.className = "grupo-fecha-cabecera";
      const titulo = document.createElement("h2");
      titulo.className = "grupo-fecha-titulo";
      titulo.textContent = clave === "sin-fecha" ? "Fecha no disponible" : etiquetaFecha(items[0].fecha);
      const cantidad = document.createElement("span");
      cantidad.className = "grupo-fecha-cantidad";
      cantidad.textContent = `${items.length} ${items.length === 1 ? "pedido" : "pedidos"}`;
      cabecera.append(titulo,cantidad);
      const listaGrupo = document.createElement("div");
      listaGrupo.className = "grupo-pedidos";
      items.forEach(item => listaGrupo.appendChild(crearElementoPedido(item)));
      grupo.append(cabecera,listaGrupo);
      fragmento.appendChild(grupo);
    });
    listaPedidos.appendChild(fragmento);
  }

  botonesFiltro.forEach(boton => {
    boton.addEventListener("click", () => {
      filtroActual = boton.dataset.filtro;
      botonesFiltro.forEach(otro => {
        const activo = otro === boton;
        otro.classList.toggle("activo", activo);
        otro.setAttribute("aria-pressed", String(activo));
      });
      renderizarHistorial();
    });
  });

  async function cargarPedidos() {
    estadoCarga.style.display = "block";
    estadoCarga.className = "vacio";
    estadoCarga.textContent = "Cargando pedidos...";
    listaPedidos.replaceChildren();

    const { data: { session }, error: errorSesion } = await supabaseClient.auth.getSession();
    if (errorSesion || !session) {
      alert("Debes iniciar sesión primero.");
      window.location.href = "login.html";
      return;
    }

    const userId = session.user.id;
    const [resultadoJuegos, resultadoVentas, resultadoSolicitudes] = await Promise.all([
      supabaseClient.from("game_orders").select(`id,price_gvr,status,player_id,created_at,completed_at,game_products(game,product_name,game_currency_amount)`).eq("user_id", userId).order("created_at", { ascending: false }),
      supabaseClient.from("ventas").select(`id,tipo,usuario_id,nombre_usuario,correo_usuario,juego,id_jugador,producto,cantidad,gvr_comprado,precio,moneda,metodo_pago,estado,proveedor,id_orden_proveedor,created_at,updated_at`).eq("usuario_id", userId).order("created_at", { ascending: false }),
      supabaseClient.from("gvr_purchase_requests").select(`id,gvr_amount,payment_method,payment_amount,payment_currency,status,created_at,reviewed_at,review_note`).eq("user_id", userId).order("created_at", { ascending: false })
    ]);

    console.error("Resultado historial game_orders:", resultadoJuegos.error || "OK");
    console.error("Resultado historial ventas:", resultadoVentas.error || "OK");
    console.error("Resultado historial solicitudes GVR:", resultadoSolicitudes.error || "OK");

    const todoFallo = resultadoJuegos.error && resultadoVentas.error && resultadoSolicitudes.error;
    if (todoFallo) {
      estadoCarga.className = "vacio error";
      estadoCarga.textContent = "No se pudo cargar el historial. Inténtalo de nuevo.";
      const boton = document.createElement("button");
      boton.type = "button";
      boton.className = "boton-reintentar";
      boton.textContent = "Reintentar";
      boton.addEventListener("click", () => cargarPedidos().catch(mostrarError));
      estadoCarga.appendChild(document.createElement("br"));
      estadoCarga.appendChild(boton);
      return;
    }

    const historial = [];
    (resultadoJuegos.data || []).forEach(pedido => {
      const producto = Array.isArray(pedido.game_products) ? pedido.game_products[0] : pedido.game_products;
      const juego = producto?.game || "Recarga de juego";
      const nombreProducto = producto?.product_name || (producto?.game_currency_amount != null ? `${producto.game_currency_amount} unidades` : "Producto");
      const detalles = [
        campo("Estado", traducirEstado(pedido.status), `estado ${claseEstado(pedido.status)}`),
        campo("Producto", nombreProducto),
        campo("ID del jugador", pedido.player_id || "No disponible"),
        campo("Precio", `${pedido.price_gvr ?? 0} GVR`),
        campo("Pedido", codigoPedidoVisible(pedido.id)),
        campo("Fecha", fechaLegible(pedido.created_at)),
        ...(pedido.completed_at ? [campo("Completado", fechaLegible(pedido.completed_at))] : [])
      ].join("");
      historial.push(prepararPedido("juego", pedido, pedido.created_at, `${juego} · ${nombreProducto}`, pedido.status, detalles));
    });

    (resultadoVentas.data || []).forEach(venta => {
      if (String(venta.tipo || "").toLowerCase() !== "gvr") return;
      const detalles = [
        campo("Estado", traducirEstado(venta.estado), `estado ${claseEstado(venta.estado)}`),
        campo("Cantidad", `${venta.gvr_comprado || 0} GVR`),
        campo("Precio", `${venta.precio || 0} ${venta.moneda || ""}`.trim()),
        campo("Método de pago", venta.metodo_pago || "No especificado"),
        campo("Pedido", codigoPedidoVisible(venta.id)),
        campo("Fecha", fechaLegible(venta.created_at))
      ].join("");
      historial.push(prepararPedido("gvr_anterior", venta, venta.created_at, `Compra de GVR · ${venta.gvr_comprado || 0} GVR`, venta.estado, detalles));
    });

    (resultadoSolicitudes.data || []).forEach(solicitud => {
      const detalles = [
        campo("Estado", traducirEstado(solicitud.status), `estado ${claseEstado(solicitud.status)}`),
        campo("Cantidad solicitada", `${solicitud.gvr_amount ?? 0} GVR`),
        campo("Importe", `${solicitud.payment_amount ?? "No disponible"} ${solicitud.payment_currency || ""}`.trim()),
        campo("Método de pago", solicitud.payment_method || "No especificado"),
        campo("Solicitud", solicitud.id),
        campo("Fecha", fechaLegible(solicitud.created_at)),
        ...(solicitud.reviewed_at ? [campo("Revisada", fechaLegible(solicitud.reviewed_at))] : []),
        ...(solicitud.review_note ? [campo("Nota de revisión", solicitud.review_note)] : [])
      ].join("");
      historial.push(prepararPedido("gvr_solicitud", solicitud, solicitud.created_at, `Solicitud de GVR · ${solicitud.gvr_amount ?? 0} GVR`, solicitud.status, detalles));
    });

    historial.sort((a, b) => new Date(b.fecha || 0) - new Date(a.fecha || 0));
    historialCompleto = historial;
    actualizarResumen();
    renderizarHistorial();
  }

  function mostrarError(error) {
    console.error("Error inesperado en el historial:", error);
    estadoCarga.style.display = "block";
    estadoCarga.className = "vacio error";
    estadoCarga.textContent = "Ocurrió un error al cargar el historial. Recarga la página.";
  }

  cargarPedidos().catch(mostrarError);
  </script>
