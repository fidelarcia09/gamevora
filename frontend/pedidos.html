<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Historial de pedidos | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor {
            max-width: 500px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .volver {
            color: #28a9ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .card {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .descripcion {
            text-align: center;
            color: #8195ad;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .pedido {
            background: #061226;
            border: 1px solid #173d63;
            border-radius: 13px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .fila {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .juego {
            font-size: 15px;
            font-weight: bold;
        }

        .estado {
            color: #38d996;
            font-size: 12px;
            font-weight: bold;
        }

        .detalle {
            color: #8195ad;
            font-size: 12px;
            margin-top: 7px;
            line-height: 1.5;
        }

        .vacio {
            text-align: center;
            color: #7188a0;
            font-size: 13px;
            padding: 25px 10px;
        }

        .nota {
            margin-top: 20px;
            text-align: center;
            color: #627b97;
            font-size: 11px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <div class="header">

        <div class="logo">
            <span class="rayo">⚡</span> Gamers Gold Top-Up
        </div>

        <a href="cuenta.html" class="volver">
            ← Mi cuenta
        </a>

    </div>

    <div class="card">

        <h1>Historial de pedidos</h1>

        <p class="descripcion">
            Aquí aparecerán tus compras y recargas.
        </p>

        <div class="vacio">
            Cargando pedidos...
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
    "https://gsuhzcavghsiolmipnzi.supabase.co",
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx"
);

async function cargarPedidos() {

    const {
        data: { session },
        error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError || !session) {
        alert("Debes iniciar sesión primero.");
        window.location.href = "login.html";
        return;
    }

    const { data: pedidos, error } = await supabaseClient
        .from("game_orders")
        .select(`
            id,
            price_gvr,
            status,
            player_id,
            created_at,
            completed_at,
            game_products (
                game,
                product_name,
                game_currency_amount
            )
        `)
        .eq("user_id", session.user.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        alert("No se pudieron cargar los pedidos:\n\n" + error.message);
        return;
    }

    const card = document.querySelector(".card");
    const vacio = document.querySelector(".vacio");

    if (!pedidos || pedidos.length === 0) {
        vacio.textContent = "Todavía no tienes pedidos.";
        return;
    }

    vacio.style.display = "none";

    pedidos.forEach((pedido) => {

        const producto = pedido.game_products;

        const tarjeta = document.createElement("div");
        tarjeta.className = "pedido";

        tarjeta.innerHTML = `
            <div class="fila">
                <div class="juego">
                    ${producto?.game || "Juego"}
                </div>

                <div class="estado">
                    ${pedido.status}
                </div>
            </div>

            <div class="detalle">
                Producto: ${producto?.product_name || "Producto"}<br>
                ID del jugador: ${pedido.player_id || "No disponible"}<br>
                Precio: ${pedido.price_gvr} GVR<br>
                Pedido: ${pedido.id}<br>
                Fecha: ${new Date(pedido.created_at).toLocaleString("es-ES")}
            </div>
        `;

        card.insertBefore(tarjeta, vacio);
    });
}

cargarPedidos();
</script>
    
</body>
</html>
