<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ofertas Especiales | Call of Duty Mobile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            border-bottom: 1px solid #12385f;
            background: #071225;
        }

        .logo {
            font-size: 20px;
            font-weight: 900;
        }

        .logo .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .volver {
            text-decoration: none;
            color: white;
            border: 1px solid #168cff;
            padding: 9px 13px;
            border-radius: 9px;
            font-size: 13px;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 25px 18px;
        }

        .ofertas {
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.12);
        }

        .icono {
            text-align: center;
            font-size: 45px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 7px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 13px;
            margin-bottom: 22px;
        }

        /* =========================
           LISTA DE OFERTAS
           ========================= */

        .lista-ofertas {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* =========================
           TARJETAS CUADRADAS
           ========================= */

        .boton-oferta {
            width: 100%;
            aspect-ratio: 1 / 1;

            padding: 0;

            border: 1px solid #204c78;
            border-radius: 16px;

            background: #061226;
            color: white;

            cursor: pointer;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            transition: 0.2s;

            box-shadow: 0 0 12px rgba(0, 140, 255, 0.08);
        }

        .boton-oferta:hover {
            border-color: #159dff;
            background: #0a1d38;
            box-shadow: 0 0 18px rgba(0, 157, 255, 0.22);
            transform: translateY(-2px);
        }

        /* =========================
           FOTO
           ========================= */

        .foto-oferta {
            width: 100%;
            flex: 1;

            background: #07172d;

            display: flex;
            align-items: center;
            justify-content: center;

            border-bottom: 1px solid #204c78;

            overflow: hidden;
        }

        .foto-oferta span {
            color: #315779;
            font-size: 13px;
        }

        /* =========================
           NOMBRE
           ========================= */

        .nombre-oferta {
            width: 100%;

            min-height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 10px;

            background: #091a35;

            color: white;

            font-size: 15px;
            font-weight: bold;

            text-align: center;
        }

        /* =========================
           SELECCIONADA
           ========================= */

        .boton-oferta.seleccionado {
            border-color: #00baff;

            background: linear-gradient(
                180deg,
                #09244a,
                #0b315c
            );

            box-shadow:
                0 0 10px rgba(0, 186, 255, 0.25),
                0 0 22px rgba(0, 140, 255, 0.15);
        }

        .boton-oferta.seleccionado .foto-oferta {
            border-bottom-color: #00baff;
            background: #09213f;
        }

        .boton-oferta.seleccionado .nombre-oferta {
            background: #0b315c;
            color: #00baff;
        }

        /* =========================
           FORMULARIO DE COMPRA
           ========================= */

        .formulario-compra {
            display: none;

            margin-top: 22px;

            padding-top: 22px;

            border-top: 1px solid #12385f;
        }

        .formulario-compra.mostrar {
            display: block;
        }

        .oferta-seleccionada {
            text-align: center;

            color: #00baff;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #b8c9dc;

            font-size: 13px;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            background: #061226;

            color: white;

            border: 1px solid #204c78;

            border-radius: 10px;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #159dff;

            box-shadow:
                0 0 8px rgba(0, 157, 255, 0.2);
        }

        .continuar {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #087cff,
                    #00baff
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .continuar:disabled {
            opacity: 0.6;

            cursor: wait;
        }

        .nota {
            text-align: center;

            color: #627b97;

            font-size: 11px;

            margin-top: 18px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <span class="rayo">⚡</span> Gamers Gold Top-Up
    </div>

    <a href="codmobile.html" class="volver">
        ← Volver
    </a>

</header>


<main class="contenedor">

    <section class="ofertas">

        <div class="icono">
            🎁
        </div>

        <h1>
            Ofertas Especiales
        </h1>

        <p class="descripcion">
            Elige una oferta especial de Call of Duty Mobile.
        </p>


        <div class="lista-ofertas">


            <!-- =========================
                 OFERTA 1
                 ========================= -->

            <button
                class="boton-oferta"
                type="button"
                data-producto="Battle Pass"
                onclick="seleccionarOferta(this)"
            >

                <div class="foto-oferta">
                    <span>Foto de la oferta</span>
                </div>

                <div class="nombre-oferta">
                    🎟️ Battle Pass
                </div>

            </button>


            <!-- =========================
                 OFERTA 2
                 ========================= -->

            <button
                class="boton-oferta"
                type="button"
                data-producto="Oferta de CP"
                onclick="seleccionarOferta(this)"
            >

                <div class="foto-oferta">
                    <span>Foto de la oferta</span>
                </div>

                <div class="nombre-oferta">
                    💎 Oferta de CP
                </div>

            </button>


            <!-- =========================
                 OFERTA 3
                 ========================= -->

            <button
                class="boton-oferta"
                type="button"
                data-producto="Oferta Especial"
                onclick="seleccionarOferta(this)"
            >

                <div class="foto-oferta">
                    <span>Foto de la oferta</span>
                </div>

                <div class="nombre-oferta">
                    👑 Oferta Especial
                </div>

            </button>

        </div>


        <!-- =========================
             FORMULARIO DE COMPRA
             ========================= -->

        <div
            class="formulario-compra"
            id="formularioCompra"
        >

            <div
                class="oferta-seleccionada"
                id="ofertaSeleccionada"
            ></div>


            <label for="idJugador">
                ID del jugador
            </label>


            <input
                type="text"
                id="idJugador"
                placeholder="Escribe tu ID de Call of Duty"
                autocomplete="off"
            >


            <button
                class="continuar"
                id="botonCompra"
                type="button"
                onclick="continuarCompra()"
            >
                Continuar ⚡
            </button>

        </div>


        <div class="nota">
            Ofertas de prueba.
        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://gsuhzcavghsiolmipnzi.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    );


/* =========================
   VARIABLES
   ========================= */

let ofertaSeleccionada = null;


/* =========================
   SELECCIONAR OFERTA
   ========================= */

function seleccionarOferta(boton) {

    document
        .querySelectorAll(".boton-oferta")
        .forEach(function(elemento) {

            elemento.classList.remove(
                "seleccionado"
            );

        });


    boton.classList.add(
        "seleccionado"
    );


    ofertaSeleccionada =
        boton.dataset.producto;


    document.getElementById(
        "ofertaSeleccionada"
    ).textContent =
        "Oferta seleccionada: " +
        ofertaSeleccionada;


    document.getElementById(
        "formularioCompra"
    ).classList.add(
        "mostrar"
    );


    document.getElementById(
        "idJugador"
    ).focus();

}


/* =========================
   REALIZAR COMPRA
   ========================= */

async function continuarCompra() {

    const idJugador =
        document
            .getElementById("idJugador")
            .value
            .trim();


    const boton =
        document.getElementById(
            "botonCompra"
        );


    if (!ofertaSeleccionada) {

        alert(
            "Selecciona una oferta."
        );

        return;
    }


    if (idJugador === "") {

        alert(
            "Escribe tu ID de Call of Duty Mobile."
        );

        return;
    }


    boton.disabled = true;

    boton.textContent =
        "Procesando...";


    try {

        /* =========================
           COMPROBAR SESIÓN
        ========================= */

        const {
            data: { session },
            error: sessionError
        } =
            await supabaseClient.auth.getSession();


        if (sessionError || !session) {

            alert(
                "Debes iniciar sesión primero."
            );

            window.location.href =
                "login.html";

            return;
        }


        /* =========================
           BUSCAR PRODUCTO
           
           LOS NOMBRES SE CAMBIARÁN
           CUANDO CREAMOS LOS PRODUCTOS
           ========================= */

        const {
            data: producto,
            error: productoError
        } =
            await supabaseClient
                .from("game_products")
                .select(
                    "id, game, product_name, game_currency_amount, price_gvr, active"
                )
                .eq(
                    "game",
                    "COD Mobile"
                )
                .eq(
                    "product_name",
                    ofertaSeleccionada
                )
                .eq(
                    "active",
                    true
                )
                .maybeSingle();


        console.log(
            "PRODUCTO COD MOBILE:",
            producto
        );

        console.log(
            "ERROR PRODUCTO:",
            productoError
        );


        if (productoError) {

            alert(
                "Error buscando el producto:\n\n" +
                productoError.message
            );

            return;
        }


        if (!producto) {

            alert(
                "Todavía no existe este producto en Supabase.\n\n" +
                "Oferta: " +
                ofertaSeleccionada
            );

            return;
        }


        /* =========================
           REALIZAR COMPRA
           ========================= */

        const {
            data: pedido,
            error: compraError
        } =
            await supabaseClient.rpc(
                "purchase_game_product",
                {
                    p_product_id:
                        producto.id,

                    p_player_id:
                        idJugador
                }
            );


        if (compraError) {

            console.error(
                "ERROR COMPRA:",
                compraError
            );

            alert(
                "No se pudo realizar la compra:\n\n" +
                compraError.message
            );

            return;
        }


        /* =========================
           COMPRA EXITOSA
           ========================= */

        alert(

            "¡Compra realizada! ⚡\n\n" +

            producto.product_name +
            "\n" +

            "Precio: " +
            producto.price_gvr +
            " GVR\n\n" +

            "ID del pedido:\n" +
            pedido

        );


        window.location.href =
            "cuenta.html";


    } catch (error) {

        console.error(
            error
        );


        alert(

            "Ocurrió un error inesperado:\n\n" +
            error.message

        );

    } finally {

        boton.disabled = false;

        boton.textContent =
            "Continuar ⚡";

    }

}

</script>

</body>
    </html>
