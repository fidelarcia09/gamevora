    <style>

        .advertencia {
            background: #101f36;

        .total span {

        }

        button {
            width: 100%;

            margin-top: 20px;

            background: #168cff;

            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0875dc;
        }

        .volver {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #70c4ff;
            text-decoration: none;
        }
    .boton-atras{display:inline-flex;align-items:center;gap:9px;width:fit-content;max-width:100%;margin:0 auto 0 0;color:#eaf7ff;text-decoration:none;font-size:13px;font-weight:800;line-height:1}.icono-atras{width:38px;height:38px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #17649a;border-radius:11px;background:linear-gradient(145deg,#103b65,#08203b);color:#4bcaff;box-shadow:0 5px 15px rgba(0,21,45,.45)}.icono-atras svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.boton-atras:hover .icono-atras{border-color:#28a9ff;background:linear-gradient(145deg,#145184,#09294b)}.boton-atras:focus-visible{outline:2px solid #75d7ff;outline-offset:3px;border-radius:8px}

/* Botón Atrás alineado a la izquierda */

.encabezado-pagina{display:inline-flex;align-items:center;gap:10px;min-width:0;margin:0;color:#eaf7ff;text-decoration:none;font-size:15px;font-weight:800;line-height:1.2}.encabezado-pagina-icono{width:38px;height:38px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #17649a;border-radius:11px;background:linear-gradient(145deg,#103b65,#08203b);color:#4bcaff;box-shadow:0 5px 15px rgba(0,21,45,.35)}.encabezado-pagina-icono svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.encabezado-pagina-titulo{overflow-wrap:anywhere}.encabezado-pagina~.boton-atras{display:none!important}
</style>
</head>

<body>

<header>
    <a class="encabezado-pagina" href="genshinimpact.html" aria-label="Volver atrás"><span class="encabezado-pagina-icono" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/><path d="M9 12h11"/></svg></span><span class="encabezado-pagina-titulo">Confirmar pedido</span></a>
</header>

<div class="contenedor">

    <div class="tarjeta">

        <h1>Confirmar pedido</h1>

        <div class="advertencia">
            Revisa los datos antes de confirmar tu pedido.
        </div>

        <div class="dato">
            <strong>Juego</strong>
            <span>Genshin Impact</span>
        </div>

        <div class="dato">
            <strong>ID del jugador</strong>
            <span id="mostrarId">Cargando...</span>
        </div>

        <div class="dato">
            <strong>Recarga</strong>
            <span id="mostrarCantidad">Cargando...</span>
        </div>

        <div class="total">
            <strong>Total</strong>
            <span id="mostrarPrecio">
                Cargando...
            </span>
        </div>

        <button onclick="confirmarPedido()">
            Confirmar pedido
        </button>

        <a href="genshinimpact.html" class="boton-atras"><span class="icono-atras" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/><path d="M9 12h11"/></svg></span><span>Atrás</span></a>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://gsuhzcavghsiolmipnzi.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    const id =
        parametros.get("id");

    const cantidad =
        parametros.get("cantidad");

    document.getElementById(
        "mostrarId"
    ).textContent =
        id || "No especificado";

    document.getElementById(
        "mostrarCantidad"
    ).textContent =
        cantidad || "No especificada";

    async function cargarPrecio() {

        if (!cantidad) {

            document.getElementById(
                "mostrarPrecio"
            ).textContent =
                "No disponible";

            return;
        }

        const { data, error } =
            await supabaseClient
                .from("game_products")
                .select("price_gvr")
                .eq("game", "Genshin Impact")
                .eq("product_name", cantidad)
                .eq("active", true)
                .maybeSingle();

        if (error || !data) {

            console.error(error);

            document.getElementById(
                "mostrarPrecio"
            ).textContent =
                "No disponible";

            return;
        }

        document.getElementById(
            "mostrarPrecio"
        ).textContent =
            data.price_gvr + " GVR";
    }

    function confirmarPedido() {

        const url =
            "pedido-realizado-genshinimpact.html?id=" +
            encodeURIComponent(id) +
            "&cantidad=" +
            encodeURIComponent(cantidad);

        window.location.href = url;
    }

    cargarPrecio();
</script>

    <script src="./goldi-widget.js?v=20261023-2" defer></script>

</body>
</html>
