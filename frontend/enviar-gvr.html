<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b18">
  <title>Enviar GVR | Gamers Gold Top-Up</title>
  <style>
    :root{color-scheme:dark;--bg:#050b18;--panel:#0a1730;--border:#173b64;--blue:#00b7ff;--purple:#00b7ff;--muted:#91a5bf;--white:#fff;--green:#36e6a0;--red:#ff7588}
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{width:100%;max-width:100%;min-height:100vh;padding:0;overflow-x:clip;background:radial-gradient(ellipse at top,#102750 0%,transparent 48%),var(--bg);color:var(--white)}
    button,input,a{font:inherit;-webkit-tap-highlight-color:transparent}
    .wrap{width:100%;max-width:1180px;margin:0 auto;padding-bottom:30px}
    header{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:70px;margin:0 0 24px;padding:11px 22px;background:rgba(5,11,24,.94);border-bottom:1px solid rgba(105,158,215,.1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .back{color:#8ddfff;text-decoration:none;font-size:14px;font-weight:700}
    .page-title{display:inline-flex;align-items:center;gap:10px;min-width:0;margin:0;color:#eaf7ff;text-decoration:none;font-size:15px;font-weight:800;line-height:1.2}.back{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;flex:0 0 38px;border:1px solid #17649a;border-radius:11px;background:linear-gradient(145deg,#103b65,#08203b);color:#4bcaff;box-shadow:0 5px 15px rgba(0,21,45,.35)}.back svg{width:21px;height:21px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.page-title span{overflow-wrap:anywhere}
    .card{width:100%;max-width:none;background:transparent;border:0;border-radius:0;padding:0 12px;box-shadow:none}
    .saldo-disponible{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px;margin:0 2px 18px;padding:10px 64px 10px 14px;min-height:68px;border:1px solid #17649a;border-radius:10px;background:linear-gradient(110deg,rgba(7,29,56,.96),rgba(6,19,39,.96));box-shadow:0 4px 14px rgba(0,140,255,.10);overflow:hidden}.saldo-disponible-label{font-size:12px;color:#a4d6ff;font-weight:700}.saldo-disponible-valor{font-size:17px;font-weight:900;color:#fff;text-align:left;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.saldo-disponible-valor.cargando{color:#91a5bf;font-size:12px;font-weight:600}.gvr-emblema{position:absolute;right:15px;top:50%;width:39px;height:39px;transform:translateY(-50%);animation:gvrFlotar 3.2s ease-in-out infinite;filter:drop-shadow(0 0 7px rgba(0,183,255,.45));pointer-events:none}.gvr-emblema svg{display:block;width:100%;height:100%;overflow:visible}.gvr-emblema .g-shell{fill:url(#gvrBlue);stroke:#78e0ff;stroke-width:1.1;stroke-linejoin:round}.gvr-emblema .g-cut{fill:#06162b;stroke:#00b7ff;stroke-width:1.1;stroke-linejoin:round}.gvr-emblema .g-glint{fill:none;stroke:#d5f7ff;stroke-width:1.1;stroke-linecap:round;opacity:.9}@keyframes gvrFlotar{0%,100%{translate:0 0;filter:drop-shadow(0 0 5px rgba(0,183,255,.35))}50%{translate:0 -5px;filter:drop-shadow(0 0 10px rgba(0,183,255,.68))}}@media(prefers-reduced-motion:reduce){.gvr-emblema{animation:none}}
    .badge{display:none}
    h1{font-size:clamp(26px,6vw,34px);margin-bottom:9px}
    .intro{display:none}
    label{display:block;font-size:13px;font-weight:700;margin:0 0 9px;color:#dce8fb}
    .field{margin-bottom:19px}
    input{width:100%;border:1px solid #27466d;border-radius:12px;background:#050e20;color:#fff;padding:15px 14px;outline:none;min-height:50px}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #00b7ff20}
    input::placeholder{color:#607692}
    .help{display:none}
    .summary{border:1px solid #293d61;background:#060f21;border-radius:15px;padding:16px;margin:6px 0 19px}
    .summary-title{font-size:12px;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.7px;font-weight:800}
    .line{display:flex;justify-content:space-between;gap:12px;margin:10px 0;font-size:14px;color:#b7c7dd}
    .line strong{color:#fff;text-align:right;font-variant-numeric:tabular-nums}
    .line.total{border-top:1px solid #263b5c;padding-top:13px;margin-top:14px;font-size:15px;color:#fff;font-weight:800}
    .line.total strong{color:#8ddfff}
    .fee-note{font-size:12px;color:#9eafd0;line-height:1.55;margin-top:10px}
    .btn{width:100%;border:0;border-radius:12px;min-height:52px;padding:14px 18px;font-weight:900;cursor:pointer;transition:transform .15s,opacity .15s}
    .btn:active{transform:scale(.99)}.btn:disabled{opacity:.55;cursor:not-allowed}
    .primary{background:linear-gradient(100deg,#087cff,#00baff);color:#fff;box-shadow:0 8px 24px #008cff33}
    .secondary{margin-top:10px;display:block;text-align:center;text-decoration:none;color:#9bdfff;border:1px solid #1d4b72;background:#07162b;border-radius:12px;padding:15px;font-weight:800;font-size:14px}
    .message{display:none;border-radius:12px;padding:13px 14px;margin-bottom:16px;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
    .message.show{display:block}.message.error{border:1px solid #713746;background:#391b29;color:#ffd4dc}.message.success{border:1px solid #1e7059;background:#0b3028;color:#b8ffe5}
    .foot{display:none}
    @media(max-width:600px){header{padding:11px 20px}.card{padding:0 12px}} @media(max-width:380px){.card{padding:0 10px}.line{font-size:13px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="page-title">
        <a class="back" href="wallet.html" aria-label="Volver a Wallet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        </a>
        <span>Enviar GVR</span>
      </div>
    </header>
    <main class="card">
      <h1>Enviar GVR</h1>
      <section class="saldo-disponible" aria-label="Saldo disponible"><span class="saldo-disponible-label">Saldo disponible</span><strong id="saldoDisponibleValor" class="saldo-disponible-valor cargando" aria-live="polite">Consultando saldo…</strong><span class="gvr-emblema" aria-hidden="true"><svg viewBox="0 0 48 48"><defs><linearGradient id="gvrBlue" x1="8" y1="5" x2="39" y2="43" gradientUnits="userSpaceOnUse"><stop stop-color="#83e8ff"/><stop offset=".42" stop-color="#00b7ff"/><stop offset="1" stop-color="#087cff"/></linearGradient></defs><path class="g-shell" d="M38.4 12.3A18 18 0 1 0 42 25H26.1V19.5H47V25A23 23 0 1 1 39.9 8.5Z"/><path class="g-cut" d="M24 24.5H39.2L34.8 30.1H24Z"/><path class="g-glint" d="M13.5 13.1A16.4 16.4 0 0 1 31.2 9.4"/></svg></span></section>

      <div id="mensaje" class="message" role="status" aria-live="polite"></div>

      <form id="formularioTransferencia" novalidate>
        <div class="field">
          <label for="correoDestino">Correo electrónico del destinatario</label>
          <input id="correoDestino" name="correoDestino" type="email" autocomplete="email" maxlength="320" placeholder="usuario@correo.com" required>
        </div>
        <div class="field">
          <label for="cantidadGVR">Cantidad que recibirá (GVR)</label>
          <input id="cantidadGVR" name="cantidadGVR" type="number" min="0.01" max="100000000" step="0.01" inputmode="decimal" placeholder="Ej. 100" required>
        </div>

        <section class="summary" aria-label="Resumen de transferencia">
          <div class="summary-title">Resumen del envío</div>
          <div class="line"><span>El destinatario recibe</span><strong id="resumenCantidad">0 GVR</strong></div>
          <div class="line"><span>Comisión (10 %)</span><strong id="resumenComision">0 GVR</strong></div>
          <div class="line total"><span>Se descontará de tu Wallet</span><strong id="resumenTotal">0 GVR</strong></div>
          <p class="fee-note">La comisión y el saldo se calculan y validan en Supabase; los valores de esta pantalla son solo una vista previa.</p>
        </section>

        <button id="botonEnviar" class="btn primary" type="submit">Confirmar envío de GVR</button>
        <a class="secondary" href="wallet.html">Cancelar y volver</a>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      "use strict";
      const SUPABASE_URL = "https://gsuhzcavghsiolmipnzi.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx";
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      const formulario = document.getElementById("formularioTransferencia");
      const correo = document.getElementById("correoDestino");
      const cantidad = document.getElementById("cantidadGVR");
      const boton = document.getElementById("botonEnviar");
      const mensaje = document.getElementById("mensaje");
      const resumenCantidad = document.getElementById("resumenCantidad");
      const resumenComision = document.getElementById("resumenComision");
      const resumenTotal = document.getElementById("resumenTotal");
      let requestIdPendiente = null;
      let firmaPendiente = null;

      function formatoGVR(valor) {
        return (Number.isFinite(valor) ? valor : 0).toLocaleString("es-ES", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }) + " GVR";
      }

      async function cargarSaldoDisponible() {
        const elemento = document.getElementById("saldoDisponibleValor");
        elemento.textContent = "Consultando saldo…";
        elemento.classList.add("cargando");

        try {
          const { data: authData, error: authError } = await supabaseClient.auth.getUser();
          if (authError || !authData.user) {
            window.location.href = "login.html";
            return;
          }

          const { data: wallet, error } = await supabaseClient
            .from("wallets")
            .select("balance")
            .eq("user_id", authData.user.id)
            .maybeSingle();

          if (error || !wallet || !Number.isFinite(Number(wallet.balance))) {
            elemento.textContent = "No disponible";
            return;
          }

          elemento.textContent = Number(wallet.balance).toFixed(2) + " Gvr";
        } catch (error) {
          console.error("Error consultando saldo disponible:", error);
          elemento.textContent = "No disponible";
        } finally {
          elemento.classList.remove("cargando");
        }
      }

      function mostrarMensaje(texto, tipo) {
        mensaje.textContent = texto;
        mensaje.className = "message show " + tipo;
      }

      function ocultarMensaje() {
        mensaje.textContent = "";
        mensaje.className = "message";
      }

      function actualizarResumen() {
        const importe = Number(cantidad.value);
        const valido = cantidad.value.trim() !== "" && Number.isFinite(importe) && importe > 0 && importe <= 100000000;
        const redondeado = valido ? Math.round((importe + Number.EPSILON) * 100) / 100 : 0;
        const comision = Math.round((redondeado * 0.10 + Number.EPSILON) * 100) / 100;
        resumenCantidad.textContent = formatoGVR(redondeado);
        resumenComision.textContent = formatoGVR(comision);
        resumenTotal.textContent = formatoGVR(Math.round((redondeado + comision) * 100) / 100);
      }

      function crearRequestId() {
        if (window.crypto && typeof window.crypto.randomUUID === "function") {
          return window.crypto.randomUUID();
        }
        const bytes = new Uint8Array(16);
        window.crypto.getRandomValues(bytes);
        bytes[6] = (bytes[6] & 0x0f) | 0x40;
        bytes[8] = (bytes[8] & 0x3f) | 0x80;
        const hex = Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
        return hex.slice(0,8) + "-" + hex.slice(8,12) + "-" + hex.slice(12,16) + "-" + hex.slice(16,20) + "-" + hex.slice(20);
      }

      correo.addEventListener("input", ocultarMensaje);
      cantidad.addEventListener("input", () => {
        ocultarMensaje();
        actualizarResumen();
      });

      formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();
        ocultarMensaje();

        const email = correo.value.trim().toLowerCase();
        const importe = Number(cantidad.value);

        if (!email || !correo.checkValidity()) {
          mostrarMensaje("Introduce un correo electrónico válido.", "error");
          correo.focus();
          return;
        }
        if (!cantidad.value.trim() || !Number.isFinite(importe) || importe <= 0 || importe > 100000000) {
          mostrarMensaje("Introduce una cantidad de GVR mayor que cero y válida.", "error");
          cantidad.focus();
          return;
        }
        if (Math.abs(importe * 100 - Math.round(importe * 100)) > 0.000001) {
          mostrarMensaje("La cantidad puede tener como máximo 2 decimales.", "error");
          cantidad.focus();
          return;
        }

        const amount = Math.round(importe * 100) / 100;
        const fee = Math.round((amount * 0.10 + Number.EPSILON) * 100) / 100;
        const total = Math.round((amount + fee) * 100) / 100;
        const firma = email + "|" + amount;

        if (firma !== firmaPendiente || !requestIdPendiente) {
          requestIdPendiente = crearRequestId();
          firmaPendiente = firma;
        }

        const { data: authData, error: authError } = await supabaseClient.auth.getUser();
        if (authError || !authData.user) {
          window.location.href = "login.html";
          return;
        }
        if (authData.user.email && authData.user.email.toLowerCase() === email) {
          mostrarMensaje("No puedes enviarte GVR a tu propia cuenta.", "error");
          return;
        }

        const confirmado = window.confirm(
          "Confirma tu transferencia:\n\n" +
          "Destinatario: " + email + "\n" +
          "Recibe: " + formatoGVR(amount) + "\n" +
          "Comisión (10 %): " + formatoGVR(fee) + "\n" +
          "Total que se descontará: " + formatoGVR(total) + "\n\n" +
          "¿Deseas continuar?"
        );
        if (!confirmado) return;

        boton.disabled = true;
        boton.textContent = "Procesando envío seguro…";

        try {
          const { data, error } = await supabaseClient.rpc("send_gvr_to_email", {
            p_request_id: requestIdPendiente,
            p_recipient_email: email,
            p_amount: amount
          });

          if (error) {
            throw error;
          }
          if (!data || data.success !== true) {
            throw new Error("Supabase no confirmó la transferencia.");
          }

          await cargarSaldoDisponible();
          mostrarMensaje(
            "¡Transferencia completada! Se enviaron " + formatoGVR(Number(data.amount)) +
            " a " + data.recipient_email + ". Comisión: " + formatoGVR(Number(data.fee)) +
            ". Total descontado: " + formatoGVR(Number(data.total_debit)) +
            ". Ya puedes volver a tu Wallet para consultar el saldo actualizado.",
            "success"
          );
          formulario.querySelectorAll("input").forEach(input => input.disabled = true);
          boton.textContent = "Transferencia completada";
          boton.disabled = true;
          requestIdPendiente = null;
          firmaPendiente = null;
        } catch (error) {
          console.error("Error enviando GVR:", error);
          const texto = String(error && error.message || "");
          let respuesta = "No se pudo confirmar el envío. No repitas la operación con datos nuevos; puedes reintentar con los mismos datos.";
          if (/Saldo insuficiente/i.test(texto)) respuesta = texto;
          else if (/correo|cuenta verificada|destinatario/i.test(texto)) respuesta = texto;
          else if (/iniciar sesión/i.test(texto)) respuesta = texto;
          else if (/ya se procesó|en curso/i.test(texto)) respuesta = texto;
          else if (/No puedes enviarte/i.test(texto)) respuesta = texto;
          mostrarMensaje(respuesta, "error");
          boton.disabled = false;
          boton.textContent = "Reintentar envío";
        }
      });

      supabaseClient.auth.getUser().then(({ data, error }) => {
        if (error || !data.user) {
          window.location.href = "login.html";
        }
      }).catch(() => {
        window.location.href = "login.html";
      });

      actualizarResumen();
      cargarSaldoDisponible();
    })();
  </script>
  <script src="./goldi-widget.js?v=20261023-16" defer></script>
  <script src="./tema-global.js?v=20261023-1" defer></script>
</body>
</html>
