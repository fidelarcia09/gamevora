<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Gamevora</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .recuperar-box {
            width: 100%;
            max-width: 430px;
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .logo span {
            color: white;
        }

        .titulo {
            text-align: center;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #b8c9dc;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        .enviar {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .enviar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .volver {
            text-align: center;
            margin-top: 20px;
            color: #8195ad;
            font-size: 13px;
        }

        .volver a {
            color: #28a9ff;
            text-decoration: none;
            font-weight: bold;
        }

        .mensaje {
            display: none;
            margin-top: 20px;
            padding: 14px;
            background: #061a2e;
            border: 1px solid #15518c;
            border-radius: 10px;
            color: #b8c9dc;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .exito {
            color: #6fd8ff;
        }
    </style>
</head>

<body>

<div class="recuperar-box">

    <div class="logo">
        <span class="rayo">⚡</span> GAME<span>VORA</span>
    </div>

    <h1 class="titulo">
        Recuperar contraseña
    </h1>

    <p class="descripcion">
        Introduce el correo electrónico de tu cuenta y te enviaremos un enlace para crear una nueva contraseña.
    </p>

    <form id="formRecuperar">

        <label for="correo">
            Correo electrónico
        </label>

        <input
            type="email"
            id="correo"
            placeholder="tucorreo@email.com"
            required
        >

        <button
            class="enviar"
            id="botonEnviar"
            type="submit"
        >
            Enviar enlace 🔐
        </button>

    </form>

    <div
        id="mensaje"
        class="mensaje"
    ></div>

    <div class="volver">
        <a href="login.html">
            ← Volver a iniciar sesión
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = window.supabase.createClient(
    "https://gsuhzcavghsiolmipnzi.supabase.co",
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx"
);

document
    .getElementById("formRecuperar")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const correo =
            document
                .getElementById("correo")
                .value
                .trim();

        const boton =
            document.getElementById("botonEnviar");

        const mensaje =
            document.getElementById("mensaje");

        boton.disabled = true;
        boton.textContent = "Enviando...";

        mensaje.style.display = "none";
        mensaje.textContent = "";

        const { error } =
            await supabaseClient.auth.resetPasswordForEmail(
                correo,
                {
                    redirectTo:
                        window.location.origin +
                        "/gamevora/frontend/nueva-contrasena.html"
                }
            );

        if (error) {

            boton.disabled = false;
            boton.textContent = "Enviar enlace 🔐";

            mensaje.style.display = "block";
            mensaje.className = "mensaje";

            mensaje.textContent =
                "No se pudo enviar el enlace.\n\n" +
                error.message;

            return;
        }

        boton.disabled = false;
        boton.textContent = "Enlace enviado ✓";

        mensaje.style.display = "block";
        mensaje.className = "mensaje exito";

        mensaje.textContent =
            "📧 Revisa tu correo electrónico.\n\n" +
            "Te hemos enviado un enlace para recuperar tu contraseña. " +
            "Si no lo ves, revisa también la carpeta de spam.";
    });

</script>

</body>
</html>
