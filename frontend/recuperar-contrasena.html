<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Gamers Gold Top-Up</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #050b18;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .recuperar-box {
            width: 100%;
            max-width: 430px;
            background: #091a35;
            border: 1px solid #15518c;
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 0 30px rgba(0, 140, 255, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .rayo {
            color: #00b7ff;
            text-shadow: 0 0 12px #008cff;
        }

        .logo span {
            color: white;
        }

        .titulo {
            text-align: center;
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .descripcion {
            text-align: center;
            color: #8fa5bd;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            color: #b8c9dc;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 17px;
            background: #061226;
            color: white;
            border: 1px solid #204c78;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #159dff;
            box-shadow: 0 0 8px rgba(0, 157, 255, 0.2);
        }

        .enviar {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #00baff);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .enviar:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .volver {
            text-align: center;
            margin-top: 20px;
            color: #8195ad;
            font-size: 13px;
        }

        .volver a {
            color: #28a9ff;
            text-decoration: none;
            font-weight: bold;
        }

        .mensaje {
            display: none;
            margin-top: 20px;
            padding: 14px;
            background: #061a2e;
            border: 1px solid #15518c;
            border-radius: 10px;
            color: #b8c9dc;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .exito {
            color: #6fd8ff;
        }
    
        .captcha-wrap {
            display: flex;
            justify-content: center;
            margin: 12px 0 16px;
            min-height: 65px;
        }
    .boton-atras{display:inline-flex;align-items:center;gap:9px;width:fit-content;max-width:100%;margin:0 auto 0 0;color:#eaf7ff;text-decoration:none;font-size:13px;font-weight:800;line-height:1}.icono-atras{width:38px;height:38px;flex:0 0 38px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #17649a;border-radius:11px;background:linear-gradient(145deg,#103b65,#08203b);color:#4bcaff;box-shadow:0 5px 15px rgba(0,21,45,.45)}.icono-atras svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.boton-atras:hover .icono-atras{border-color:#28a9ff;background:linear-gradient(145deg,#145184,#09294b)}.boton-atras:focus-visible{outline:2px solid #75d7ff;outline-offset:3px;border-radius:8px}
</style>
</head>

<body>

<div class="recuperar-box">

    <div class="logo">
        <span class="rayo">⚡</span> GAMERS GOLD<span>TOP-UP</span></span>
    </div>

    <h1 class="titulo">
        Recuperar contraseña
    </h1>

    <p class="descripcion">
        Introduce el correo electrónico de tu cuenta y te enviaremos un enlace para crear una nueva contraseña.
    </p>

    <form id="formRecuperar">

        <label for="correo">
            Correo electrónico
        </label>

        <input
            type="email"
            id="correo"
            placeholder="tucorreo@email.com"
            required
        >

        <div class="captcha-wrap">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAFkQPUoJGVxIGYNB" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired" data-error-callback="onTurnstileExpired"></div>
        </div>

        <button
            class="enviar"
            id="botonEnviar"
            type="submit"
        >
            Enviar enlace 🔐
        </button>

    </form>

    <div
        id="mensaje"
        class="mensaje"
    ></div>

    <div class="volver">
        <a href="login.html" class="boton-atras"><span class="icono-atras" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/><path d="M9 12h11"/></svg></span><span>Atrás</span></a>
    </div>

</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = window.supabase.createClient(
    "https://gsuhzcavghsiolmipnzi.supabase.co",
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx"
);

window.ggTurnstileToken = "";
window.onTurnstileSuccess = function(token) { window.ggTurnstileToken = token; };
window.onTurnstileExpired = function() { window.ggTurnstileToken = ""; };

document
    .getElementById("formRecuperar")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const correo =
            document
                .getElementById("correo")
                .value
                .trim();

        const boton =
            document.getElementById("botonEnviar");

        const mensaje =
            document.getElementById("mensaje");

        if (!window.ggTurnstileToken) {
            alert("Completa la verificación de seguridad antes de recuperar la contraseña.");
            return;
        }

        boton.disabled = true;
        boton.textContent = "Enviando...";

        mensaje.style.display = "none";
        mensaje.textContent = "";

        const { error } =
            await supabaseClient.auth.resetPasswordForEmail(
                correo,
                {
                    redirectTo:
                        window.location.origin +
                        "/gamevora/frontend/nueva-contrasena.html",
                    captchaToken: window.ggTurnstileToken
                }
            );

        if (error) {

            window.ggTurnstileToken = "";
            if (window.turnstile) window.turnstile.reset();

            boton.disabled = false;
            boton.textContent = "Enviar enlace 🔐";

            mensaje.style.display = "block";
            mensaje.className = "mensaje";

            mensaje.textContent =
                "No se pudo enviar el enlace.\n\n" +
                error.message;

            return;
        }

        boton.disabled = false;
        boton.textContent = "Enlace enviado ✓";

        mensaje.style.display = "block";
        mensaje.className = "mensaje exito";

        mensaje.textContent =
            "📧 Revisa tu correo electrónico.\n\n" +
            "Te hemos enviado un enlace para recuperar tu contraseña. " +
            "Si no lo ves, revisa también la carpeta de spam.";
    });

</script>

    <script src="./goldi-widget.js?v=20261023-2" defer></script>

</body>
</html>
