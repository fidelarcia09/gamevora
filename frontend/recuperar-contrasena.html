.gg-auth-aura{position:absolute;width:220px;height:170px;top:35px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,149,255,.28),rgba(0,94,255,.08) 45%,transparent 72%);filter:blur(12px);animation:ggAura 5s ease-in-out infinite}

@keyframes ggHeroFlotar{0%,100%{transform:translateY(2px) rotateY(-5deg) rotateZ(-1deg)}50%{transform:translateY(-9px) rotateY(6deg) rotateZ(1deg)}}@keyframes ggHeroGiro{0%,100%{filter:drop-shadow(0 14px 20px rgba(0,137,255,.2))}50%{filter:drop-shadow(0 17px 25px rgba(0,190,255,.38)}}@keyframes ggAura{0%,100%{opacity:.65;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}@keyframes ggOrbita{from{transform:translate(-50%,-50%) rotate(28deg)}to{transform:translate(-50%,-50%) rotate(388deg)}}

@media(prefers-reduced-motion:reduce){.gg-auth-atmosfera span,.gg-auth-personaje,.gg-auth-aura,.gg-auth-orbita-b{animation:none!important}.gg-auth-atmosfera span{opacity:.25}}


/* Borde neón animado, igual al de los index */

<body>
<div class="gg-auth-atmosfera" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="recuperar-box">

    <h1 class="titulo">
        Recuperar contraseña
    </h1>

    <p class="descripcion">
        Introduce el correo electrónico de tu cuenta y te enviaremos un enlace para crear una nueva contraseña.
    </p>

    <form id="formRecuperar">

        <label for="correo">
            Correo electrónico
        </label>

        <input
            type="email"
            id="correo"
            placeholder="tucorreo@email.com"
            required
        >

        <div class="captcha-wrap">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAFkQPUoJGVxIGYNB" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired" data-error-callback="onTurnstileExpired"></div>
        </div>

        <button
            class="enviar"
            id="botonEnviar"
            type="submit"
        >
            Enviar enlace 🔐
        </button>

    </form>

    <div
        id="mensaje"
        class="mensaje"
    ></div>

    

</div>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = window.supabase.createClient(
    "https://gsuhzcavghsiolmipnzi.supabase.co",
    "sb_publishable_VEu9lvcUF1mp0xS0fXHPdA_592bfknx"
);

window.ggTurnstileToken = "";
window.onTurnstileSuccess = function(token) { window.ggTurnstileToken = token; };
window.onTurnstileExpired = function() { window.ggTurnstileToken = ""; };

document
    .getElementById("formRecuperar")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const correo =
            document
                .getElementById("correo")
                .value
                .trim();

        const boton =
            document.getElementById("botonEnviar");

        const mensaje =
            document.getElementById("mensaje");

        if (!window.ggTurnstileToken) {
            alert("Completa la verificación de seguridad antes de recuperar la contraseña.");
            return;
        }

        boton.disabled = true;
        boton.textContent = "Enviando...";

        mensaje.style.display = "none";
        mensaje.textContent = "";

        const { error } =
            await supabaseClient.auth.resetPasswordForEmail(
                correo,
                {
                    redirectTo:
                        window.location.origin +
                        "/gamevora/frontend/nueva-contrasena.html",
                    captchaToken: window.ggTurnstileToken
                }
            );

        if (error) {

            window.ggTurnstileToken = "";
            if (window.turnstile) window.turnstile.reset();

            boton.disabled = false;
            boton.textContent = "Enviar enlace 🔐";

            mensaje.style.display = "block";
            mensaje.className = "mensaje";

            mensaje.textContent =
                "No se pudo enviar el enlace.\n\n" +
                error.message;

            return;
        }

        boton.disabled = false;
        boton.textContent = "Enlace enviado ✓";

        mensaje.style.display = "block";
        mensaje.className = "mensaje exito";

        mensaje.textContent =
            "📧 Revisa tu correo electrónico.\n\n" +
            "Te hemos enviado un enlace para recuperar tu contraseña. " +
            "Si no lo ves, revisa también la carpeta de spam.";
    });

</script>

    <script src="./goldi-widget.js?v=20261023-2" defer></script>
