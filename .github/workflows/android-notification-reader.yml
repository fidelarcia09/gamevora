name: Android notification reader

on:
  push:
    branches:
      - feature/gvr-android-notification-reader
      - feature/gvr-payment-sync
    paths:
      - "android/**"
      - ".github/workflows/android-notification-reader.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-notification-reader.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Add Android SDK tools to PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Run unit tests and build debug APK
        run: gradle -p android testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gamers-gold-payment-reader-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
